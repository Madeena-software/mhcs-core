    <!-- Sisi kiri -->
    <path d="
      M 219 1004
      L 219 430
      C 219 300, 253 240, 329 240
      L 438 240
      C 503 240, 531 286, 531 355
      L 531 525
      C 531 579, 550 604, 590 609
    "/>

    <!-- Sisi kanan -->
    <path d="
      M 1029 1004
      L 1029 430
      C 1029 300, 995 240, 919 240
      L 810 240
      C 745 240, 717 286, 717 355
      L 717 525
      C 717 579, 698 604, 658 609
    "/>
