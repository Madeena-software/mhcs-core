<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="1280" height="1280" viewBox="0 0 1280 1280"
     role="img" aria-label="Simbol garis biru berbentuk M">
  <defs>
    <linearGradient id="blueStroke" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1689D8"/>
      <stop offset="100%" stop-color="#0871BE"/>
    </linearGradient>

    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3"
