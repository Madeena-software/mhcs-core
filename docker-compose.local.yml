# MHCS Core local infrastructure.
# PHP, Composer, and NPM run on the host; only MySQL runs in Docker.
services:
  db:
    image: mysql:8.4
    container_name: mhcs_core-mysql-local
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:?DB_DATABASE is required}
      MYSQL_USER: ${DB_USERNAME:?DB_USERNAME is required}
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD is required}
    ports:
      - "127.0.0.1:${DB_PORT:-3306}:3306"
    volumes:
      - mhcs_core_mysql_local:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s
    restart: unless-stopped

volumes:
  mhcs_core_mysql_local:
