# -----------------------------------------------------------------------------
# MHCS Core - Production Docker Compose (Docker Swarm Mode)
# Source: Madeena-software/deploy-templates/templates/prod/standard-docker-compose.prod.yml
# @ 569a30d4a089b0ee404ed6e963fdd2dfd96d3787
# MHCS specialization: web, queue, scheduler, and image-worker roles.
# The Image Gateway worker attaches to MPIPS_NETWORK_NAME (mhcs-mpips-integration-v1).
# -----------------------------------------------------------------------------
services:

  db:
    image: mysql:8.4
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      update_config:
        parallelism: 1
        order: stop-first
        failure_action: rollback
      rollback_config:
        parallelism: 1
        order: stop-first
      restart_policy:
        condition: any
        delay: 5s
        max_attempts: 5
        window: 120s
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 256M
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?secret required}
      MYSQL_DATABASE: ${DB_DATABASE:?database name required}
      MYSQL_USER: ${DB_USERNAME:?database user required}
      MYSQL_PASSWORD: ${DB_PASSWORD:?secret required}
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - application
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin status -uroot --password=\"$$MYSQL_ROOT_PASSWORD\" 2>/dev/null | grep -q Uptime"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 60s

  app:
    image: "${MHCS_IMAGE:?MHCS_IMAGE must be set to the authorized immutable image}"
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first
        failure_action: rollback
        monitor: 30s
        max_failure_ratio: 0
      rollback_config:
        parallelism: 1
        order: start-first
      restart_policy:
        condition: on-failure
        delay: 20s
        max_attempts: 5
        window: 120s
      resources:
        limits:
          memory: 768M
        reservations:
          memory: 192M
    environment:
      PHP_FPM_ONLY: "1"
      SESSION_DRIVER: database
    volumes:
      - ${APP_STORAGE_HOST_PATH:-app_storage}/app:/var/www/html/storage/app
      - ${APP_LOGS_HOST_PATH:-app_storage/logs}:/var/www/html/storage/logs
      - app_cache:/var/www/html/bootstrap/cache
      - app_public:/var/www/public-files
      - ./VERSION-CURRENT:/var/www/html/VERSION-CURRENT:ro
    env_file: ${MHCS_ENV_FILE:-.env}
    healthcheck:
      test: ["CMD-SHELL", "php -r '$$s=@fsockopen(\"127.0.0.1\",9000);if(!$$s)exit(1);fclose($$s);'"]
      interval: 5s
      timeout: 3s
      retries: 6
      start_period: 20s
    depends_on:
      - db
    networks:
      - application
    extra_hosts:
      - "host.docker.internal:host-gateway"

  queue:
    image: "${MHCS_IMAGE:?MHCS_IMAGE must be set to the authorized immutable image}"
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      update_config:
        parallelism: 1
        order: stop-first
        failure_action: rollback
      rollback_config:
        parallelism: 1
        order: stop-first
      restart_policy:
        condition: any
        delay: 10s
        max_attempts: 5
        window: 120s
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M
    command:
      - sh
      - -lc
      - |
        until php artisan migrate:status >/dev/null 2>&1; do
          echo "[queue] waiting for migrations to be ready..."
          sleep 5
        done
        exec php artisan queue:work --sleep=3 --tries=3 --timeout=90 --max-jobs=500 --memory=128
    stop_grace_period: 120s
    volumes:
      - ${APP_STORAGE_HOST_PATH:-app_storage}/app:/var/www/html/storage/app
      - ${APP_LOGS_HOST_PATH:-app_storage/logs}:/var/www/html/storage/logs
      - ./VERSION-CURRENT:/var/www/html/VERSION-CURRENT:ro
    env_file: ${MHCS_ENV_FILE:-.env}
    healthcheck:
      test: ["CMD-SHELL", "php -r 'exit(is_dir(\"storage/framework/views\") && is_writable(\"storage/framework/views\") && is_dir(\"storage/app\") && is_writable(\"storage/app\") ? 0 : 1);'"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    depends_on:
      - app
    networks:
      - application
    extra_hosts:
      - "host.docker.internal:host-gateway"

  scheduler:
    image: "${MHCS_IMAGE:?MHCS_IMAGE must be set to the authorized immutable image}"
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      update_config:
        parallelism: 1
        order: stop-first
        failure_action: rollback
      rollback_config:
        parallelism: 1
        order: stop-first
      restart_policy:
        condition: any
        delay: 10s
        max_attempts: 5
        window: 120s
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 64M
    command:
      - sh
      - -lc
      - |
        until php artisan migrate:status >/dev/null 2>&1; do
          echo "[scheduler] waiting for migrations to be ready..."
          sleep 5
        done
        exec php artisan schedule:work
    stop_grace_period: 60s
    volumes:
      - ${APP_STORAGE_HOST_PATH:-app_storage}/app:/var/www/html/storage/app
      - ${APP_LOGS_HOST_PATH:-app_storage/logs}:/var/www/html/storage/logs
      - ./VERSION-CURRENT:/var/www/html/VERSION-CURRENT:ro
    env_file: ${MHCS_ENV_FILE:-.env}
    healthcheck:
      test: ["CMD-SHELL", "php -r 'exit(is_dir(\"storage/framework/views\") && is_writable(\"storage/framework/views\") ? 0 : 1);'"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    depends_on:
      - app
    networks:
      - application
    extra_hosts:
      - "host.docker.internal:host-gateway"

  image-worker:
    image: "${MHCS_IMAGE:?MHCS_IMAGE must be set to the authorized immutable image}"
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      update_config:
        parallelism: 1
        order: stop-first
        failure_action: rollback
      rollback_config:
        parallelism: 1
        order: stop-first
      restart_policy:
        condition: any
        delay: 10s
        max_attempts: 5
        window: 120s
      resources:
        limits:
          cpus: "${MHCS_IMAGE_WORKER_CPU_LIMIT:-1.0}"
          memory: "${MHCS_IMAGE_WORKER_MEMORY_LIMIT:-1G}"
          pids: 256 # MHCS_IMAGE_WORKER_PIDS_LIMIT: 256
        reservations:
          memory: 256M
    command:
      - sh
      - -lc
      - |
        until php artisan migrate:status >/dev/null 2>&1; do
          echo "[image-worker] waiting for migrations to be ready..."
          sleep 5
        done
        exec php artisan queue:work --queue=image-gateway --sleep=3 --tries=3 --timeout=${MHCS_IMAGE_WORKER_EXECUTION_TIMEOUT_SECONDS:-390} --max-jobs=100 --memory=256
    stop_grace_period: 400s
    tmpfs:
      - /tmp:size=${MHCS_IMAGE_WORKER_TMPFS_SIZE:-512m}
    volumes:
      - ${APP_STORAGE_HOST_PATH:-app_storage}/app:/var/www/html/storage/app
      - ${APP_LOGS_HOST_PATH:-app_storage/logs}:/var/www/html/storage/logs
      - ./VERSION-CURRENT:/var/www/html/VERSION-CURRENT:ro
    env_file: ${MHCS_ENV_FILE:-.env}
    healthcheck:
      test: ["CMD-SHELL", "php -r 'exit(is_dir(\"storage/framework/views\") && is_writable(\"storage/framework/views\") ? 0 : 1);'"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    depends_on:
      - app
    networks:
      - application
      - mpips_private
    extra_hosts:
      - "host.docker.internal:host-gateway"

  nginx:
    image: nginx:alpine
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      update_config:
        parallelism: 1
        delay: 5s
        order: stop-first
        failure_action: rollback
        monitor: 10s
        max_failure_ratio: 0
      rollback_config:
        parallelism: 1
        order: stop-first
      restart_policy:
        condition: any
        delay: 5s
        max_attempts: 10
        window: 60s
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 32M
    environment:
      MHCS_RELEASE_VERSION: "${APP_VERSION:?APP_VERSION must be set to the authorized source SHA}"
    ports:
      - target: 80
        published: ${APP_PORT:-8013}
        protocol: tcp
        mode: host
    volumes:
      - ./nginx/conf.d/app.conf:/etc/nginx/conf.d/default.conf:ro
      - app_public:/var/www/html/public:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider --timeout=3 http://127.0.0.1/up || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 30s
    depends_on:
      - app
    networks:
      - application

volumes:
  db_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${MYSQL_DATA_HOST_PATH:-/var/lib/mhcs_core/mysql}
  app_storage:
  app_cache:
  app_public:

networks:
  application:
    name: ${MHCS_APPLICATION_NETWORK_NAME:-mhcs-core-application-network}
    external: true
  mpips_private:
    name: ${MPIPS_NETWORK_NAME:-mhcs-mpips-integration-v1}
    external: true
