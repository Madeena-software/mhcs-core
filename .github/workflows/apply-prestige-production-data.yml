name: Apply Prestige Production Data

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type the exact production-data confirmation phrase.
        required: true
        type: string

concurrency:
  group: production-deployment-mhcs_core
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  confirm:
    name: Require explicit confirmation
    runs-on: ubuntu-latest
    steps:
      - name: Validate confirmation phrase
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        shell: bash
        run: |
          set -euo pipefail

          if [ "$CONFIRMATION" != "APPLY-PRESTIGE-2026-08-20-28" ]; then
            echo "FATAL: exact Prestige production-data confirmation is required."
            exit 1
          fi

          echo "Confirmation accepted."

  apply:
    name: Backup, seed, and verify Prestige data
    needs: confirm
    environment: production
    runs-on: self-hosted
    timeout-minutes: 30
    steps:
      - name: Apply guarded Prestige production data operation
        env:
          SUDO_PASSWORD: ${{ secrets.SUDO_PASSWORD }}
          PRESTIGE_EMPLOYEE_CSV: ${{ secrets.PRESTIGE_EMPLOYEE_CSV }}
          PRESTIGE_OPERATOR_CREDENTIALS: ${{ secrets.PRESTIGE_OPERATOR_CREDENTIALS }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077

          EXPECTED_REVISION="86a4c1210f19aed3b0d5482465a458687ab84350"
          CONTAINER_CSV="/tmp/mhcs-prestige-employee.csv"
          CONTAINER_OPERATOR_CREDENTIALS="/var/www/html/research/prestige/operator.txt"
          BOOTSTRAP_CREDENTIAL_PATH="/tmp/mhcs-prestige-bootstrap-credentials.txt"
          APP_CONTAINER=""
          HOST_CSV=""
          HOST_OPERATOR_CREDENTIALS=""
          BACKUP_LOG=""
          CONTAINER_OPERATOR_STAGED=0
          BOOTSTRAP_CREDENTIAL_EXPECTED=0

          _sudo() {
            printf '%s\n' "$SUDO_PASSWORD" | sudo -S -p '' "$@"
          }

          cleanup() {
            if [ -n "${APP_CONTAINER:-}" ]; then
              docker exec -u 0 "$APP_CONTAINER" rm -f -- "$CONTAINER_CSV" >/dev/null 2>&1 || true
              if [ "${CONTAINER_OPERATOR_STAGED:-0}" = "1" ]; then
                docker exec -u 0 "$APP_CONTAINER" rm -f -- "$CONTAINER_OPERATOR_CREDENTIALS" >/dev/null 2>&1 || true
              fi
              if [ "${BOOTSTRAP_CREDENTIAL_EXPECTED:-0}" = "1" ]; then
                docker exec -u 0 "$APP_CONTAINER" rm -f -- "$BOOTSTRAP_CREDENTIAL_PATH" >/dev/null 2>&1 || true
              fi
            fi
            if [ -n "${HOST_CSV:-}" ]; then
              rm -f -- "$HOST_CSV" >/dev/null 2>&1 || true
            fi
            if [ -n "${HOST_OPERATOR_CREDENTIALS:-}" ]; then
              rm -f -- "$HOST_OPERATOR_CREDENTIALS" >/dev/null 2>&1 || true
            fi
            if [ -n "${BACKUP_LOG:-}" ]; then
              rm -f -- "$BACKUP_LOG" >/dev/null 2>&1 || true
            fi
            true
          }
          trap cleanup EXIT

          echo "===> Verify exact production revision before any database operation"
          SERVICE_REPLICAS="$(docker service ls --format '{{.Replicas}}' --filter name=mhcs_core_app 2>/dev/null | head -n 1 || true)"
          if [ "$SERVICE_REPLICAS" != "1/1" ]; then
            echo "FATAL: mhcs_core_app is not exactly one healthy production replica."
            exit 1
          fi

          SERVICE_IMAGE="$(docker service inspect mhcs_core_app --format '{{.Spec.TaskTemplate.ContainerSpec.Image}}' 2>/dev/null || true)"
          if [[ "$SERVICE_IMAGE" != "mhcs_core:${EXPECTED_REVISION}" && "$SERVICE_IMAGE" != "mhcs_core:${EXPECTED_REVISION}"@sha256:* ]]; then
            echo "FATAL: mhcs_core_app service image is not the expected immutable revision."
            exit 1
          fi

          TASK_ID="$(docker service ps mhcs_core_app --filter desired-state=running --no-trunc --format '{{.ID}}' 2>/dev/null | head -n 1 || true)"
          if [ -z "$TASK_ID" ]; then
            echo "FATAL: mhcs_core_app has no current desired running task."
            exit 1
          fi

          TASK_STATE="$(docker service ps mhcs_core_app --filter "id=${TASK_ID}" --format '{{.CurrentState}}' 2>/dev/null || true)"
          case "$TASK_STATE" in
            Running*) ;;
            *)
              echo "FATAL: mhcs_core_app current desired task is not running."
              exit 1
              ;;
          esac

          while IFS= read -r candidate; do
            [ -n "$candidate" ] || continue
            candidate_task="$(docker inspect "$candidate" --format '{{index .Config.Labels "com.docker.swarm.task.id"}}' 2>/dev/null || true)"
            if [ "$candidate_task" = "$TASK_ID" ] || [[ "$candidate_task" == "$TASK_ID"* ]] || [[ "$TASK_ID" == "$candidate_task"* ]]; then
              APP_CONTAINER="$candidate"
              break
            fi
          done < <(docker ps -q --filter "label=com.docker.swarm.service.name=mhcs_core_app" --filter status=running)

          if [ -z "$APP_CONTAINER" ]; then
            echo "FATAL: current desired mhcs_core_app container was not found."
            exit 1
          fi

          CONTAINER_IMAGE="$(docker inspect "$APP_CONTAINER" --format '{{.Config.Image}}' 2>/dev/null || true)"
          if [[ "$CONTAINER_IMAGE" != "mhcs_core:${EXPECTED_REVISION}" && "$CONTAINER_IMAGE" != "mhcs_core:${EXPECTED_REVISION}"@sha256:* ]]; then
            echo "FATAL: current mhcs_core_app container image is not the expected immutable revision."
            exit 1
          fi

          CONTAINER_HEALTH="$(docker inspect "$APP_CONTAINER" --format '{{.State.Health.Status}}' 2>/dev/null || true)"
          if [ "$CONTAINER_HEALTH" != "healthy" ]; then
            echo "FATAL: current mhcs_core_app container is not healthy."
            exit 1
          fi

          VERSION_MOUNT="$(docker inspect "$APP_CONTAINER" --format '{{range .Mounts}}{{if eq .Destination "/var/www/html/VERSION-CURRENT"}}{{.RW}}{{end}}{{end}}' 2>/dev/null || true)"
          if [ "$VERSION_MOUNT" != "false" ]; then
            echo "FATAL: VERSION-CURRENT is not mounted read-only in the current app container."
            exit 1
          fi

          RUNTIME_VERSION="$(docker exec "$APP_CONTAINER" cat /var/www/html/VERSION-CURRENT 2>/dev/null || true)"
          if [ "$RUNTIME_VERSION" != "$EXPECTED_REVISION" ]; then
            echo "FATAL: VERSION-CURRENT does not match the expected production revision."
            exit 1
          fi

          echo "PRODUCTION_REVISION_VERIFIED revision=${EXPECTED_REVISION} health=healthy version_file=match"

          echo "===> Stage protected Environment CSV privately"
          if [ -z "${PRESTIGE_EMPLOYEE_CSV:-}" ]; then
            echo "FATAL: protected Prestige CSV Environment secret is unavailable."
            exit 1
          fi

          HOST_CSV="$(mktemp /tmp/mhcs-prestige-csv.XXXXXX)"
          chmod 600 "$HOST_CSV"
          if ! printf '%s' "$PRESTIGE_EMPLOYEE_CSV" >"$HOST_CSV"; then
            echo "FATAL: protected Prestige CSV could not be staged privately."
            exit 1
          fi
          unset PRESTIGE_EMPLOYEE_CSV

          if [ ! -f "$HOST_CSV" ] || [ -L "$HOST_CSV" ]; then
            echo "FATAL: staged Prestige CSV is not a regular file."
            exit 1
          fi
          HOST_CSV_MODE="$(stat -c '%a' "$HOST_CSV" 2>/dev/null || true)"
          if [ "$HOST_CSV_MODE" != "600" ]; then
            echo "FATAL: staged Prestige CSV permissions are unsafe."
            exit 1
          fi
          HOST_CSV_SIZE="$(stat -c '%s' "$HOST_CSV" 2>/dev/null || true)"
          if [ -z "$HOST_CSV_SIZE" ] || [ "$HOST_CSV_SIZE" -le 0 ]; then
            echo "FATAL: staged Prestige CSV is empty."
            exit 1
          fi

          CSV_ROWS="$(awk 'NR > 1 && length($0) > 0 { rows++ } END { print rows + 0 }' "$HOST_CSV")"
          if [ "$CSV_ROWS" != "37" ]; then
            echo "FATAL: protected Prestige CSV row-count validation failed."
            exit 1
          fi
          echo "CSV_VALIDATED rows=${CSV_ROWS}"

          echo "===> Stage protected Prestige Operator credentials privately"
          if [ -z "${PRESTIGE_OPERATOR_CREDENTIALS:-}" ]; then
            echo "FATAL: protected Prestige Operator credentials are unavailable."
            exit 1
          fi

          HOST_OPERATOR_CREDENTIALS="$(mktemp /tmp/mhcs-prestige-operator.XXXXXX)"
          chmod 600 "$HOST_OPERATOR_CREDENTIALS"
          if ! printf '%s' "$PRESTIGE_OPERATOR_CREDENTIALS" >"$HOST_OPERATOR_CREDENTIALS"; then
            echo "FATAL: protected Prestige Operator credentials could not be staged privately."
            exit 1
          fi
          unset PRESTIGE_OPERATOR_CREDENTIALS

          if [ ! -f "$HOST_OPERATOR_CREDENTIALS" ] || [ -L "$HOST_OPERATOR_CREDENTIALS" ]; then
            echo "FATAL: staged Prestige Operator credentials are not a regular file."
            exit 1
          fi
          HOST_OPERATOR_MODE="$(stat -c '%a' "$HOST_OPERATOR_CREDENTIALS" 2>/dev/null || true)"
          if [ "$HOST_OPERATOR_MODE" != "600" ]; then
            echo "FATAL: staged Prestige Operator credential permissions are unsafe."
            exit 1
          fi
          HOST_OPERATOR_SIZE="$(stat -c '%s' "$HOST_OPERATOR_CREDENTIALS" 2>/dev/null || true)"
          if [ -z "$HOST_OPERATOR_SIZE" ] || [ "$HOST_OPERATOR_SIZE" -le 0 ]; then
            echo "FATAL: staged Prestige Operator credentials are empty."
            exit 1
          fi

          if ! docker exec -i "$APP_CONTAINER" php -r '
            $hasEmail = false;
            $hasPassword = false;
            while (($line = fgets(STDIN)) !== false) {
                $line = trim($line);
                if ($line === "") {
                    continue;
                }
                if (str_starts_with($line, "password:")) {
                    if (trim(substr($line, strlen("password:"))) !== "") {
                        $hasPassword = true;
                    }
                } elseif (filter_var($line, FILTER_VALIDATE_EMAIL) !== false) {
                    $hasEmail = true;
                }
            }
            exit($hasEmail && $hasPassword ? 0 : 1);
          ' < "$HOST_OPERATOR_CREDENTIALS" 2>/dev/null; then
            echo "FATAL: protected Prestige Operator credential structure validation failed."
            exit 1
          fi

          echo "===> Check required production administrator credentials"
          if ! docker exec "$APP_CONTAINER" php -r '
            $email = getenv("SUPER_ADMIN_EMAIL");
            $password = getenv("SUPER_ADMIN_PASSWORD");
            exit(
                is_string($email) && trim($email) !== ""
                && is_string($password) && trim($password) !== ""
                    ? 0
                    : 1
            );
          ' >/dev/null 2>&1; then
            echo "FATAL: required production administrator credentials are unavailable."
            exit 1
          fi

          echo "===> Stage protected Operator credentials in the application container"
          OPERATOR_PATH_STATE="$(docker exec -u 0 "$APP_CONTAINER" sh -c '
            if [ -L "$1" ]; then
              printf symlink
            elif [ -e "$1" ]; then
              printf existing
            else
              printf absent
            fi
          ' sh "$CONTAINER_OPERATOR_CREDENTIALS" 2>/dev/null || true)"
          if [ "$OPERATOR_PATH_STATE" != "absent" ]; then
            echo "FATAL: unexpected existing Prestige Operator credential file."
            exit 1
          fi

          docker cp "$HOST_CSV" "$APP_CONTAINER:$CONTAINER_CSV"
          docker exec -u 0 "$APP_CONTAINER" \
            chown www-data:www-data "$CONTAINER_CSV"
          docker exec -u 0 "$APP_CONTAINER" \
            chmod 600 "$CONTAINER_CSV"
          CONTAINER_CSV_OWNER="$(docker exec "$APP_CONTAINER" stat -c '%U' "$CONTAINER_CSV" 2>/dev/null || true)"
          if [ "$CONTAINER_CSV_OWNER" != "www-data" ]; then
            echo "FATAL: container Prestige CSV ownership is unsafe."
            exit 1
          fi
          CONTAINER_CSV_MODE="$(docker exec "$APP_CONTAINER" stat -c '%a' "$CONTAINER_CSV" 2>/dev/null || true)"
          if [ "$CONTAINER_CSV_MODE" != "600" ]; then
            echo "FATAL: container Prestige CSV copy permissions are unsafe."
            exit 1
          fi

          CONTAINER_OPERATOR_STAGED=1
          OPERATOR_DIRECTORY="$(dirname -- "$CONTAINER_OPERATOR_CREDENTIALS")"
          if ! docker exec "$APP_CONTAINER" test -d "$OPERATOR_DIRECTORY"; then
            docker exec -u 0 "$APP_CONTAINER" mkdir -p -- "$OPERATOR_DIRECTORY"
          fi
          docker cp "$HOST_OPERATOR_CREDENTIALS" "$APP_CONTAINER:$CONTAINER_OPERATOR_CREDENTIALS"
          docker exec -u 0 "$APP_CONTAINER" \
            chown www-data:www-data "$CONTAINER_OPERATOR_CREDENTIALS"
          docker exec -u 0 "$APP_CONTAINER" \
            chmod 600 "$CONTAINER_OPERATOR_CREDENTIALS"
          if ! docker exec -u 0 "$APP_CONTAINER" test -f "$CONTAINER_OPERATOR_CREDENTIALS" \
            || docker exec -u 0 "$APP_CONTAINER" test -L "$CONTAINER_OPERATOR_CREDENTIALS"; then
            echo "FATAL: staged Prestige Operator credential file is unsafe."
            exit 1
          fi
          CONTAINER_OPERATOR_OWNER="$(docker exec "$APP_CONTAINER" stat -c '%U' "$CONTAINER_OPERATOR_CREDENTIALS" 2>/dev/null || true)"
          CONTAINER_OPERATOR_GROUP="$(docker exec "$APP_CONTAINER" stat -c '%G' "$CONTAINER_OPERATOR_CREDENTIALS" 2>/dev/null || true)"
          if [ "$CONTAINER_OPERATOR_OWNER" != "www-data" ] || [ "$CONTAINER_OPERATOR_GROUP" != "www-data" ]; then
            echo "FATAL: container Prestige Operator credential ownership is unsafe."
            exit 1
          fi
          CONTAINER_OPERATOR_MODE="$(docker exec "$APP_CONTAINER" stat -c '%a' "$CONTAINER_OPERATOR_CREDENTIALS" 2>/dev/null || true)"
          if [ "$CONTAINER_OPERATOR_MODE" != "600" ]; then
            echo "FATAL: container Prestige Operator credential permissions are unsafe."
            exit 1
          fi

          BOOTSTRAP_PATH_STATE="$(docker exec -u 0 "$APP_CONTAINER" sh -c '
            if [ -L "$1" ]; then
              printf symlink
            elif [ -e "$1" ]; then
              printf existing
            else
              printf absent
            fi
          ' sh "$BOOTSTRAP_CREDENTIAL_PATH" 2>/dev/null || true)"
          if [ "$BOOTSTRAP_PATH_STATE" != "absent" ]; then
            echo "FATAL: unexpected existing bootstrap credential output file."
            exit 1
          fi

          echo "===> Validate exact diagnosed Prestige pre-reset state"
          PRE_RESET_OUTPUT="$(docker exec "$APP_CONTAINER" php -r '
            require "vendor/autoload.php";
            $app = require "bootstrap/app.php";
            $app->make(Illuminate\Contracts\Console\Kernel::class)->bootstrap();
            $db = Illuminate\Support\Facades\DB::class;
            $site = $db::table("examination_site_refs")->where("operator_site_id", "site-prestige")->where("code", "PRES-01")->first();
            $offering = $db::table("service_offerings")->where("code", "SYN-CHEST-A")->first();
            $starts = ["2026-08-14 01:00:00", "2026-08-26 01:00:00", "2026-08-27 01:00:00"];
            $schedules = $site && $offering ? $db::table("shift_schedules")->where("examination_site_id", $site->id)->where("service_offering_id", $offering->id)->whereIn("starts_at", $starts)->get(["id", "starts_at", "ends_at", "quota", "status"]) : collect();
            $users = $db::table("users")->where("email", "like", "%@prestige.madeena-xray.com")->get(["id", "account_status", "login_enabled"]);
            $members = $db::table("members")->whereIn("user_id", $users->pluck("id"))->get(["id", "user_id"]);
            $expectedSchedules = [
                "2026-08-14 01:00:00" => ["2026-08-14 10:00:00", 50, "open"],
                "2026-08-26 01:00:00" => ["2026-08-26 10:00:00", 50, "open"],
                "2026-08-27 01:00:00" => ["2026-08-27 10:00:00", 50, "open"],
            ];
            $valid = $site && $offering && $schedules->count() === 3 && $users->count() === 37 && $members->count() === 37 && $users->every(static fn ($u): bool => $u->account_status === "active" && (bool) $u->login_enabled) && $members->pluck("user_id")->unique()->count() === 37 && $members->pluck("id")->unique()->count() === 37;
            foreach ($schedules as $schedule) {
                $shape = $expectedSchedules[$schedule->starts_at] ?? null;
                $valid = $valid && $shape !== null && $schedule->ends_at === $shape[0] && (int) $schedule->quota === $shape[1] && $schedule->status === $shape[2];
                $bookings = $db::table("bookings")->where("shift_schedule_id", $schedule->id)->get(["id", "status", "member_id"]);
                $expected = $schedule->starts_at === "2026-08-14 01:00:00" ? ["checked_in" => 4, "confirmed" => 9] : ["confirmed" => 12];
                $valid = $valid && (int) $bookings->count() === array_sum($expected) && $bookings->groupBy("status")->map->count()->all() === $expected && $bookings->pluck("member_id")->unique()->count() === array_sum($expected);
                $valid = $valid && (int) $db::table("point_ledger_entries")->whereIn("booking_id", $bookings->pluck("id"))->count() === $bookings->count() && (int) $db::table("point_ledger_entries")->whereIn("booking_id", $bookings->pluck("id"))->where("entry_type", "charge")->count() === $bookings->count() && !$db::table("point_ledger_entries")->whereIn("booking_id", $bookings->pluck("id"))->whereNotNull("reverses_id")->exists();
                $progressed = [
                    ["local_imaging_orders", "shift_schedule_id"], ["operator_paper_tickets", "member_schedule_id"], ["operator_queue_admissions", "member_schedule_id"], ["operator_arrivals", "member_schedule_id"],
                    ["operator_identity_verifications", "member_schedule_id"], ["member_paper_questionnaires", "member_schedule_id"], ["member_vital_signs_assessments", "member_schedule_id"], ["image_gateway_capture_sets", "member_schedule_id"],
                ];
                $expectedProgressed = $schedule->starts_at === "2026-08-14 01:00:00" ? [0, 4, 8, 4, 4, 4, 4, 0] : [0, 0, 0, 0, 0, 0, 0, 0];
                foreach ($progressed as $index => [$table, $column]) { $valid = $valid && (int) $db::table($table)->where($column, $schedule->id)->count() === $expectedProgressed[$index]; }
                $eligibleRows = $db::table("operator_eligible_shifts")->where("member_schedule_id", $schedule->id)->get(["id"]);
                $eligible = $eligibleRows->count() === 1 ? $eligibleRows->first() : null;
                $valid = $valid && $eligibleRows->count() === 1 && (int) $db::table("operator_shift_assignments")->where("operator_eligible_shift_id", $eligible?->id)->count() === 5 && !$db::table("operator_shift_assignments")->where("operator_eligible_shift_id", $eligible?->id)->where("status", "!=", "active")->exists();
            }
            $bookedMembers = $db::table("bookings")->whereIn("shift_schedule_id", $schedules->pluck("id"))->distinct()->pluck("member_id");
            $valid = $valid && $bookedMembers->count() === 37 && $bookedMembers->diff($members->pluck("id"))->isEmpty() && !$db::table("shift_schedules")->where("examination_site_id", $site?->id)->where("service_offering_id", $offering?->id)->where("starts_at", "2026-08-28 01:00:00")->exists();
            if (!$valid) { exit(1); }
            echo "PRE_RESET_PRECONDITION=pass";
          ' 2>/dev/null)" || {
            echo "FATAL: exact diagnosed Prestige pre-reset state is not present; reset blocked."
            exit 1
          }
          echo "$PRE_RESET_OUTPUT"

          echo "===> Run established verified production database backup"
          if [ -z "${SUDO_PASSWORD:-}" ]; then
            echo "FATAL: existing production backup access credential is unavailable."
            exit 1
          fi
          BACKUP_SCRIPT="/etc/madeena-mhcs_core-db-backup.sh"
          if ! _sudo test -x "$BACKUP_SCRIPT"; then
            echo "FATAL: established production database backup script is unavailable."
            exit 1
          fi

          BACKUP_LOG="$(mktemp /tmp/mhcs-prestige-backup.XXXXXX)"
          chmod 600 "$BACKUP_LOG"
          if ! _sudo "$BACKUP_SCRIPT" >"$BACKUP_LOG" 2>&1; then
            echo "FATAL: database backup failed; seeding blocked."
            exit 1
          fi

          BACKUP_REFERENCE="$(sed -n 's/.*Local backup verified: \([^ ]*\) (.*/\1/p' "$BACKUP_LOG" | tail -n 1)"
          if ! [[ "$BACKUP_REFERENCE" =~ ^[A-Za-z0-9._-]+\.sql\.gz$ ]]; then
            echo "FATAL: database backup produced no sanitized verified reference; seeding blocked."
            exit 1
          fi
          echo "BACKUP_VERIFIED reference=${BACKUP_REFERENCE}"

          echo "===> Run exact PrestigeClinicSeeder with process-scoped production authorization"
          BOOTSTRAP_CREDENTIAL_EXPECTED=1
          docker exec \
            -e MHCS_ALLOW_PRODUCTION_MVP_SEED=true \
            -e PRESTIGE_EMPLOYEE_CSV=/tmp/mhcs-prestige-employee.csv \
            -e MHCS_BOOTSTRAP_CREDENTIAL_PATH=/tmp/mhcs-prestige-bootstrap-credentials.txt \
            "$APP_CONTAINER" \
            php artisan db:seed --class='Database\Seeders\PrestigeClinicSeeder' --force

          echo "===> Verify temporary bootstrap credential output"
          if ! docker exec -u 0 "$APP_CONTAINER" test -f "$BOOTSTRAP_CREDENTIAL_PATH" \
            || docker exec -u 0 "$APP_CONTAINER" test -L "$BOOTSTRAP_CREDENTIAL_PATH"; then
            echo "FATAL: bootstrap credential output is unavailable or unsafe."
            exit 1
          fi
          BOOTSTRAP_OWNER="$(docker exec -u 0 "$APP_CONTAINER" stat -c '%U' "$BOOTSTRAP_CREDENTIAL_PATH" 2>/dev/null || true)"
          if [ "$BOOTSTRAP_OWNER" != "www-data" ]; then
            echo "FATAL: bootstrap credential output ownership is unsafe."
            exit 1
          fi
          BOOTSTRAP_MODE="$(docker exec -u 0 "$APP_CONTAINER" stat -c '%a' "$BOOTSTRAP_CREDENTIAL_PATH" 2>/dev/null || true)"
          if [ "$BOOTSTRAP_MODE" != "600" ]; then
            echo "FATAL: bootstrap credential output permissions are unsafe."
            exit 1
          fi
          BOOTSTRAP_SIZE="$(docker exec -u 0 "$APP_CONTAINER" stat -c '%s' "$BOOTSTRAP_CREDENTIAL_PATH" 2>/dev/null || true)"
          if [ -z "$BOOTSTRAP_SIZE" ] || [ "$BOOTSTRAP_SIZE" -le 0 ]; then
            echo "FATAL: bootstrap credential output is empty."
            exit 1
          fi
          echo "BOOTSTRAP_CREDENTIAL_OUTPUT_VERIFIED"
          echo "SEED_STATUS=success"

          echo "===> Run sanitized read-only Prestige verification"
          if verification_output="$(docker exec "$APP_CONTAINER" php -r '
            require "vendor/autoload.php";
            $app = require "bootstrap/app.php";
            $app->make(Illuminate\Contracts\Console\Kernel::class)->bootstrap();
            $db = Illuminate\Support\Facades\DB::class;

            $site = $db::table("examination_site_refs")
                ->where("operator_site_id", "site-prestige")
                ->where("code", "PRES-01")
                ->where("display_name", "Rumah Skrining CV Prestige")
                ->where("timezone", "Asia/Jakarta")
                ->where("active", true)
                ->first();
            $offering = $db::table("service_offerings")
                ->where("code", "SYN-CHEST-A")
                ->first();
            $expected = [
                ["starts_at" => "2026-08-19 17:00:00", "ends_at" => "2026-08-26 17:00:00", "quota" => 37, "status" => "open"],
                ["starts_at" => "2026-08-26 17:00:00", "ends_at" => "2026-08-27 17:00:00", "quota" => 37, "status" => "open"],
                ["starts_at" => "2026-08-27 17:00:00", "ends_at" => "2026-08-28 17:00:00", "quota" => 37, "status" => "open"],
            ];

            $schedules = $site !== null && $offering !== null
                ? $db::table("shift_schedules")
                    ->where("examination_site_id", $site->id)
                    ->where("service_offering_id", $offering->id)
                    ->whereIn("starts_at", ["2026-08-19 17:00:00", "2026-08-26 17:00:00", "2026-08-27 17:00:00"])
                    ->orderBy("starts_at")
                    ->get(["id", "starts_at", "ends_at", "quota", "status"])
                : collect();
            $allSchedules = $site !== null && $offering !== null
                ? $db::table("shift_schedules")
                    ->where("examination_site_id", $site->id)
                    ->where("service_offering_id", $offering->id)
                    ->get(["id", "starts_at", "ends_at", "quota", "status"])
                : collect();
            $scheduleRows = $schedules->map(static fn (object $row): array => [
                "starts_at" => (string) $row->starts_at,
                "ends_at" => (string) $row->ends_at,
                "quota" => (int) $row->quota,
                "status" => (string) $row->status,
            ])->all();
            $scheduleBoundsMatch = $scheduleRows === $expected;
            $quotaValues = $schedules->map(static fn (object $row): int => (int) $row->quota)->all();
            $confirmedCounts = [];
            $memberSets = [];
            $totalBookings = 0;
            $distinctMembers = 0;
