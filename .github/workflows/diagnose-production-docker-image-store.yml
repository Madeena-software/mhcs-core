name: Diagnose production Docker image store

on:
  workflow_dispatch:

concurrency:
  group: production-deployment-mhcs_core
  cancel-in-progress: false

jobs:
  diagnose:
    name: Read-only production Docker image store diagnostic
    runs-on: self-hosted
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Inspect Docker image store
        shell: bash
        run: |
          set -euo pipefail

          echo "===> Docker versions"
          docker version --format 'Client={{.Client.Version}} Server={{.Server.Version}}' 2>/dev/null || true

          echo "===> Docker storage driver"
          STORAGE_DRIVER="$(docker info --format '{{.Driver}}' 2>/dev/null || true)"
          echo "StorageDriver=${STORAGE_DRIVER}"

          echo "===> Docker driver status"
          DRIVER_STATUS="$(docker info --format 'DriverStatus={{json .DriverStatus}}' 2>/dev/null || true)"
          printf '%s\n' "$DRIVER_STATUS"

          echo "===> daemon.json containerd snapshotter setting"
          if [ ! -r /etc/docker/daemon.json ]; then
            echo 'daemon-json=UNREADABLE'
          elif ! command -v python3 >/dev/null 2>&1; then
            echo 'daemon-json=UNREADABLE'
          else
          python3 -c 'import json, sys; config = json.load(sys.stdin); features = config.get("features", {}); value = features.get("containerd-snapshotter"); print("daemon-containerd-snapshotter=TRUE" if value is True else "daemon-containerd-snapshotter=FALSE" if value is False else "daemon-containerd-snapshotter=UNSET")' \
              < /etc/docker/daemon.json \
              || echo 'daemon-json=INVALID'
          fi

          echo "===> Conservative image store classification"
          if grep -Fq 'io.containerd.snapshotter.v1' <<< "$DRIVER_STATUS"; then
            echo 'image-store-classification=CONTAINERD_IMAGE_STORE'
          elif [ "$STORAGE_DRIVER" = "overlay2" ]; then
            echo 'image-store-classification=CLASSIC_IMAGE_STORE'
          else
            echo 'image-store-classification=INDETERMINATE'
          fi
