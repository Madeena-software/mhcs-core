name: Verify Production

on:
  workflow_dispatch:
    inputs:
      expected_revision:
        description: Optional live application revision to require.
        required: false
        default: ''
        type: string
      run_large_upload_probe:
        description: Run the generated 100 MiB local ingress probe.
        required: false
        default: false
        type: boolean
      verify_prestige:
        description: Run sanitized read-only Prestige invariant checks.
        required: false
        default: false
        type: boolean
      verify_prestige_members:
        description: Run sanitized read-only Prestige Member-account checks.
        required: false
        default: false
        type: boolean
      diagnose_prestige_legacy:
        description: Run sanitized read-only legacy Prestige schedule diagnostics.
        required: false
        default: false
        type: boolean

concurrency:
  group: production-deployment-mhcs_core
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    name: Read-only production verification
    runs-on: self-hosted
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Verify production state without mutation
        env:
          EXPECTED_REVISION: ${{ inputs.expected_revision }}
          RUN_LARGE_UPLOAD_PROBE: ${{ inputs.run_large_upload_probe }}
          VERIFY_PRESTIGE: ${{ inputs.verify_prestige }}
          VERIFY_PRESTIGE_MEMBERS: ${{ inputs.verify_prestige_members }}
          DIAGNOSE_PRESTIGE_LEGACY: ${{ inputs.diagnose_prestige_legacy }}
        shell: bash
        run: |
          set -euo pipefail

          FAIL=0
          if [ -z "$EXPECTED_REVISION" ]; then EXPECTED_REVISION="827b59dd81516e44c0ec10e7afb9b6b804e81226"; fi
          APP_SERVICE="mhcs_core_app"
          DB_SERVICE="mhcs_core_db"
          QUEUE_SERVICE="mhcs_core_queue"
          SCHEDULER_SERVICE="mhcs_core_scheduler"
          IMAGE_WORKER_SERVICE="mhcs_core_image-worker"
          NGINX_SERVICE="mhcs_core_nginx"
          APP_NETWORK="mhcs-core-application-network"
          MPIPS_NETWORK="mhcs-mpips-integration-v1"
          APP_CONTAINER=""

          echo "===> Read-only Swarm and service verification"

          SWARM_STATE="$(docker info --format '{{.Swarm.LocalNodeState}}' 2>/dev/null || true)"
          SWARM_MANAGER="$(docker info --format '{{.Swarm.ControlAvailable}}' 2>/dev/null || true)"
          if [ "$SWARM_STATE" = "active" ]; then
            echo "swarm_active=true"
          else
            echo "swarm_active=false"
            FAIL=1
          fi
          if [ "$SWARM_MANAGER" = "true" ]; then
            echo "swarm_manager=true"
          else
            echo "swarm_manager=false"
            FAIL=1
          fi

          for service in \
            "$DB_SERVICE" \
            "$APP_SERVICE" \
            "$QUEUE_SERVICE" \
            "$SCHEDULER_SERVICE" \
            "$IMAGE_WORKER_SERVICE" \
            "$NGINX_SERVICE"; do
            replicas="$(docker service ls --format '{{.Replicas}}' --filter "name=${service}" 2>/dev/null | head -n 1 || true)"
            echo "service_${service}_replicas=${replicas:-unknown}"
            if [ "$replicas" != "1/1" ]; then
              FAIL=1
            fi
          done

          container_for_service() {
            docker ps \
              -q \
              --filter "label=com.docker.swarm.service.name=$1" \
              --filter status=running \
              | head -n 1
          }

          for service in \
            "$DB_SERVICE" \
            "$APP_SERVICE" \
            "$QUEUE_SERVICE" \
            "$SCHEDULER_SERVICE" \
            "$IMAGE_WORKER_SERVICE" \
            "$NGINX_SERVICE"; do
            container="$(container_for_service "$service")"
            if [ -n "$container" ]; then
              echo "container_${service}_running=true"
            else
              echo "container_${service}_running=false"
              FAIL=1
            fi
            health="$(docker inspect "$container" --format '{{.State.Health.Status}}' 2>/dev/null || true)"
            echo "container_${service}_health=${health:-unavailable}"
            case "$service" in
              "$DB_SERVICE"|"$APP_SERVICE"|"$NGINX_SERVICE")
                if [ "$health" != "healthy" ]; then
                  FAIL=1
                fi
                ;;
            esac
          done

          for network in "$APP_NETWORK" "$MPIPS_NETWORK"; do
            if docker network inspect "$network" --format '{{.Name}}' >/dev/null 2>&1; then
              echo "network_${network}=present"
            else
              echo "network_${network}=missing"
              FAIL=1
            fi
          done

          MPIPS_CONTAINER="$(docker ps -q --filter name=mpips-api --filter status=running | head -n 1)"
          if [ -n "$MPIPS_CONTAINER" ]; then
            echo "mpips_api_running=true"
            MPIPS_HEALTH="$(docker inspect "$MPIPS_CONTAINER" --format '{{.State.Health.Status}}' 2>/dev/null || true)"
            echo "mpips_api_health=${MPIPS_HEALTH:-unavailable}"
          else
            echo "mpips_api_running=false"
            echo "mpips_api_health=unavailable"
            FAIL=1
          fi

          echo "===> Read-only production revision observability"

          SERVICE_REPLICAS="$(docker service ls --format '{{.Replicas}}' --filter "name=${APP_SERVICE}" 2>/dev/null | head -n 1 || true)"
          SERVICE_IMAGE="$(docker service inspect "$APP_SERVICE" --format '{{.Spec.TaskTemplate.ContainerSpec.Image}}' 2>/dev/null || true)"
          TASK_ID="$(docker service ps "$APP_SERVICE" --filter desired-state=running --no-trunc --format '{{.ID}}' 2>/dev/null | head -n 1 || true)"
          TASK_STATE=""
          if [ -n "$TASK_ID" ]; then
            TASK_STATE="$(docker service ps "$APP_SERVICE" --filter "id=${TASK_ID}" --format '{{.CurrentState}}' 2>/dev/null || true)"
          fi

          if [ -n "$TASK_ID" ]; then
            while IFS= read -r candidate; do
              [ -n "$candidate" ] || continue
              candidate_task="$(docker inspect "$candidate" --format '{{index .Config.Labels "com.docker.swarm.task.id"}}' 2>/dev/null || true)"
              if [ "$candidate_task" = "$TASK_ID" ] || [[ "$candidate_task" == "$TASK_ID"* ]] || [[ "$TASK_ID" == "$candidate_task"* ]]; then
                APP_CONTAINER="$candidate"
                break
              fi
            done < <(docker ps -q --filter "label=com.docker.swarm.service.name=${APP_SERVICE}" --filter status=running)
          fi

          CONTAINER_IMAGE=""
          CONTAINER_HEALTH=""
          RAW_VERSION_CURRENT=""
          if [ -n "$APP_CONTAINER" ]; then
            CONTAINER_IMAGE="$(docker inspect "$APP_CONTAINER" --format '{{.Config.Image}}' 2>/dev/null || true)"
            CONTAINER_HEALTH="$(docker inspect "$APP_CONTAINER" --format '{{.State.Health.Status}}' 2>/dev/null || true)"
            RAW_VERSION_CURRENT="$(docker exec "$APP_CONTAINER" cat /var/www/html/VERSION-CURRENT 2>/dev/null || true)"
          fi

          safe_image_metadata() {
            local image="$1"
            if [ -z "$image" ]; then
              printf 'unknown'
            elif [[ "$image" =~ ^[A-Za-z0-9._:/@-]+$ ]]; then
              printf '%s' "$image"
            else
              printf 'invalid'
            fi
          }

          SERVICE_IMAGE_SAFE="$(safe_image_metadata "$SERVICE_IMAGE")"
          CONTAINER_IMAGE_SAFE="$(safe_image_metadata "$CONTAINER_IMAGE")"
          VERSION_CURRENT="invalid"
          if [[ "$RAW_VERSION_CURRENT" =~ ^[0-9a-f]{40}$ ]]; then
            VERSION_CURRENT="$RAW_VERSION_CURRENT"
          else
            FAIL=1
          fi

          image_revision() {
            local image="$1"
            local revision=""
            if [[ "$image" == mhcs_core:* ]]; then
              revision="${image#mhcs_core:}"
              revision="${revision%%@sha256:*}"
            fi
            printf '%s' "$revision"
          }

          SERVICE_REVISION="$(image_revision "$SERVICE_IMAGE")"
          CONTAINER_REVISION="$(image_revision "$CONTAINER_IMAGE")"
          REVISION_CONSISTENT=false
          if [ -n "$SERVICE_REVISION" ] && [ -n "$CONTAINER_REVISION" ] && [ -n "$VERSION_CURRENT" ] \
            && [ "$SERVICE_REVISION" = "$CONTAINER_REVISION" ] \
            && [ "$CONTAINER_REVISION" = "$VERSION_CURRENT" ]; then
            REVISION_CONSISTENT=true
          else
            FAIL=1
          fi

          echo "PRODUCTION_REVISION"
          echo "service_replicas=${SERVICE_REPLICAS:-unknown}"
          echo "task_state=${TASK_STATE:-unknown}"
          echo "container_health=${CONTAINER_HEALTH:-unavailable}"
          echo "service_image=$SERVICE_IMAGE_SAFE"
          echo "container_image=$CONTAINER_IMAGE_SAFE"
          echo "version_current=$VERSION_CURRENT"
          echo "consistent=${REVISION_CONSISTENT}"

          if [ "$SERVICE_REPLICAS" != "1/1" ] || [[ "$TASK_STATE" != Running* ]] || [ "$CONTAINER_HEALTH" != "healthy" ] || [ -z "$APP_CONTAINER" ]; then
            FAIL=1
          fi

          if [ -n "$EXPECTED_REVISION" ]; then
            SAFE_EXPECTED_REVISION="invalid"
            if [[ "$EXPECTED_REVISION" =~ ^[0-9a-f]{40}$ ]]; then
              SAFE_EXPECTED_REVISION="$EXPECTED_REVISION"
            fi
            echo "EXPECTED_REVISION=$SAFE_EXPECTED_REVISION"
            REVISION_MATCH=false
            if [ "$SAFE_EXPECTED_REVISION" != "invalid" ] \
              && [ "$REVISION_CONSISTENT" = "true" ] \
              && [ "$VERSION_CURRENT" = "$SAFE_EXPECTED_REVISION" ]; then
              REVISION_MATCH=true
            fi
            echo "REVISION_MATCH=$REVISION_MATCH"
            if [ "$REVISION_MATCH" != "true" ]; then
              FAIL=1
            fi
          fi

          echo "===> Read-only application and database checks"

          LOCAL_INGRESS_STATUS="$(curl --silent --show-error --max-time 5 --output /dev/null --write-out '%{http_code}' http://127.0.0.1:8013/up 2>/dev/null || true)"
          echo "local_ingress_http_status=${LOCAL_INGRESS_STATUS:-000}"
          if [ "$LOCAL_INGRESS_STATUS" != "200" ]; then
            FAIL=1
          fi

          if [ -n "$APP_CONTAINER" ]; then
            if docker exec "$APP_CONTAINER" php -r '
              require "vendor/autoload.php";
              $app = require "bootstrap/app.php";
              $app->make(Illuminate\Contracts\Console\Kernel::class)->bootstrap();
            ' >/dev/null 2>&1; then
              echo "LARAVEL_BOOTSTRAP=pass"
            else
              echo "LARAVEL_BOOTSTRAP=fail"
              FAIL=1
            fi

            if docker exec "$APP_CONTAINER" php -r '
              require "vendor/autoload.php";
              $app = require "bootstrap/app.php";
              $app->make(Illuminate\Contracts\Console\Kernel::class)->bootstrap();
              Illuminate\Support\Facades\DB::select("select 1");
            ' >/dev/null 2>&1; then
              echo "DATABASE_READ_ONLY_QUERY=pass"
            else
              echo "DATABASE_READ_ONLY_QUERY=fail"
              FAIL=1
            fi
          else
            echo "LARAVEL_BOOTSTRAP=fail"
            echo "DATABASE_READ_ONLY_QUERY=fail"
            FAIL=1
          fi

          if [ "$RUN_LARGE_UPLOAD_PROBE" = "true" ]; then
            echo "===> Run generated 100 MiB local ingress probe"
            required_bytes=$((100 * 1024 * 1024))
            probe_file="$(mktemp /tmp/mhcs-production-upload.XXXXXX)"
            trap 'rm -f -- "$probe_file"' EXIT INT TERM

            truncate -s "$required_bytes" "$probe_file"
            file_bytes="$(stat -c '%s' "$probe_file")"
            if (( file_bytes < required_bytes )); then
              echo "FAIL: generated probe is smaller than 100 MiB."
              exit 1
            fi

            curl_exit=0
            response="$(
              curl \
                --silent \
                --show-error \
                --max-time 180 \
                --request POST \
                --form "probe=@${probe_file};type=application/octet-stream" \
                --output /dev/null \
                --write-out '%{http_code} %{size_upload}' \
                http://127.0.0.1:8013/up 2>/dev/null
            )" || curl_exit=$?

            http_status="${response%% *}"
            uploaded_bytes="${response##* }"
            [[ "$http_status" =~ ^[0-9]{3}$ ]] || http_status=000
            [[ "$uploaded_bytes" =~ ^[0-9]+$ ]] || uploaded_bytes=0

            echo "HTTP status: $http_status"
            echo "Uploaded bytes: $uploaded_bytes"

            if (( curl_exit != 0 )); then
              if (( curl_exit == 28 )); then
                echo "FAIL: production ingress probe timed out."
              else
                echo "FAIL: production ingress transport failed."
              fi
              exit 1
            fi

            if [[ "$http_status" == 413 ]]; then
              echo "FAIL: production ingress returned HTTP 413."
              exit 1
            fi

            if (( uploaded_bytes < required_bytes )); then
              echo "FAIL: multipart upload completed below 100 MiB."
              exit 1
            fi

            if [[ "$http_status" != 405 ]]; then
              echo "FAIL: expected HTTP 405 from the existing /up GET|HEAD route."
              exit 1
            fi

            echo "PASS: completed at least 100 MiB multipart transfer and received HTTP 405."
          else
            echo "UPLOAD_PROBE=skipped"
          fi

          if [ "$VERIFY_PRESTIGE_MEMBERS" = "true" ]; then
            echo "===> Run sanitized read-only Prestige Member-account verification"
            if [ -z "$APP_CONTAINER" ]; then
              echo "PRESTIGE_MEMBER_VERIFICATION=failed"
              FAIL=1
            else
              member_output=""
              if member_output="$(docker exec "$APP_CONTAINER" php -r '
                require "vendor/autoload.php";
                $app = require "bootstrap/app.php";
                $app->make(Illuminate\Contracts\Console\Kernel::class)->bootstrap();
                $db = Illuminate\Support\Facades\DB::class;
                $prestigeEmailSuffix = "@prestige.madeena-xray.com";

                $candidateUsers = $db::table("users")
                    ->where("email", "like", "%".$prestigeEmailSuffix)
                    ->get(["id", "account_status", "login_enabled"]);
                $candidateUserIds = $candidateUsers->pluck("id")->all();
                $linkedMembers = $candidateUserIds === []
                    ? collect()
                    : $db::table("members")
                        ->whereIn("user_id", $candidateUserIds)
                        ->get(["user_id"]);

                $candidateUserCount = $candidateUsers->count();
                $linkedMemberCount = $linkedMembers->count();
                $distinctLinkedUserCount = $linkedMembers->pluck("user_id")->unique()->count();
                $activeAccountCount = $candidateUsers->where("account_status", "active")->count();
                $loginEnabledAccountCount = $candidateUsers->where("login_enabled", true)->count();
                $candidateUsersHaveExactlyOneMember = $candidateUsers->every(
                    static fn (object $user): bool => $linkedMembers->where("user_id", $user->id)->count() === 1,
                );
                $linkageExact = $candidateUsersHaveExactlyOneMember
                    && $linkedMemberCount === $distinctLinkedUserCount
                    && $distinctLinkedUserCount === $candidateUserCount;
                $passed = $candidateUserCount === 37
                    && $linkedMemberCount === 37
                    && $distinctLinkedUserCount === 37
                    && $activeAccountCount === 37
                    && $loginEnabledAccountCount === 37
                    && $linkageExact;

                echo "prestige_user_accounts=".$candidateUserCount.PHP_EOL;
                echo "prestige_linked_members=".$linkedMemberCount.PHP_EOL;
                echo "prestige_active_accounts=".$activeAccountCount.PHP_EOL;
                echo "prestige_login_enabled_accounts=".$loginEnabledAccountCount.PHP_EOL;
                echo "prestige_member_linkage_exact=".($linkageExact ? "true" : "false").PHP_EOL;
                exit($passed ? 0 : 1);
              ' 2>/dev/null)"; then
                printf '%s\n' "$member_output"
                echo "PRESTIGE_MEMBER_VERIFICATION=pass"
              else
                member_status=$?
                if [ -n "$member_output" ]; then
                  printf '%s\n' "$member_output"
                fi
                echo "PRESTIGE_MEMBER_VERIFICATION=failed"
                echo "PRESTIGE_MEMBER_VERIFICATION_EXIT=$member_status"
                FAIL=1
              fi
            fi
          else
            echo "PRESTIGE_MEMBER_VERIFICATION=skipped"
          fi

          if [ "$VERIFY_PRESTIGE" = "true" ]; then
            echo "===> Run sanitized read-only Prestige verification"
            if [ -z "$APP_CONTAINER" ]; then
              echo "PRESTIGE_VERIFICATION=failed"
              FAIL=1
            else
              prestige_output=""
              if prestige_output="$(docker exec "$APP_CONTAINER" php -r '
                require "vendor/autoload.php";
                $app = require "bootstrap/app.php";
                $app->make(Illuminate\Contracts\Console\Kernel::class)->bootstrap();
                $db = Illuminate\Support\Facades\DB::class;

                $site = $db::table("examination_site_refs")
                    ->where("operator_site_id", "site-prestige")
                    ->where("code", "PRES-01")
                    ->where("display_name", "Rumah Skrining CV Prestige")
                    ->where("timezone", "Asia/Jakarta")
                    ->where("active", true)
                    ->first();
                $offering = $db::table("service_offerings")
                    ->where("code", "SYN-CHEST-A")
                    ->first();
                $expected = [
                    ["starts_at" => "2026-08-19 17:00:00", "ends_at" => "2026-08-26 17:00:00", "quota" => 37, "status" => "open"],
                    ["starts_at" => "2026-08-26 17:00:00", "ends_at" => "2026-08-27 17:00:00", "quota" => 37, "status" => "open"],
                    ["starts_at" => "2026-08-27 17:00:00", "ends_at" => "2026-08-28 17:00:00", "quota" => 37, "status" => "open"],
                ];

                $schedules = $site !== null && $offering !== null
                    ? $db::table("shift_schedules")
                        ->where("examination_site_id", $site->id)
                        ->where("service_offering_id", $offering->id)
                        ->whereIn("starts_at", ["2026-08-19 17:00:00", "2026-08-26 17:00:00", "2026-08-27 17:00:00"])
                        ->orderBy("starts_at")
                        ->get(["id", "starts_at", "ends_at", "quota", "status"])
                    : collect();
                $allSchedules = $site !== null && $offering !== null
                    ? $db::table("shift_schedules")
                        ->where("examination_site_id", $site->id)
                        ->where("service_offering_id", $offering->id)
                        ->get(["id"])
                    : collect();
                $scheduleRows = $schedules->map(static fn (object $row): array => [
                    "starts_at" => (string) $row->starts_at,
                    "ends_at" => (string) $row->ends_at,
                    "quota" => (int) $row->quota,
                    "status" => (string) $row->status,
                ])->all();
                $scheduleBoundsMatch = $scheduleRows === $expected;
                $quotaValues = $schedules->map(static fn (object $row): int => (int) $row->quota)->all();
                $confirmedCounts = [];
                $memberSets = [];
                $totalBookings = 0;
                $distinctMembers = 0;
                $memberSetsEqual = false;
                $memberSetsHave37 = false;
                $cohortMatch = false;

                if ($schedules->count() === 3) {
                    foreach ($schedules as $schedule) {
                        $scheduleId = (string) $schedule->id;
                        $confirmedCounts[] = (int) $db::table("bookings")
                            ->where("shift_schedule_id", $scheduleId)
                            ->where("status", "confirmed")
                            ->count();
                        $memberSets[] = $db::table("bookings")
                            ->where("shift_schedule_id", $scheduleId)
                            ->where("status", "confirmed")
                            ->pluck("member_id")
                            ->map(static fn ($id): string => (string) $id)
                            ->sort(SORT_STRING)
                            ->values()
                            ->all();
                    }
                    $scheduleIds = $schedules->pluck("id")->all();
                    $totalBookings = (int) $db::table("bookings")->whereIn("shift_schedule_id", $scheduleIds)->count();
                    $distinctMembers = (int) $db::table("bookings")
                        ->whereIn("shift_schedule_id", $scheduleIds)
                        ->distinct()
                        ->count("member_id");
                    $memberSetsEqual = $memberSets[0] === $memberSets[1]
                        && $memberSets[1] === $memberSets[2];
                    $memberSetsHave37 = count($memberSets[0]) === 37
                        && count($memberSets[1]) === 37
                        && count($memberSets[2]) === 37
                        && count(array_unique($memberSets[0])) === 37
                        && count(array_unique($memberSets[1])) === 37
                        && count(array_unique($memberSets[2])) === 37;
                    $prestigeMemberIds = $db::table("members")
                        ->whereIn("user_id", $db::table("users")->where("email", "like", "%@prestige.madeena-xray.com")->pluck("id"))
                        ->pluck("id")
                        ->map(static fn ($id): string => (string) $id)
                        ->sort(SORT_STRING)
                        ->values()
                        ->all();
                    $cohortMatch = $prestigeMemberIds === $memberSets[0]
                        && $prestigeMemberIds === $memberSets[1]
                        && $prestigeMemberIds === $memberSets[2];
                }

                $passed = $site !== null
                    && $offering !== null
                    && $allSchedules->count() === 3
                    && $schedules->count() === 3
                    && $scheduleBoundsMatch
                    && $quotaValues === [37, 37, 37]
                    && $confirmedCounts === [37, 37, 37]
                    && $totalBookings === 111
                    && $distinctMembers === 37
                    && $memberSetsEqual
                    && $memberSetsHave37
                    && $cohortMatch;

                $targetBookingIds = $db::table("bookings")->whereIn("shift_schedule_id", $schedules->pluck("id"))->pluck("id");
                $targetChargeRows = $db::table("point_ledger_entries")->whereIn("booking_id", $targetBookingIds)->where("entry_type", "charge");
                $targetCharges = (int) $targetChargeRows->count();
                $oldStartsAbsent = ! $db::table("shift_schedules")->where("examination_site_id", $site?->id)->where("service_offering_id", $offering?->id)->whereIn("starts_at", ["2026-08-14 01:00:00", "2026-08-26 01:00:00", "2026-08-27 01:00:00", "2026-08-28 01:00:00"])->exists();
                $targetReversals = (int) $db::table("point_ledger_entries")->whereIn("booking_id", $targetBookingIds)->whereNotNull("reverses_id")->count();
                $passed = $passed && $targetCharges === 111 && (int) $targetChargeRows->distinct("booking_id")->count("booking_id") === 111 && $targetReversals === 0 && $oldStartsAbsent;

                echo json_encode([
                    "site_active" => $site !== null,
                    "schedule_count" => $schedules->count(),
                    "schedule_bounds_match" => $scheduleBoundsMatch,
                    "quota_20_26" => $quotaValues[0] ?? null,
                    "quota_27_28" => $quotaValues[1] ?? null,
                    "quota_28_29" => $quotaValues[2] ?? null,
                    "confirmed_20_26" => $confirmedCounts[0] ?? null,
                    "confirmed_27_28" => $confirmedCounts[1] ?? null,
                    "confirmed_28_29" => $confirmedCounts[2] ?? null,
                    "total_bookings" => $totalBookings,
                    "distinct_members" => $distinctMembers,
                    "member_sets_equal" => $memberSetsEqual,
                    "target_schedule_count" => $schedules->count(),
                    "target_bounds_match" => $scheduleBoundsMatch,
                    "target_total_bookings" => $totalBookings,
                    "target_distinct_members" => $distinctMembers,
                    "target_member_sets_equal" => $memberSetsEqual,
                    "target_cohort_match" => $cohortMatch,
                    "target_charge_entries" => $targetCharges,
                    "target_reversal_entries" => $targetReversals,
                    "old_14_absent" => ! $db::table("shift_schedules")->where("examination_site_id", $site?->id)->where("service_offering_id", $offering?->id)->where("starts_at", "2026-08-14 01:00:00")->exists(),
                    "old_26_absent" => ! $db::table("shift_schedules")->where("examination_site_id", $site?->id)->where("service_offering_id", $offering?->id)->where("starts_at", "2026-08-26 01:00:00")->exists(),
                    "old_27_absent" => ! $db::table("shift_schedules")->where("examination_site_id", $site?->id)->where("service_offering_id", $offering?->id)->where("starts_at", "2026-08-27 01:00:00")->exists(),
                    "old_28_absent" => ! $db::table("shift_schedules")->where("examination_site_id", $site?->id)->where("service_offering_id", $offering?->id)->where("starts_at", "2026-08-28 01:00:00")->exists(),
                    "verification_passed" => $passed,
                ], JSON_THROW_ON_ERROR).PHP_EOL;
                exit($passed ? 0 : 1);
              ' 2>/dev/null)"; then
                printf '%s\n' "$prestige_output"
                echo "PRESTIGE_VERIFICATION=pass"
              else
                prestige_status=$?
                if [ -n "$prestige_output" ]; then
                  printf '%s\n' "$prestige_output"
                fi
                echo "PRESTIGE_VERIFICATION=failed"
                echo "PRESTIGE_VERIFICATION_EXIT=$prestige_status"
                FAIL=1
              fi
            fi
          else
            echo "PRESTIGE_VERIFICATION=skipped"
          fi

          if [ "$DIAGNOSE_PRESTIGE_LEGACY" = "true" ]; then
            echo "===> Run sanitized read-only legacy Prestige schedule diagnostic"
            if [ -z "$APP_CONTAINER" ]; then
              echo "PRESTIGE_LEGACY_DIAGNOSTIC=failed"
              FAIL=1
            else
              legacy_output=""
              if legacy_output="$(docker exec "$APP_CONTAINER" php -r '
                require "vendor/autoload.php";
                $app = require "bootstrap/app.php";
                $app->make(Illuminate\Contracts\Console\Kernel::class)->bootstrap();
                $db = Illuminate\Support\Facades\DB::class;

                $sites = $db::table("examination_site_refs")
                    ->where("operator_site_id", "site-prestige")
                    ->where("code", "PRES-01")
                    ->get(["id"]);
                $offerings = $db::table("service_offerings")
                    ->where("code", "SYN-CHEST-A")
                    ->get(["id"]);
                if ($sites->count() !== 1 || $offerings->count() !== 1) {
                    echo "PRESTIGE_LEGACY_DIAGNOSTIC=failed".PHP_EOL;
                    exit(1);
                }

                $fixedSchedules = [
                    "legacy_2026_08_14" => "2026-08-14 01:00:00",
                    "legacy_2026_08_26" => "2026-08-26 01:00:00",
                    "legacy_2026_08_27" => "2026-08-27 01:00:00",
                    "legacy_2026_08_28" => "2026-08-28 01:00:00",
                ];
                $progressedTables = [
                    "local_imaging_orders" => "shift_schedule_id",
                    "operator_paper_tickets" => "member_schedule_id",
                    "operator_queue_admissions" => "member_schedule_id",
                    "operator_arrivals" => "member_schedule_id",
                    "operator_identity_verifications" => "member_schedule_id",
                    "member_paper_questionnaires" => "member_schedule_id",
                    "member_vital_signs_assessments" => "member_schedule_id",
                    "image_gateway_capture_sets" => "member_schedule_id",
                ];
                $prestigeUsers = $db::table("users")
                    ->where("email", "like", "%@prestige.madeena-xray.com")
                    ->get(["id"]);
                $prestigeMemberIds = $prestigeUsers->isEmpty()
                    ? collect()
                    : $db::table("members")
                        ->whereIn("user_id", $prestigeUsers->pluck("id"))
                        ->pluck("id");
                $siteId = $sites->first()->id;
                $offeringId = $offerings->first()->id;
                $globalMembers = [];
                $legacyBookingCount = 0;
                $legacyPointLedgerEntries = 0;
                $legacyProgressedScheduleCount = 0;
                $scheduleCount = 0;

                foreach ($fixedSchedules as $label => $startsAt) {
                    $schedules = $db::table("shift_schedules")
                        ->where("examination_site_id", $siteId)
                        ->where("service_offering_id", $offeringId)
                        ->where("starts_at", $startsAt)
                        ->get(["id", "starts_at", "ends_at", "quota", "status"]);
                    if ($schedules->count() > 1) {
                        echo "PRESTIGE_LEGACY_DIAGNOSTIC=failed".PHP_EOL;
                        exit(1);
                    }

                    $row = [
                        "label" => $label,
                        "exists" => $schedules->count() === 1,
                        "starts_at" => $schedules->count() === 1 ? (string) $schedules->first()->starts_at : null,
                        "ends_at" => $schedules->count() === 1 ? (string) $schedules->first()->ends_at : null,
                        "quota" => $schedules->count() === 1 ? (int) $schedules->first()->quota : null,
                        "status" => $schedules->count() === 1 ? (string) $schedules->first()->status : null,
                        "bookings_total" => 0,
                        "booking_status_counts" => [],
                        "distinct_members" => 0,
                        "all_booked_members_in_prestige_cohort" => true,
                        "member_set_has_37_unique" => false,
                        "has_bookings" => false,
                        "progressed_table_counts" => [],
                        "has_progressed_clinical_records" => false,
                        "operator_eligible_shifts" => 0,
                        "operator_shift_assignments" => 0,
                        "point_ledger_entries" => 0,
                        "point_ledger_charge_entries" => 0,
                        "point_ledger_reversal_entries" => 0,
                        "has_point_ledger" => false,
                    ];
                    if ($schedules->count() === 1) {
                        $scheduleCount++;
                        $scheduleId = $schedules->first()->id;
                        $bookings = $db::table("bookings")
                            ->where("shift_schedule_id", $scheduleId)
                            ->get(["member_id", "status"]);
                        $members = $bookings->pluck("member_id")->unique()->values();
                        $row["bookings_total"] = $bookings->count();
                        $row["has_bookings"] = $bookings->isNotEmpty();
                        $row["distinct_members"] = $members->count();
                        $row["member_set_has_37_unique"] = $members->count() === 37;
                        $row["all_booked_members_in_prestige_cohort"] = $members->diff($prestigeMemberIds)->isEmpty();
                        $row["booking_status_counts"] = $bookings->groupBy("status")
                            ->map(static fn ($statusBookings, $status): array => ["status" => (string) $status, "count" => $statusBookings->count()])
                            ->values()->all();
                        foreach ($members as $memberId) {
                            $globalMembers[(string) $memberId] = true;
                        }
                        $legacyBookingCount += $bookings->count();

                        foreach ($progressedTables as $table => $column) {
                            $count = (int) $db::table($table)->where($column, $scheduleId)->count();
                            $row["progressed_table_counts"][$table] = $count;
                            $row["has_progressed_clinical_records"] = $row["has_progressed_clinical_records"] || $count > 0;
                        }
                        if ($row["has_progressed_clinical_records"]) {
                            $legacyProgressedScheduleCount++;
                        }
                        $eligible = $db::table("operator_eligible_shifts")->where("member_schedule_id", $scheduleId);
                        $row["operator_eligible_shifts"] = (int) $eligible->count();
                        $row["operator_shift_assignments"] = (int) $db::table("operator_shift_assignments")
                            ->join("operator_eligible_shifts", "operator_shift_assignments.operator_eligible_shift_id", "=", "operator_eligible_shifts.id")
                            ->where("operator_eligible_shifts.member_schedule_id", $scheduleId)->count();
                        $ledger = $db::table("point_ledger_entries")
                            ->join("bookings", "point_ledger_entries.booking_id", "=", "bookings.id")
                            ->where("bookings.shift_schedule_id", $scheduleId);
                        $row["point_ledger_entries"] = (int) $ledger->count();
                        $row["point_ledger_charge_entries"] = (int) $ledger->clone()->where("point_ledger_entries.entry_type", \App\Modules\Member\Domain\Enums\PointEntryType::Charge->value)->count();
                        $row["point_ledger_reversal_entries"] = (int) $ledger->clone()->whereNotNull("point_ledger_entries.reverses_id")->count();
                        $row["has_point_ledger"] = $row["point_ledger_entries"] > 0;
                        $legacyPointLedgerEntries += $row["point_ledger_entries"];
                    }
                    echo "LEGACY_PRESTIGE_SCHEDULE ".json_encode($row, JSON_THROW_ON_ERROR).PHP_EOL;
                }
                echo "legacy_schedule_count=".$scheduleCount.PHP_EOL;
                echo "legacy_booking_count=".$legacyBookingCount.PHP_EOL;
                echo "legacy_distinct_members=".count($globalMembers).PHP_EOL;
                echo "legacy_point_ledger_entries=".$legacyPointLedgerEntries.PHP_EOL;
                echo "legacy_progressed_schedule_count=".$legacyProgressedScheduleCount.PHP_EOL;
                echo "PRESTIGE_LEGACY_DIAGNOSTIC=pass".PHP_EOL;
              ' 2>/dev/null)"; then
                printf '%s\n' "$legacy_output"
              else
                if [ -n "$legacy_output" ]; then
                  printf '%s\n' "$legacy_output"
                fi
                echo "PRESTIGE_LEGACY_DIAGNOSTIC=failed"
                FAIL=1
              fi
            fi
          else
            echo "PRESTIGE_LEGACY_DIAGNOSTIC=skipped"
          fi

          if [ "$FAIL" -gt 0 ]; then
            echo "PRODUCTION_VERIFICATION_STATUS=fail"
            exit 1
          fi

          echo "PRODUCTION_VERIFICATION_STATUS=pass"
