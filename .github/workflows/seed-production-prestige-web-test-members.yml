name: Seed production Prestige web-test Members

on:
  workflow_dispatch:
    inputs:
      expected_application_revision:
        description: Lowercase 40-hex verified application revision.
        required: true
        type: string
      authorization_marker:
        description: Type the exact one-time authorization marker.
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production-deployment-mhcs_core
  cancel-in-progress: false

jobs:
  seed:
    runs-on: self-hosted
    timeout-minutes: 10
    steps:
      - name: Seed exactly two Prestige web-test Members
        env:
          EXPECTED_APPLICATION_REVISION: ${{ inputs.expected_application_revision }}
          AUTHORIZATION_MARKER: ${{ inputs.authorization_marker }}
        shell: bash
        run: |
          set -euo pipefail
          SERVICE="mhcs_core_app"
          APP_CONTAINER=""
          [[ "$EXPECTED_APPLICATION_REVISION" =~ ^[0-9a-f]{40}$ ]] || { echo "FATAL: expected revision must be lowercase 40-hex."; exit 1; }
          [ "$AUTHORIZATION_MARKER" = "AUTHORIZE_ONE_PRESTIGE_WEB_TEST_MEMBER_SEED" ] || { echo "FATAL: authorization marker mismatch."; exit 1; }
          [ "$(docker service ls --format '{{.Replicas}}' --filter "name=$SERVICE" | head -n 1)" = "1/1" ] || { echo "FATAL: service replicas are not 1/1."; exit 1; }
          SERVICE_IMAGE="$(docker service inspect "$SERVICE" --format '{{.Spec.TaskTemplate.ContainerSpec.Image}}')"
          [[ "$SERVICE_IMAGE" = "mhcs_core:$EXPECTED_APPLICATION_REVISION" || "$SERVICE_IMAGE" = "mhcs_core:$EXPECTED_APPLICATION_REVISION@sha256:"* ]] || { echo "FATAL: service image revision mismatch."; exit 1; }
          TASK_ID="$(docker service ps "$SERVICE" --filter desired-state=running --no-trunc --format '{{.ID}}' | head -n 1)"
          [ -n "$TASK_ID" ] || { echo "FATAL: desired running task is missing."; exit 1; }
          [[ "$(docker service ps "$SERVICE" --filter "id=$TASK_ID" --format '{{.CurrentState}}')" = Running* ]] || { echo "FATAL: desired task is not running."; exit 1; }
          while IFS= read -r candidate; do
            candidate_task="$(docker inspect "$candidate" --format '{{index .Config.Labels "com.docker.swarm.task.id"}}' 2>/dev/null || true)"
            if [ "$candidate_task" = "$TASK_ID" ]; then APP_CONTAINER="$candidate"; break; fi
          done < <(docker ps -q --filter "label=com.docker.swarm.service.name=$SERVICE" --filter status=running)
          [ -n "$APP_CONTAINER" ] || { echo "FATAL: exact task container is missing."; exit 1; }
          CONTAINER_IMAGE="$(docker inspect "$APP_CONTAINER" --format '{{.Config.Image}}')"
          [[ "$CONTAINER_IMAGE" = "mhcs_core:$EXPECTED_APPLICATION_REVISION" || "$CONTAINER_IMAGE" = "mhcs_core:$EXPECTED_APPLICATION_REVISION@sha256:"* ]] || { echo "FATAL: container image revision mismatch."; exit 1; }
          [ "$(docker exec "$APP_CONTAINER" cat /var/www/html/VERSION-CURRENT)" = "$EXPECTED_APPLICATION_REVISION" ] || { echo "FATAL: VERSION-CURRENT mismatch."; exit 1; }
          [ "$(docker inspect "$APP_CONTAINER" --format '{{.State.Health.Status}}')" = healthy ] || { echo "FATAL: container is not healthy."; exit 1; }
          echo "production_revision_verified=true"

          docker exec "$APP_CONTAINER" php -r '
            require "vendor/autoload.php";
            $app = require "bootstrap/app.php";
            $app->make(Illuminate\Contracts\Console\Kernel::class)->bootstrap();
            $db = Illuminate\Support\Facades\DB::class;
            $users = $db::table("users")->where("email", "like", "%@prestige.madeena-xray.com")->get(["id", "account_status", "login_enabled"]);
            $members = $db::table("members")->whereIn("user_id", $users->pluck("id"))->get(["id", "user_id"]);
            $profiles = $db::table("operator_profiles")->where("active", true)->where("employee_code", "like", "OPR-PRES-%")->pluck("employee_code")->sort()->values()->all();
            $refs = ["JAD-260827NP", "JAD-260828NP"];
            $emails = ["gbsuparta@ugm.ac.id", "ipang.prestige@madeena-xray.com"];
            if ($users->count() !== 37 || $members->count() !== 37 || $users->where("account_status", "active")->count() !== 37 || $users->where("login_enabled", true)->count() !== 37 || $members->pluck("user_id")->unique()->count() !== 37 || $profiles !== ["OPR-PRES-01", "OPR-PRES-02", "OPR-PRES-03", "OPR-PRES-04", "OPR-PRES-05"] || $db::table("users")->whereIn("email", $emails)->exists() || $db::table("shift_schedules")->whereIn("display_reference", $refs)->exists() || $db::table("point_ledger_entries")->where("source_reference", "like", "prestige:web-test:%")->exists()) { exit(1); }
          ' || { echo "FATAL: pre-mutation ABSENT probe failed."; exit 1; }

          docker exec -e MHCS_ALLOW_PRODUCTION_MVP_SEED=true "$APP_CONTAINER" php artisan db:seed --class='Database\Seeders\PrestigeWebTestMembersSeeder' --force

          docker exec "$APP_CONTAINER" php -r '
            require "vendor/autoload.php";
            $app = require "bootstrap/app.php";
            $app->make(Illuminate\Contracts\Console\Kernel::class)->bootstrap();
            $db = Illuminate\Support\Facades\DB::class;
            $users = $db::table("users")->where("email", "like", "%@prestige.madeena-xray.com")->get(["id"]);
            $fixtureUsers = $db::table("users")->whereIn("email", ["gbsuparta@ugm.ac.id", "ipang.prestige@madeena-xray.com"])->get(["id"]);
            $fixtureMembers = $db::table("members")->whereIn("user_id", $fixtureUsers->pluck("id"))->get(["id"]);
            $schedules = $db::table("shift_schedules")->whereIn("display_reference", ["JAD-260827NP", "JAD-260828NP"])->get(["id", "quota"]);
            $bookings = $db::table("bookings")->whereIn("shift_schedule_id", $schedules->pluck("id"))->get();
            if ($users->count() !== 37 || $fixtureUsers->count() !== 2 || $fixtureMembers->count() !== 2 || $schedules->count() !== 2 || $schedules->where("quota", "!=", 50)->isNotEmpty() || $bookings->count() !== 4 || $bookings->where("status", "!=", "confirmed")->isNotEmpty() || $bookings->pluck("member_id")->unique()->count() !== 2) { exit(1); }
          ' || { echo "FATAL: post-seed sanity check failed."; exit 1; }
          echo "canonical_prestige_member_count=37"
          echo "additional_web_test_member_count=2"
          echo "diagnostic_schedule_count=2"
          echo "diagnostic_booking_count=4"
          echo "seeding=PASS"
