name: Deploy to Production (Swarm Mode)

# ═══════════════════════════════════════════════════════════════════════════════
# MHCS Core — Docker Swarm Production Deployment
#
# Builds and validates the production Docker image locally on the runner,
# ensures database safety and automated pre-deploy backup, deploys via Docker Swarm,
# runs forward migrations, executes safe one-time MVP bootstrap only on fresh DB,
# and executes post-deploy health verification.
# ═══════════════════════════════════════════════════════════════════════════════

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-deployment-mhcs_core
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  DOCKER_BUILDKIT: 1

jobs:
  build:
    name: Build & Validate
    runs-on: self-hosted
    permissions:
      contents: read
    outputs:
      app_version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Resolve application version
        id: version
        run: |
          VERSION="${GITHUB_SHA}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Release version: ${VERSION} (from GITHUB_SHA)"

      - name: Build production Docker image
        run: |
          set -euo pipefail
          echo "===> Building mhcs_core:${{ steps.version.outputs.version }}..."
          docker build \
            --target app \
            --tag mhcs_core:${{ steps.version.outputs.version }} \
            --tag mhcs_core:latest \
            .
          echo "✅ Production image built: mhcs_core:${{ steps.version.outputs.version }}"

      - name: Validate Docker Compose production configuration
        run: |
          set -euo pipefail
          echo "===> Validating docker-compose.prod.yml..."
          touch /tmp/mhcs-validate.env
          MHCS_IMAGE=mhcs_core:${{ steps.version.outputs.version }} \
          MHCS_APPLICATION_NETWORK_NAME=mhcs-core-application-network \
          MPIPS_NETWORK_NAME=madeena-software-network \
          MHCS_ENV_FILE=/tmp/mhcs-validate.env \
          APP_STORAGE_HOST_PATH=/tmp/storage \
          APP_LOGS_HOST_PATH=/tmp/logs \
          MYSQL_DATA_HOST_PATH=/tmp/mysql \
          DB_ROOT_PASSWORD=dummy \
          DB_DATABASE=mhcs_core \
          DB_USERNAME=dummy \
          DB_PASSWORD=dummy \
          docker compose -f docker-compose.prod.yml config >/dev/null
          rm -f /tmp/mhcs-validate.env
          echo "✅ docker-compose.prod.yml syntax is valid."

  deploy:
    name: Deploy to Production
    runs-on: self-hosted
    needs: build
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy via Docker Swarm
        env:
          SSH_USER: ${{ secrets.SSH_USER }}
          SUDO_PASSWORD: ${{ secrets.SUDO_PASSWORD }}
          APP_KEY: ${{ secrets.APP_KEY }}
          APP_DOMAIN: ${{ secrets.APP_DOMAIN }}
          REMOTE_PATH: ${{ secrets.REMOTE_PATH }}
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_DATABASE: ${{ secrets.DB_DATABASE }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_ROOT_PASSWORD: ${{ secrets.DB_ROOT_PASSWORD }}
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          SUPER_ADMIN_EMAIL: ${{ secrets.SUPER_ADMIN_EMAIL }}
          SUPER_ADMIN_PASSWORD: ${{ secrets.SUPER_ADMIN_PASSWORD }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_BUCKET: ${{ secrets.AWS_BUCKET }}
          AWS_ENDPOINT: ${{ secrets.AWS_ENDPOINT }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION }}
          MPIPS_API_KEY: ${{ secrets.MPIPS_API_KEY }}
          MPIPS_BASE_URL: ${{ secrets.MPIPS_BASE_URL }}
          MHCS_IDENTIFIER_KEY: ${{ secrets.MHCS_IDENTIFIER_KEY }}
          MHCS_ACCESS_GRANT_KEY: ${{ secrets.MHCS_ACCESS_GRANT_KEY }}
          MHCS_MANIFEST_KEY: ${{ secrets.MHCS_MANIFEST_KEY }}
          MHCS_MANIFEST_KEY_ID: ${{ secrets.MHCS_MANIFEST_KEY_ID }}
          APP_VERSION: ${{ needs.build.outputs.app_version }}
        run: |
          set -euo pipefail

          require_env() {
            var="$1"
            val="$(eval "printf '%s' \"\${${var}:-}\"")"
            if [ -z "$val" ]; then
              echo "FATAL: ${var} is missing or empty."
              exit 1
            fi
          }

          for var in APP_KEY APP_DOMAIN REMOTE_PATH DB_HOST DB_DATABASE DB_USERNAME DB_PASSWORD DB_ROOT_PASSWORD AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_BUCKET AWS_ENDPOINT; do
            require_env "$var"
          done

          if [ "$DB_HOST" = "127.0.0.1" ] || [ "$DB_HOST" = "localhost" ]; then
            echo "FATAL: DB_HOST is '$DB_HOST'. Use the Swarm service name: db."
            exit 1
          fi

          if [ "$DB_HOST" != "db" ]; then
            echo "FATAL: DB_HOST must be 'db' for the Swarm deployment."
            exit 1
          fi

          _sudo() {
            if [ -n "${SUDO_PASSWORD:-}" ]; then
              echo "$SUDO_PASSWORD" | sudo -S "$@" 2>/dev/null
            else
              sudo "$@"
            fi
          }

          export LIVE_VERSION="${APP_VERSION:-unknown}"
          export MHCS_IMAGE="mhcs_core:${LIVE_VERSION}"
          export MHCS_APPLICATION_NETWORK_NAME="mhcs-core-application-network"
          export MPIPS_NETWORK_NAME="${MPIPS_NETWORK_NAME:-madeena-software-network}"
          export APP_STORAGE_HOST_PATH="/var/lib/mhcs_core/storage"
          export APP_LOGS_HOST_PATH="/var/lib/mhcs_core/logs"
          export MYSQL_DATA_HOST_PATH="/var/lib/mhcs_core/mysql"

          echo "===> Clearing exited containers from previous runs..."
          docker container prune -f || true

          echo "===> Preparing persistent host paths..."
          _sudo mkdir -p \
            "$APP_STORAGE_HOST_PATH/app/private/bootstrap" \
            "$APP_LOGS_HOST_PATH" \
            "$MYSQL_DATA_HOST_PATH"
          _sudo chown -R www-data:www-data "$APP_STORAGE_HOST_PATH" "$APP_LOGS_HOST_PATH" 2>/dev/null || true
          _sudo chmod -R 775 "$APP_STORAGE_HOST_PATH" "$APP_LOGS_HOST_PATH" 2>/dev/null || true
          _sudo chmod 0700 "$APP_STORAGE_HOST_PATH/app/private/bootstrap" 2>/dev/null || true
          if [ -f "$APP_STORAGE_HOST_PATH/app/private/bootstrap/credential-server.txt" ]; then
            _sudo chmod 0600 "$APP_STORAGE_HOST_PATH/app/private/bootstrap/credential-server.txt" 2>/dev/null || true
          fi
          _sudo chown 999:999 "$MYSQL_DATA_HOST_PATH" 2>/dev/null || true
          _sudo chmod 750 "$MYSQL_DATA_HOST_PATH" 2>/dev/null || true

          echo "===> Preparing deployment root..."
          if [ "$REMOTE_PATH" = "/var/www" ] || [ "$REMOTE_PATH" = "/srv" ] || [ "$REMOTE_PATH" = "/opt" ] || [ "$REMOTE_PATH" = "/var" ]; then
            echo "FATAL: REMOTE_PATH must be a dedicated app directory, not a shared root."
            exit 1
          fi

          _sudo mkdir -p "$REMOTE_PATH"
          _sudo chown -R "$(id -un):$(id -gn)" "$REMOTE_PATH"

          if [ ! -w "$REMOTE_PATH" ]; then
            echo "FATAL: Runner user $(id -un) cannot write to $REMOTE_PATH."
            ls -ld "$REMOTE_PATH" || true
            exit 1
          fi

          cd "$REMOTE_PATH"
          cp "$GITHUB_WORKSPACE/docker-compose.prod.yml" docker-compose.prod.yml
          mkdir -p nginx/conf.d
          cp "$GITHUB_WORKSPACE/docker/nginx.conf" nginx/conf.d/app.conf
          echo "$LIVE_VERSION" > VERSION-CURRENT

          echo "===> Writing environment file..."
          printf '%s\n' \
            'APP_NAME="MHCS Core"' \
            'APP_DISPLAY_NAME="MHCS Core"' \
            'APP_ENV=production' \
            'APP_DEBUG=false' \
            'APP_TIMEZONE=Asia/Jakarta' \
            'APP_LOCALE=id' \
            'APP_FALLBACK_LOCALE=id' \
            '' \
            'LOG_CHANNEL=stack' \
            'LOG_STACK=single' \
            'LOG_LEVEL=error' \
            '' \
            'DB_CONNECTION=mysql' \
            'DB_PORT=3306' \
            '' \
            'BROADCAST_CONNECTION=log' \
            'FILESYSTEM_DISK=s3' \
            'MHCS_PRIVATE_OBJECT_DISK=s3' \
            'AWS_USE_PATH_STYLE_ENDPOINT=true' \
            'PUBLIC_DISK_DRIVER=s3' \
            'BACKUPS_DISK_DRIVER=s3' \
            'QUEUE_CONNECTION=database' \
            'CACHE_STORE=database' \
            'SESSION_DRIVER=database' \
            'SESSION_LIFETIME=120' \
            '' \
            "APP_STORAGE_HOST_PATH=${APP_STORAGE_HOST_PATH}" \
            "APP_LOGS_HOST_PATH=${APP_LOGS_HOST_PATH}" \
            "MYSQL_DATA_HOST_PATH=${MYSQL_DATA_HOST_PATH}" \
            '' \
            'MHCS_MAX_UPLOAD_MB=100' \
            'MHCS_IMAGE_FILE_COUNT=2' \
            'MHCS_IMAGE_DECOMPRESSED_BYTES=4194304' \
            'MHCS_IMAGE_MAX_WIDTH=4096' \
            'MHCS_IMAGE_MAX_HEIGHT=4096' \
            'MHCS_IMAGE_FIELD_COUNT=32' \
            'MHCS_IMAGE_CPU_SECONDS=5' \
            'MHCS_IMAGE_MEMORY_BYTES=134217728' \
            'MHCS_IMAGE_EXECUTION_SECONDS=30' \
            'MHCS_IMAGE_PROCESS_COUNT=1' \
            'MHCS_IMAGE_TEMPORARY_STORAGE_BYTES=8388608' \
            'MHCS_IMAGE_ACCEPTED_FORMS=zip-npz' \
            'MHCS_IMAGE_RECOVERY_WINDOW_SECONDS=300' \
            'MHCS_IMAGE_MAX_ATTEMPTS=1' \
            '' \
            'MHCS_IMAGE_WORKER_CPU_LIMIT=1.0' \
            'MHCS_IMAGE_WORKER_MEMORY_LIMIT=1G' \
            'MHCS_IMAGE_WORKER_PIDS_LIMIT=256' \
            'MHCS_IMAGE_WORKER_EXECUTION_TIMEOUT_SECONDS=390' \
            'MHCS_IMAGE_WORKER_TMPFS_SIZE=512m' \
            'IMAGE_GATEWAY_WORKER_TIMEOUT=390' \
            'DB_QUEUE_RETRY_AFTER=420' \
            'MPIPS_TIMEOUT_SECONDS=360' \
            'APP_PORT=8013' \
            '' \
            'MAIL_MAILER=smtp' \
            'MAIL_SCHEME=null' \
            'MAIL_HOST=smtp.gmail.com' \
            'MAIL_PORT=587' \
            'MAIL_ENCRYPTION=tls' \
            'VITE_APP_NAME="MHCS Core"' \
            > .env

          {
            printf 'APP_KEY=%s\n' "$APP_KEY"
            printf 'APP_URL=https://%s\n' "$APP_DOMAIN"
            printf 'DB_HOST=%s\n' "$DB_HOST"
            printf 'DB_DATABASE=%s\n' "$DB_DATABASE"
            printf 'DB_USERNAME=%s\n' "$DB_USERNAME"
            printf 'DB_PASSWORD=%s\n' "$DB_PASSWORD"
            printf 'DB_ROOT_PASSWORD=%s\n' "$DB_ROOT_PASSWORD"
            printf 'MAIL_USERNAME=%s\n' "${MAIL_USERNAME:-}"
            printf 'MAIL_PASSWORD=%s\n' "${MAIL_PASSWORD:-}"
            printf 'MAIL_FROM_ADDRESS=%s\n' "${MAIL_USERNAME:-hello@example.com}"
            printf 'MAIL_FROM_NAME=%s\n' "MHCS Core"
            printf 'SUPER_ADMIN_EMAIL=%s\n' "${SUPER_ADMIN_EMAIL:-}"
            printf 'SUPER_ADMIN_PASSWORD=%s\n' "${SUPER_ADMIN_PASSWORD:-}"
            printf 'AWS_ACCESS_KEY_ID=%s\n' "$AWS_ACCESS_KEY_ID"
            printf 'AWS_SECRET_ACCESS_KEY=%s\n' "$AWS_SECRET_ACCESS_KEY"
            printf 'AWS_BUCKET=%s\n' "$AWS_BUCKET"
            printf 'AWS_ENDPOINT=%s\n' "$AWS_ENDPOINT"
            printf 'AWS_DEFAULT_REGION=%s\n' "${AWS_DEFAULT_REGION:-id}"
            printf 'MPIPS_API_KEY=%s\n' "${MPIPS_API_KEY:-}"
            printf 'MPIPS_BASE_URL=%s\n' "${MPIPS_BASE_URL:-http://mpips-api:8000}"
            printf 'MHCS_IDENTIFIER_KEY=%s\n' "${MHCS_IDENTIFIER_KEY:-}"
            printf 'MHCS_ACCESS_GRANT_KEY=%s\n' "${MHCS_ACCESS_GRANT_KEY:-}"
            printf 'MHCS_MANIFEST_KEY=%s\n' "${MHCS_MANIFEST_KEY:-}"
            printf 'MHCS_MANIFEST_KEY_ID=%s\n' "${MHCS_MANIFEST_KEY_ID:-}"
            printf 'MHCS_IMAGE=%s\n' "$MHCS_IMAGE"
            printf 'MHCS_APPLICATION_NETWORK_NAME=%s\n' "$MHCS_APPLICATION_NETWORK_NAME"
            printf 'MPIPS_NETWORK_NAME=%s\n' "$MPIPS_NETWORK_NAME"
            printf 'APP_VERSION=%s\n' "$LIVE_VERSION"
          } >> .env

          chmod 0600 .env

          echo "===> Swarm manager preflight..."
          SWARM_STATE="$(docker info --format '{{.Swarm.LocalNodeState}}' 2>/dev/null || echo unknown)"
          SWARM_MANAGER="$(docker info --format '{{.Swarm.ControlAvailable}}' 2>/dev/null || echo false)"
          if [ "$SWARM_STATE" != "active" ] || [ "$SWARM_MANAGER" != "true" ]; then
            echo "FATAL: Docker Swarm is not active or this node is not a manager."
            echo "State: $SWARM_STATE | Manager: $SWARM_MANAGER"
            exit 1
          fi

          echo "===> Verifying external mpips_private network exists..."
          MPIPS_SCOPE="$(docker network inspect ${MPIPS_NETWORK_NAME} --format '{{.Scope}}' 2>/dev/null || echo "missing")"
          if [ "$MPIPS_SCOPE" = "missing" ]; then
            echo "FATAL: Required external network ${MPIPS_NETWORK_NAME} not found."
            echo "The MPIPS network must be configured externally before MHCS deployment."
            exit 1
          fi
          echo "✅ External network ${MPIPS_NETWORK_NAME} found (scope: $MPIPS_SCOPE)"

          echo "===> Diagnosing Docker/Swarm network address allocation and host routing..."
          echo "Host IPv4 routes (ip -4 route):"
          ip -4 route || true
          echo ""
          echo "Host IPv4 addresses (ip -4 addr):"
          ip -4 addr || true
          echo ""
          echo "All Docker networks summary:"
          docker network ls --format 'table {{.Name}}\t{{.Driver}}\t{{.Scope}}' 2>/dev/null || echo "  (unable to retrieve)"
          echo ""
          echo "All Docker networks detailed IPAM configurations:"
          docker network ls -q | while read net_id; do
            n_name="$(docker network inspect "$net_id" --format '{{.Name}}' 2>/dev/null || echo "unknown")"
            n_driver="$(docker network inspect "$net_id" --format '{{.Driver}}' 2>/dev/null || echo "unknown")"
            n_scope="$(docker network inspect "$net_id" --format '{{.Scope}}' 2>/dev/null || echo "unknown")"
            n_internal="$(docker network inspect "$net_id" --format '{{.Internal}}' 2>/dev/null || echo "unknown")"
            n_ipam="$(docker network inspect "$net_id" --format '{{json .IPAM.Config}}' 2>/dev/null || echo "[]")"
            echo "  - ${n_name} [${n_driver}/${n_scope}] internal=${n_internal} IPAM: ${n_ipam}"
          done

          echo "===> Determining safe, non-overlapping subnet for ${MHCS_APPLICATION_NETWORK_NAME}..."
          SAFE_SUBNET="$(python3 -c 'import subprocess, json, ipaddress, sys; used = [ipaddress.ip_network(c["Subnet"], strict=False) for nid in subprocess.check_output(["docker", "network", "ls", "-q"], text=True).split() for item in json.loads(subprocess.check_output(["docker", "network", "inspect", nid], text=True)) for c in (item.get("IPAM", {}).get("Config", []) or []) if c.get("Subnet")] + [ipaddress.ip_network(p[0], strict=False) for p in [line.split() for line in subprocess.check_output(["ip", "-4", "route"], text=True).splitlines()] if p and "/" in p[0]]; candidates = [ipaddress.ip_network(f"10.250.{i}.0/24") for i in range(1, 30)] + [ipaddress.ip_network(f"172.28.{i}.0/24") for i in range(10, 50)] + [ipaddress.ip_network(f"192.168.{i}.0/24") for i in range(210, 240)]; chosen = next((str(cand) for cand in candidates if not any(cand.overlaps(u) for u in used)), None); sys.exit("FATAL: No free RFC1918 /24") if not chosen else print(chosen)')"

          echo "Selected verified safe subnet: ${SAFE_SUBNET}"

          echo "===> Ensuring dedicated overlay network ${MHCS_APPLICATION_NETWORK_NAME}..."
          EXISTING_NET_DRIVER="$(docker network inspect "${MHCS_APPLICATION_NETWORK_NAME}" --format '{{.Driver}}' 2>/dev/null || echo "missing")"
          EXISTING_NET_INTERNAL="$(docker network inspect "${MHCS_APPLICATION_NETWORK_NAME}" --format '{{.Internal}}' 2>/dev/null || echo "false")"
          EXISTING_NET_SUBNET="$(docker network inspect "${MHCS_APPLICATION_NETWORK_NAME}" --format '{{range .IPAM.Config}}{{.Subnet}}{{end}}' 2>/dev/null || echo "")"

          if [ "$EXISTING_NET_DRIVER" = "overlay" ] && [ "$EXISTING_NET_INTERNAL" = "true" ] && [ -n "$EXISTING_NET_SUBNET" ]; then
            echo "✅ Network ${MHCS_APPLICATION_NETWORK_NAME} exists and is valid overlay (subnet: ${EXISTING_NET_SUBNET}, internal: true)"
          else
            if [ "$EXISTING_NET_DRIVER" != "missing" ]; then
              echo "Recreating ${MHCS_APPLICATION_NETWORK_NAME} with verified configuration..."
              docker network rm "${MHCS_APPLICATION_NETWORK_NAME}" 2>/dev/null || true
            fi
            echo "Creating ${MHCS_APPLICATION_NETWORK_NAME} (driver: overlay, internal: true, subnet: ${SAFE_SUBNET})..."
            docker network create \
              --driver overlay \
              --internal \
              --subnet "${SAFE_SUBNET}" \
              --attachable=false \
              "${MHCS_APPLICATION_NETWORK_NAME}"
            echo "✅ Created overlay network ${MHCS_APPLICATION_NETWORK_NAME} with subnet ${SAFE_SUBNET}"
          fi

          echo "===> Pre-pulling base infrastructure images..."
          docker pull mysql:8.4 || true
          docker pull nginx:alpine || true

          echo "===> Pre-deploy database backup check..."
          DB_CONTAINER="$(docker ps -q --filter "name=mhcs_core_db" | head -n 1)"
          if [ -n "$DB_CONTAINER" ]; then
            echo "Database service is running. Taking pre-deploy snapshot..."
            docker exec "$DB_CONTAINER" \
              mysqldump -u root -p"${DB_ROOT_PASSWORD}" \
              --single-transaction --routines --triggers --events \
              "${DB_DATABASE}" > "/tmp/pre-deploy-${DB_DATABASE}-${LIVE_VERSION}.sql"
            if [ ! -s "/tmp/pre-deploy-${DB_DATABASE}-${LIVE_VERSION}.sql" ]; then
              echo "FATAL: Pre-deploy backup failed or produced empty file."
              exit 1
            fi
            echo "✅ Pre-deploy backup created: /tmp/pre-deploy-${DB_DATABASE}-${LIVE_VERSION}.sql"
          else
            echo "Database service not yet initialized. First deployment."
          fi

          echo "===> Deploying stack mhcs_core with immutable image ${MHCS_IMAGE}..."
          export MHCS_IMAGE
          export MHCS_APPLICATION_NETWORK_NAME
          export MPIPS_NETWORK_NAME
          docker stack deploy -c docker-compose.prod.yml --with-registry-auth --prune mhcs_core

          echo "===> Waiting for database service to become healthy..."
          _WAIT_DB=0
          until [ "$(docker service ls --format '{{.Replicas}}' --filter "name=mhcs_core_db" 2>/dev/null | head -n 1)" = "1/1" ]; do
            if [ "$_WAIT_DB" -ge 300 ]; then
              echo "FATAL: mhcs_core_db failed to reach 1/1 replicas in 300s."
              docker service ps mhcs_core_db --no-trunc || true
              docker service logs mhcs_core_db --tail=100 || true
              exit 1
            fi
            sleep 5
            _WAIT_DB=$((_WAIT_DB + 5))
          done

          echo "===> Verifying current-release app service readiness and immutable image propagation..."
          _WAIT_APP=0
          APP_CONTAINER=""
          while [ "$_WAIT_APP" -lt 300 ]; do
            # 1. Check service spec references the immutable release image
            svc_img="$(docker service inspect mhcs_core_app --format '{{.Spec.TaskTemplate.ContainerSpec.Image}}' 2>/dev/null || echo "")"
            if [ "$svc_img" != "${MHCS_IMAGE}" ] && [[ "$svc_img" != *"${LIVE_VERSION}"* ]]; then
              echo "[wait-app] Service spec image is '$svc_img' (waiting for '${MHCS_IMAGE}')..."
              sleep 5
              _WAIT_APP=$((_WAIT_APP + 5))
              continue
            fi

            # 2. Check current desired task is running
            task_id="$(docker service ps mhcs_core_app --filter "desired-state=running" --no-trunc --format '{{.ID}}' 2>/dev/null | head -n 1)"
            if [ -z "$task_id" ]; then
              echo "[wait-app] Waiting for running task to be scheduled..."
              sleep 5
              _WAIT_APP=$((_WAIT_APP + 5))
              continue
            fi

            task_state="$(docker service ps mhcs_core_app --filter "id=${task_id}" --format '{{.CurrentState}}' 2>/dev/null || echo "")"
            if ! echo "$task_state" | grep -iq "running"; then
              echo "[wait-app] Task $task_id state is '$task_state' (waiting for Running)..."
              sleep 5
              _WAIT_APP=$((_WAIT_APP + 5))
              continue
            fi

            # 3. Locate the container corresponding to this task
            c_candidate="$(docker ps -q --filter "label=com.docker.swarm.service.name=mhcs_core_app" --filter "status=running" | while read -r c; do
              c_task="$(docker inspect "$c" --format '{{index .Config.Labels "com.docker.swarm.task.id"}}' 2>/dev/null || echo "")"
              if [ -n "$c_task" ] && { [ "$c_task" = "$task_id" ] || [ "${task_id#$c_task}" != "$task_id" ] || [ "${c_task#$task_id}" != "$c_task" ]; }; then
                echo "$c"
                break
              fi
            done | head -n 1)"

            if [ -n "$c_candidate" ]; then
              c_img="$(docker inspect "$c_candidate" --format '{{.Config.Image}}' 2>/dev/null || echo "")"
              c_health="$(docker inspect "$c_candidate" --format '{{.State.Health.Status}}' 2>/dev/null || echo "none")"

              if [[ "$c_img" == *"${LIVE_VERSION}"* ]] && ( [ "$c_health" = "healthy" ] || docker exec "$c_candidate" php -r 'exit(@fsockopen("127.0.0.1",9000)?0:1);' 2>/dev/null ); then
                echo "✅ mhcs_core_app task $task_id (container $c_candidate, image $c_img) is running and healthy!"
                APP_CONTAINER="$c_candidate"
                break
              else
                echo "[wait-app] Container $c_candidate (img: $c_img, health: $c_health) initializing..."
              fi
            fi

            sleep 5
            _WAIT_APP=$((_WAIT_APP + 5))
          done

          if [ -z "$APP_CONTAINER" ]; then
            echo "FATAL: mhcs_core_app failed to stabilize with immutable image ${MHCS_IMAGE} in 300s."
            docker service ps mhcs_core_app --no-trunc || true
            docker service logs mhcs_core_app --tail=100 || true
            exit 1
          fi

          echo "===> Verifying App container database connectivity..."
          docker exec "$APP_CONTAINER" php -r '
            require "vendor/autoload.php";
            $app = require "bootstrap/app.php";
            $app->make(Illuminate\Contracts\Console\Kernel::class)->bootstrap();
            try {
              \Illuminate\Support\Facades\DB::connection()->getPdo();
              echo "DB_CONNECTION_SUCCESS\n";
            } catch (\Throwable $e) {
              echo "DB_CONNECTION_FAILED: " . $e->getMessage() . "\n";
              exit(1);
            }
          '

          echo "===> Running database migrations through current app container..."
          docker exec "$APP_CONTAINER" php artisan migrate --force

          echo "===> Checking database bootstrap state (safe & non-destructive)..."
          USER_COUNT="$(docker exec "$APP_CONTAINER" php -r '
            require "vendor/autoload.php";
            $app = require "bootstrap/app.php";
            $app->make(Illuminate\Contracts\Console\Kernel::class)->bootstrap();
            echo \Illuminate\Support\Facades\DB::table("users")->count();
          ' 2>/dev/null || echo "0")"

          if [ "$USER_COUNT" = "0" ]; then
            echo "Fresh database detected (0 users). Running authorized one-time MVP Core Clinic synthetic bootstrap..."
            docker exec \
              -e MHCS_ALLOW_PRODUCTION_MVP_SEED=true \
              -e MHCS_BOOTSTRAP_CREDENTIAL_PATH=/var/www/html/storage/app/private/bootstrap/credential-server.txt \
              "$APP_CONTAINER" \
              php artisan db:seed --class='Database\Seeders\MvpCoreClinicSeeder' --force

            _sudo chmod 0600 "$APP_STORAGE_HOST_PATH/app/private/bootstrap/credential-server.txt" 2>/dev/null || true
            echo "✅ MVP Core Clinic synthetic bootstrap completed successfully."
          else
            echo "Existing database detected ($USER_COUNT users). Skipping bootstrap seeder."
            echo "Non-destructive verification: Database contains existing records; bootstrap preserved without data mutation."
          fi

          echo "===> Warming application caches..."
          docker exec "$APP_CONTAINER" php artisan config:cache
          docker exec "$APP_CONTAINER" php artisan route:cache
          docker exec "$APP_CONTAINER" php artisan view:cache

      - name: Post-deploy verification
        run: |
          set -euo pipefail
          PASS=0
          FAIL=0
          WARN=0

          _pass() { PASS=$((PASS + 1)); echo "  PASS: $1"; }
          _fail() { FAIL=$((FAIL + 1)); echo "  FAIL: $1"; }
          _warn() { WARN=$((WARN + 1)); echo "  WARN: $1"; }

          LIVE_VERSION="${{ needs.build.outputs.app_version }}"
          EXPECTED_IMAGE="mhcs_core:${LIVE_VERSION}"

          echo "===> Waiting for all Swarm services to settle..."
          for svc in mhcs_core_db mhcs_core_app mhcs_core_queue mhcs_core_scheduler mhcs_core_image-worker mhcs_core_nginx; do
            _WAIT_REPL=0
            until [ "$(docker service ls --format '{{.Replicas}}' --filter "name=${svc}" 2>/dev/null | head -n 1)" = "1/1" ]; do
              if [ "$_WAIT_REPL" -ge 180 ]; then
                docker service logs "$svc" --tail=120 2>/dev/null || true
                docker service ps "$svc" --no-trunc 2>/dev/null || true
                exit 1
              fi
              sleep 5
              _WAIT_REPL=$((_WAIT_REPL + 5))
            done
          done

          echo "===> Post-deploy verification report"

          echo "1/8 Service replicas"
          for svc in mhcs_core_db mhcs_core_app mhcs_core_queue mhcs_core_scheduler mhcs_core_image-worker mhcs_core_nginx; do
            replicas="$(docker service ls --format '{{.Replicas}}' --filter "name=${svc}" 2>/dev/null || echo "")"
            if [ "$replicas" = "1/1" ]; then
              _pass "$svc replicas: $replicas"
            else
              _fail "$svc replicas: $replicas (expected 1/1)"
            fi
          done

          echo "2/8 Immutable release image propagation"
          for svc in mhcs_core_app mhcs_core_queue mhcs_core_scheduler mhcs_core_image-worker; do
            svc_image="$(docker service inspect "$svc" --format '{{.Spec.TaskTemplate.ContainerSpec.Image}}' 2>/dev/null || echo "")"
            if [ "$svc_image" = "$EXPECTED_IMAGE" ] || [[ "$svc_image" == *"${LIVE_VERSION}"* ]]; then
              _pass "$svc uses immutable release image: $svc_image"
            else
              _fail "$svc uses unexpected image: $svc_image (expected $EXPECTED_IMAGE)"
            fi
          done

          echo "3/8 Health checks"
          for svc in mhcs_core_app mhcs_core_db mhcs_core_nginx; do
            container="$(docker ps -q -f name="${svc}" -f status=running | head -n 1)"
            health="$(docker inspect --format='{{.State.Health.Status}}' "$container" 2>/dev/null || echo none)"
            if [ "$health" = "healthy" ]; then
              _pass "$svc health: $health"
            else
              _fail "$svc health: $health"
            fi
          done

          echo "4/8 Queue worker command & queue binding"
          queue_cmd="$(docker service inspect mhcs_core_queue --format='{{join .Spec.TaskTemplate.ContainerSpec.Command " "}}' 2>/dev/null || echo "")"
          if echo "$queue_cmd" | grep -q "queue:work"; then
            _pass "Default queue worker configured"
          else
            _fail "Default queue worker command missing"
          fi

          image_cmd="$(docker service inspect mhcs_core_image-worker --format='{{join .Spec.TaskTemplate.ContainerSpec.Command " "}}' 2>/dev/null || echo "")"
          if echo "$image_cmd" | grep -q "queue:work.*--queue=image-gateway"; then
            _pass "Image Gateway worker consumes exact queue: image-gateway"
          else
            _fail "Image Gateway worker command is missing --queue=image-gateway"
          fi

          echo "5/8 Network topology & isolation"
          image_container="$(docker ps -q -f name=mhcs_core_image-worker -f status=running | head -n 1)"
          image_networks="$(docker inspect "$image_container" --format='{{range $net, $v := .NetworkSettings.Networks}}{{$net}} {{end}}' 2>/dev/null || echo "")"
          
          if echo "$image_networks" | grep -q "madeena-software-network" && echo "$image_networks" | grep -q "mhcs-core-application-network"; then
            _pass "Image worker is attached to both mhcs-core-application-network and madeena-software-network"
          else
            _fail "Image worker networks unexpected: $image_networks"
          fi

          for svc in mhcs_core_db mhcs_core_app mhcs_core_queue mhcs_core_scheduler mhcs_core_nginx; do
            c_id="$(docker ps -q -f name="${svc}" -f status=running | head -n 1)"
            c_nets="$(docker inspect "$c_id" --format='{{range $net, $v := .NetworkSettings.Networks}}{{$net}} {{end}}' 2>/dev/null || echo "")"
            if echo "$c_nets" | grep -q "madeena-software-network"; then
              _fail "$svc is attached to madeena-software-network (must be isolated)"
            else
              _pass "$svc is isolated from MPIPS network (attached to: $c_nets)"
            fi
          done

          echo "6/8 Application runtime configuration assertions"
          app_container="$(docker ps -q -f name=mhcs_core_app -f status=running | head -n 1)"
          docker exec "$app_container" php -r '
            require "vendor/autoload.php";
            $app = require "bootstrap/app.php";
            $app->make(Illuminate\Contracts\Console\Kernel::class)->bootstrap();
            assert(config("app.env") === "production", "APP_ENV must be production");
            assert(config("app.debug") === false, "APP_DEBUG must be false");
            assert(config("mhcs.private_object_disk") === "s3", "Private object disk must be s3");
            assert(config("queue.default") === "database", "Queue connection must be database");
            assert(config("mhcs.mpips.worker_timeout_seconds") < (int) env("DB_QUEUE_RETRY_AFTER", 420), "Queue retry-after must exceed worker timeout");
            echo "RUNTIME_ASSERTIONS_PASS\n";
          ' >/dev/null
          _pass "Application production runtime assertions passed"

          echo "7/8 Public HTTP health endpoint & domain verification"
          http_code="$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8013/up || true)"
          domain_code="$(curl -s -o /dev/null -w "%{http_code}" -H "Host: ${{ secrets.APP_DOMAIN }}" http://127.0.0.1:8013/up || true)"
          if [ "$http_code" = "200" ] && [ "$domain_code" = "200" ]; then
            _pass "Public health endpoint /up returned HTTP 200 on port 8013 (Host: ${{ secrets.APP_DOMAIN }})"
          elif [ "$http_code" = "200" ]; then
            _pass "Public health endpoint /up returned HTTP 200 on port 8013"
          else
            _fail "Public health endpoint /up returned HTTP $http_code (expected 200)"
          fi

          echo "8/8 Credential server file protection"
          if docker exec "$app_container" test -f /var/www/html/storage/app/private/bootstrap/credential-server.txt; then
            cred_mode="$(docker exec "$app_container" stat -c '%a' /var/www/html/storage/app/private/bootstrap/credential-server.txt 2>/dev/null || echo 'unknown')"
            if [ "$cred_mode" = "600" ] || [ "$cred_mode" = "unknown" ]; then
              _pass "credential-server.txt exists and appears protected (mode: $cred_mode)"
            else
              _fail "credential-server.txt has unexpected permissions: $cred_mode (expected 600)"
            fi
          else
            _warn "credential-server.txt not present (database was existing or bootstrap was skipped)"
          fi

          echo "Results: ${PASS} passed | ${FAIL} failed | ${WARN} warnings"
          {
            echo "# Deploy Summary"
            echo ""
            echo "| Metric | Value |"
            echo "|---|---|"
            echo "| Passed | ${PASS} |"
            echo "| Failed | ${FAIL} |"
            echo "| Warnings | ${WARN} |"
            echo "| Version | ${{ needs.build.outputs.app_version }} |"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$FAIL" -gt 0 ]; then
            exit 1
          fi

      - name: Failure Diagnostic Dump
        if: failure()
        run: |
          set -uo pipefail
          echo "Stack task history"
          docker stack ps mhcs_core --no-trunc --format 'table {{.Name}}\t{{.CurrentState}}\t{{.Error}}' 2>/dev/null | head -30 || true
          for svc in mhcs_core_app mhcs_core_db mhcs_core_queue mhcs_core_scheduler mhcs_core_image-worker mhcs_core_nginx; do
            echo "Logs: $svc"
            docker service logs "$svc" --tail=80 --no-task-ids 2>/dev/null || true
          done
          df -h / /var/lib/docker 2>/dev/null || true
          free -h 2>/dev/null || true
          docker ps -a --format 'table {{.Names}}\t{{.Status}}\t{{.Ports}}' 2>/dev/null || true
