name: Verify Production Upload Ingress

on:
  workflow_dispatch:

concurrency:
  group: production-deployment-mhcs_core
  cancel-in-progress: false

jobs:
  probe:
    name: Probe 100 MiB production ingress
    runs-on: self-hosted
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Submit generated multipart probe
        shell: bash
        run: |
          set -euo pipefail

          required_bytes=$((100 * 1024 * 1024))
          probe_file="$(mktemp /tmp/mhcs-production-upload.XXXXXX)"
          trap 'rm -f -- "$probe_file"' EXIT INT TERM

          truncate -s "$required_bytes" "$probe_file"
          file_bytes="$(stat -c '%s' "$probe_file")"
          if (( file_bytes < required_bytes )); then
            echo "FAIL: generated probe is smaller than 100 MiB."
            exit 1
          fi

          curl_exit=0
          response="$(
            curl \
              --silent \
              --show-error \
              --max-time 180 \
              --request POST \
              --form "probe=@${probe_file};type=application/octet-stream" \
              --output /dev/null \
              --write-out '%{http_code} %{size_upload}' \
              http://127.0.0.1:8013/up 2>/dev/null
          )" || curl_exit=$?

          http_status="${response%% *}"
          uploaded_bytes="${response##* }"
          [[ "$http_status" =~ ^[0-9]{3}$ ]] || http_status=000
          [[ "$uploaded_bytes" =~ ^[0-9]+$ ]] || uploaded_bytes=0

          echo "HTTP status: $http_status"
          echo "Uploaded bytes: $uploaded_bytes"

          if (( curl_exit != 0 )); then
            if (( curl_exit == 28 )); then
              echo "FAIL: production ingress probe timed out."
            else
              echo "FAIL: production ingress transport failed."
            fi
            exit 1
          fi

          if [[ "$http_status" == 413 ]]; then
            echo "FAIL: production ingress returned HTTP 413."
            exit 1
          fi

          if (( uploaded_bytes < required_bytes )); then
            echo "FAIL: multipart upload completed below 100 MiB."
            exit 1
          fi

          if [[ "$http_status" != 405 ]]; then
            echo "FAIL: expected HTTP 405 from the existing /up GET|HEAD route."
            exit 1
          fi

          echo "PASS: completed at least 100 MiB multipart transfer and received HTTP 405."
