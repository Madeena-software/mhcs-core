name: Diagnose Production npm Egress

on:
  workflow_dispatch:

concurrency:
  group: production-npm-egress-diagnostic
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: self-hosted
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run bounded npm egress diagnostic
        shell: bash
        run: |
          set -uo pipefail

          IMAGE='node:24-alpine@sha256:d32cdf619f63fe0471182d08996dd516c6275bb5fd31ae06e55a570bd9e1ad43'
          HOST='registry.npmjs.org'
          TMP_ROOT="$(mktemp -d)"
          NPM_WORKSPACE="$TMP_ROOT/npm"
          mkdir -p "$NPM_WORKSPACE"
          cleanup_status=PASS

          cleanup() {
            rm -rf "$TMP_ROOT" || cleanup_status=FAIL
            echo "workspace_cleanup=$cleanup_status"
          }
          trap cleanup EXIT

          count_v4="$(
            {
              getent ahostsv4 "$HOST" 2>/dev/null || true
            } | awk '!seen[$1]++' | wc -l | tr -d ' '
          )"
          count_v6="$(
            {
              getent ahostsv6 "$HOST" 2>/dev/null || true
            } | awk '!seen[$1]++' | wc -l | tr -d ' '
          )"
          count_v4="${count_v4:-0}"
          count_v6="${count_v6:-0}"
          if [ "$count_v4" -gt 0 ] || [ "$count_v6" -gt 0 ]; then
            host_dns_resolution=PASS
          else
            host_dns_resolution=FAIL
          fi
          echo "host_dns_resolution=$host_dns_resolution"
          echo "host_dns_ipv4_count=$count_v4"
          echo "host_dns_ipv6_count=$count_v6"

          host_https_ipv4_successes=0
          for attempt in 1 2 3; do
            if curl -4 --fail --silent --show-error --connect-timeout 10 --max-time 20 -o /dev/null "https://$HOST/" 2>/dev/null; then
              host_https_ipv4_successes=$((host_https_ipv4_successes + 1))
            fi
          done
          echo "host_https_ipv4_successes=$host_https_ipv4_successes"

          if [ "$count_v6" -eq 0 ]; then
            echo 'host_https_ipv6_status=NO_ADDRESS'
            echo 'host_https_ipv6_successes=NA'
          else
            host_https_ipv6_successes=0
            for attempt in 1 2 3; do
              if curl -6 --fail --silent --show-error --connect-timeout 10 --max-time 20 -o /dev/null "https://$HOST/" 2>/dev/null; then
                host_https_ipv6_successes=$((host_https_ipv6_successes + 1))
              fi
            done
            echo 'host_https_ipv6_status=ATTEMPTED'
            echo "host_https_ipv6_successes=$host_https_ipv6_successes"
          fi

          tarball_1='https://registry.npmjs.org/@babel/runtime-corejs3/-/runtime-corejs3-7.29.2.tgz'
          tarball_2='https://registry.npmjs.org/@cornerstonejs/codec-charls/-/codec-charls-1.2.3.tgz'
          tarball_3='https://registry.npmjs.org/@cornerstonejs/codec-openjpeg/-/codec-openjpeg-1.3.0.tgz'
          probe_tarball() {
            url="$1"
            payload="$TMP_ROOT/payload-$2"
            # Maximum retained bytes per package: 64 KiB.
            if curl -4 --fail --silent --show-error --connect-timeout 10 --max-time 20 --range 0-65535 --max-filesize 65536 -o "$payload" "$url" 2>/dev/null \
              && [ "$(wc -c < "$payload")" -gt 0 ] \
              && [ "$(wc -c < "$payload")" -le 65536 ]; then
              result=PASS
            else
              result=FAIL
            fi
            rm -f "$payload"
            echo "host_tarball_probe_$2=$result"
            return 0
          }
          probe_tarball "$tarball_1" 1; tarball_1_result="$result"
          probe_tarball "$tarball_2" 2; tarball_2_result="$result"
          probe_tarball "$tarball_3" 3; tarball_3_result="$result"

          node_probe() {
            network="$1"
            docker run --rm $network "$IMAGE" node -e '
              const dns = require("dns");
              const https = require("https");
              const host = "registry.npmjs.org";
              const request = () => new Promise(resolve => {
                const req = https.request({host, port: 443, path: "/", method: "HEAD", timeout: 20000}, res => {
                  res.resume();
                  res.on("end", () => resolve(true));
                });
                req.on("timeout", () => req.destroy());
                req.on("error", () => resolve(false));
                req.end();
              });
              dns.promises.lookup(host, {all: true}).then(async addresses => {
                let successes = 0;
                for (let i = 0; i < 3; i += 1) successes += await request();
                console.log(`DNS=${addresses.length ? "PASS" : "FAIL"}`);
                console.log(`HTTPS=${successes}`);
              }).catch(async () => {
                for (let i = 0; i < 3; i += 1) await request();
                console.log("DNS=FAIL");
                console.log("HTTPS=0");
              });
            ' 2>/dev/null
          }

          default_probe="$(node_probe '--network bridge' || true)"
          hostnet_probe="$(node_probe '--network host' || true)"
          docker_default_dns=FAIL
          docker_hostnet_dns=FAIL
          docker_default_https_successes=0
          docker_hostnet_https_successes=0
          grep -q 'DNS=PASS' <<<"$default_probe" && docker_default_dns=PASS
          grep -q 'DNS=PASS' <<<"$hostnet_probe" && docker_hostnet_dns=PASS
          docker_default_https_successes="$(awk -F= '$1 == "HTTPS" {print $2}' <<<"$default_probe" | tail -1)"
          docker_hostnet_https_successes="$(awk -F= '$1 == "HTTPS" {print $2}' <<<"$hostnet_probe" | tail -1)"
          echo "docker_default_dns=$docker_default_dns"
          echo "docker_default_https_successes=${docker_default_https_successes:-0}"
          echo "docker_hostnet_dns=$docker_hostnet_dns"
          echo "docker_hostnet_https_successes=${docker_hostnet_https_successes:-0}"

          cp package.json package-lock.json "$NPM_WORKSPACE/"
          npm_log="$TMP_ROOT/npm.log"
          npm_status=0
          if timeout 360s docker run --rm --network bridge \
            -e NPM_CONFIG_FETCH_RETRIES=5 \
            -e NPM_CONFIG_FETCH_RETRY_FACTOR=2 \
            -e NPM_CONFIG_FETCH_RETRY_MINTIMEOUT=20000 \
            -e NPM_CONFIG_FETCH_RETRY_MAXTIMEOUT=120000 \
            -e NPM_CONFIG_FETCH_TIMEOUT=300000 \
            -v "$NPM_WORKSPACE:/input:ro" "$IMAGE" sh -ceu '
              mkdir -p /tmp/npm-work
              cp /input/package.json /input/package-lock.json /tmp/npm-work/
              cd /tmp/npm-work
              exec npm ci --ignore-scripts --no-audit --no-fund
            ' >"$npm_log" 2>&1
          then
            npm_status=0
          else
            npm_status=$?
          fi
          npm_command_exit_status="$npm_status"
          if [ "$npm_status" -eq 0 ]; then
            npm_reproduction=PASS
            npm_failure_code=NONE
          else
            npm_reproduction=FAIL
            [ "$npm_status" -eq 124 ] && npm_reproduction=TIMEOUT
            if grep -Eqi 'ETIMEDOUT' "$npm_log"; then npm_failure_code=ETIMEDOUT
            elif grep -Eqi 'ECONNRESET' "$npm_log"; then npm_failure_code=ECONNRESET
            elif grep -Eqi 'EAI_AGAIN' "$npm_log"; then npm_failure_code=EAI_AGAIN
            elif grep -Eqi 'ENETUNREACH' "$npm_log"; then npm_failure_code=ENETUNREACH
            else npm_failure_code=OTHER
            fi
          fi
          rm -f "$npm_log"
          echo "npm_reproduction=$npm_reproduction"
          echo "npm_failure_code=$npm_failure_code"
          echo "npm_command_exit_status=$npm_command_exit_status"

          recognized_npm_network_failure=false
          case "$npm_failure_code" in
            ETIMEDOUT|ECONNRESET|EAI_AGAIN|ENETUNREACH)
              recognized_npm_network_failure=true
              ;;
          esac

          lightweight_network_healthy=false
          if [ "$host_https_ipv4_successes" -ge 2 ] \
            && [ "$tarball_1_result" = PASS ] \
            && [ "$tarball_2_result" = PASS ] \
            && [ "$tarball_3_result" = PASS ] \
            && [ "${docker_default_https_successes:-0}" -ge 2 ] \
            && [ "${docker_hostnet_https_successes:-0}" -ge 2 ]; then
            lightweight_network_healthy=true
          fi

          classification=UNKNOWN
          if [ "$host_https_ipv4_successes" -lt 2 ] && [ "${docker_default_https_successes:-0}" -lt 2 ] && [ "${docker_hostnet_https_successes:-0}" -lt 2 ]; then
            classification=HOST_NETWORK_FAILURE
          elif [ "$host_https_ipv4_successes" -ge 2 ] && [ "${docker_default_https_successes:-0}" -lt 2 ] && [ "${docker_hostnet_https_successes:-0}" -ge 2 ]; then
            classification=DOCKER_DEFAULT_NETWORK_FAILURE
          elif [ "$host_https_ipv4_successes" -ge 2 ] && { [ "$tarball_1_result" = FAIL ] 2>/dev/null || [ "$tarball_2_result" = FAIL ] 2>/dev/null || [ "$tarball_3_result" = FAIL ] 2>/dev/null; }; then
            classification=NPM_TARBALL_PATH_FAILURE
          elif [ "$npm_reproduction" = FAIL ] \
            && [ "$recognized_npm_network_failure" = true ] \
            && [ "$lightweight_network_healthy" = true ]; then
            classification=NPM_CI_NETWORK_FAILURE
          elif [ "$npm_reproduction" = FAIL ] || [ "$npm_reproduction" = TIMEOUT ]; then
            classification=UNKNOWN
          elif [ "$npm_reproduction" = PASS ] && [ "$count_v6" -gt 0 ] && [ "$host_https_ipv4_successes" -ge 2 ] && [ "${host_https_ipv6_successes:-0}" -lt 2 ]; then
            classification=IPV6_PATH_DEGRADED
          elif [ "$host_https_ipv4_successes" -eq 3 ] && [ "${docker_default_https_successes:-0}" -eq 3 ] && [ "${docker_hostnet_https_successes:-0}" -eq 3 ] && [ "$npm_reproduction" = PASS ]; then
            classification=NO_NETWORK_FAILURE_OBSERVED
          else
            classification=NETWORK_INTERMITTENT
          fi
          echo "root_cause_classification=$classification"
          echo 'production_mutation_performed=false'
          echo 'npm_egress_diagnostic=PASS'
