name: Diagnose production availability during large upload

on:
  workflow_dispatch:

concurrency:
  group: production-deployment-mhcs_core
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: self-hosted
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      - name: Run read-only large-upload availability diagnostic
        shell: bash
        run: |
          set -euo pipefail

          SERVICES=(mhcs_core_nginx mhcs_core_app mhcs_core_queue mhcs_core_image-worker)
          NGINX_SERVICE="mhcs_core_nginx"
          APP_SERVICE="mhcs_core_app"
          NGINX_CONTAINER=""
          APP_CONTAINER=""

          safe() { "$@" 2>&1 || true; }
          bool() { [ "${1:-}" = "0" ] && echo true || echo false; }
          sanitize() { sed -E 's/(https?:\/\/[^/[:space:]]+).*/\1/; s/[?&](token|key|secret|signature|authorization)=[^&[:space:]]+//Ig; s/(Authorization:|Cookie:)[^[:space:]]+/***REDACTED***/Ig'; }
          emit() { printf '%s=%s\n' "$1" "${2:-UNKNOWN}"; }

          echo "UTC_TIMESTAMP=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "UPTIME=$(safe uptime | sanitize)"
          echo "LOAD_AVERAGE=$(safe uptime | sed -E 's/.*load average[s]?:[[:space:]]*//')"
          emit CPU_COUNT "$(safe nproc | tr -cd '0-9')"
          echo "FREE_MEMORY=$(safe free -m | sanitize)"
          echo "SWAP=$(safe free -m | awk '/^Swap:/ {print "total_mb=" $2 ",used_mb=" $3 ",free_mb=" $4}')"
          echo "FILESYSTEM_USAGE=$(safe df -h | awk 'NR==1 || $NF=="/" {print}' | sanitize)"
          echo "INODE_USAGE=$(safe df -i | awk 'NR==1 || $NF=="/" {print}' | sanitize)"

          echo "HOST_IPV4_ROUTE=$(safe ip -4 route | sanitize)"
          echo "HOST_LINK_STATS=$(safe ip -s link | sanitize)"
          echo "SOCKET_SUMMARY=$(safe ss -s | sanitize)"
          nstat_snapshot() { safe nstat -az 2>/dev/null | awk 'BEGIN{IGNORECASE=1} /Retrans|Reset|ListenOverflows|ListenDrops|Timeout|TimeWait/ {print $1 "=" $2}'; }
          nstat_before="$(nstat_snapshot)"
          echo "NSTAT_BEFORE=$(echo "$nstat_before" | tr '\n' ';')"

          port_8013="false"
          if ss -H -ltn '( sport = :8013 )' 2>/dev/null | grep -q .; then port_8013="true"; fi
          emit HOST_8013_LISTENING "$port_8013"

          probe() {
            # Output contract: LOCAL_8013_HTTP_STATUS, LOCAL_8013_CONNECT_SECONDS,
            # LOCAL_8013_TOTAL_SECONDS, LOCAL_8013_RESULT,
            # PUBLIC_HTTPS_HTTP_STATUS, PUBLIC_HTTPS_CONNECT_SECONDS,
            # PUBLIC_HTTPS_TOTAL_SECONDS, PUBLIC_HTTPS_RESULT.
            local name="$1" url="$2" status="000" connect="-1" total="-1" result="FAIL"
            local line
            line="$(curl --silent --show-error --noproxy '*' --max-time 8 --connect-timeout 3 --max-redirs 0 -o /dev/null -w '%{http_code} %{time_connect} %{time_total}' "$url" 2>/dev/null || true)"
            read -r status connect total <<<"$line"
            if [[ "$status" =~ ^2[0-9][0-9]$ ]]; then result="PASS"; fi
            emit "${name}_HTTP_STATUS" "$status"
            emit "${name}_CONNECT_SECONDS" "$connect"
            emit "${name}_TOTAL_SECONDS" "$total"
            emit "${name}_RESULT" "$result"
            [ "$result" = PASS ]
          }
          local_ok=false
          if probe LOCAL_8013 http://127.0.0.1:8013/up; then local_ok=true; fi
          public_ok="SKIPPED"
          if getent ahostsv4 fams.mhcsgo.cloud >/dev/null 2>&1; then
            public_ok=false
            if probe PUBLIC_HTTPS https://fams.mhcsgo.cloud/up; then public_ok=true; fi
          else
            emit PUBLIC_HTTPS_RESULT SKIPPED_UNRESOLVABLE
          fi

          dns_wan_match="UNPROVEN"
          resolved_ip="$(getent ahostsv4 fams.mhcsgo.cloud 2>/dev/null | awk '{print $1; exit}' || true)"
          ipify_ip="$(curl --silent --show-error --max-time 5 https://api.ipify.org 2>/dev/null || true)"
          ifconfig_ip="$(curl --silent --show-error --max-time 5 https://ifconfig.me/ip 2>/dev/null || true)"
          outbound_wan_ip=""
          sources_agree="false"
          if [ -n "$ipify_ip" ] && [ -n "$ifconfig_ip" ] && [ "$ipify_ip" = "$ifconfig_ip" ]; then
            sources_agree="true"
            outbound_wan_ip="$ipify_ip"
          elif [ -n "$ipify_ip" ]; then
            outbound_wan_ip="$ipify_ip"
          else
            outbound_wan_ip="$ifconfig_ip"
          fi
          emit CURRENT_PUBLIC_IPV4 "$outbound_wan_ip"
          emit PUBLIC_IP_SOURCES_AGREE "$sources_agree"

          mhcs_a="$(getent ahostsv4 mhcsgo.cloud 2>/dev/null | awk '{print $1; exit}' || true)"
          fams_a="$(getent ahostsv4 fams.mhcsgo.cloud 2>/dev/null | awk '{print $1; exit}' || true)"
          emit MHCS_DNS_A "$mhcs_a"
          emit FAMS_DNS_A "$fams_a"
          dns_agree="false"
          if [ -n "$mhcs_a" ] && [ "$mhcs_a" = "$fams_a" ]; then
            dns_agree="true"
          fi
          emit DNS_RECORDS_AGREE "$dns_agree"

          if [ -n "$resolved_ip" ] && [ -n "$outbound_wan_ip" ]; then
            if [ "$resolved_ip" = "$outbound_wan_ip" ]; then
              dns_wan_match="true"
            else
              dns_wan_match="false"
            fi
          fi
          emit DNS_MATCHES_CURRENT_WAN_IP "$dns_wan_match"

          nstat_after="$(nstat_snapshot)"
          echo "NSTAT_AFTER=$(echo "$nstat_after" | tr '\n' ';')"
          nstat_delta="$(awk -F= 'NR==FNR {before[$1]=$2; next} {delta=$2-(before[$1]+0); if (delta != 0) print $1 "=" delta}' <(printf '%s\n' "$nstat_before") <(printf '%s\n' "$nstat_after") )"
          echo "NSTAT_DELTA=$(echo "$nstat_delta" | tr '\n' ';')"

          resolve_container() {
            local service="$1" task="" candidate="" candidate_task=""
            task="$(safe docker service ps "$service" --filter desired-state=running --no-trunc --format '{{.ID}}' | head -n 1)"
            [ -n "$task" ] || return 0
            while IFS= read -r candidate; do
              [ -n "$candidate" ] || continue
              candidate_task="$(safe docker inspect "$candidate" --format '{{index .Config.Labels "com.docker.swarm.task.id"}}')"
              if [ "$candidate_task" = "$task" ] || [[ "$candidate_task" == "$task"* ]] || [[ "$task" == "$candidate_task"* ]]; then
                printf '%s' "$candidate"; return 0
              fi
            done < <(safe docker ps -q --filter "label=com.docker.swarm.service.name=$service" --filter status=running)
          }
          NGINX_CONTAINER="$(resolve_container "$NGINX_SERVICE")"
          APP_CONTAINER="$(resolve_container "$APP_SERVICE")"
          emit NGINX_CONTAINER_RESOLVED "$( [ -n "$NGINX_CONTAINER" ] && echo true || echo false )"
          emit APP_CONTAINER_RESOLVED "$( [ -n "$APP_CONTAINER" ] && echo true || echo false )"
          nginx_health="UNKNOWN"
          if [ -n "$NGINX_CONTAINER" ]; then
            nginx_health="$(safe docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' "$NGINX_CONTAINER")"
          fi
          emit NGINX_HEALTH "$nginx_health"
          app_health="UNKNOWN"
          if [ -n "$APP_CONTAINER" ]; then
            app_health="$(safe docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' "$APP_CONTAINER")"
          fi
          emit APP_HEALTH "$app_health"

          for service in "${SERVICES[@]}"; do
            echo "SERVICE_${service}_STATE=$(safe docker service inspect "$service" --format 'desired={{.Spec.Mode.Replicated.Replicas}} running={{.ServiceStatus.RunningTasks}} image={{.Spec.TaskTemplate.ContainerSpec.Image}}' | sanitize)"
            echo "SERVICE_${service}_TASKS=$(safe docker service ps "$service" --no-trunc --format 'state={{.CurrentState}} image={{.Image}} desired={{.DesiredState}}' | sanitize)"
          done

          STAT_TARGETS=()
          for service in "${SERVICES[@]}"; do
            while IFS= read -r container_name; do
              [ -n "$container_name" ] || continue
              STAT_TARGETS+=("$container_name")
            done < <(safe docker ps -q --filter "label=com.docker.swarm.service.name=$service" --filter status=running)
          done
          if [ "${#STAT_TARGETS[@]}" -gt 0 ]; then
            # docker stats .Name is the sanitized container name; all targets came from service labels above.
            echo "DOCKER_STATS=$(safe docker stats --no-stream --format '{{.Name}} cpu={{.CPUPerc}} mem={{.MemUsage}} net={{.NetIO}} block={{.BlockIO}} pids={{.PIDs}}' "${STAT_TARGETS[@]}" | sanitize)"
          else
            emit DOCKER_STATS NOT_OBSERVED
          fi

          temp_path="UNKNOWN"
          if [ -n "$NGINX_CONTAINER" ]; then
            temp_path="$(safe docker exec "$NGINX_CONTAINER" nginx -T 2>/dev/null | awk '$1=="client_body_temp_path" {gsub(";", "", $2); print $2; exit}')"
            [ -n "$temp_path" ] || temp_path="UNKNOWN"
          fi
          emit NGINX_CLIENT_BODY_TEMP_PATH "$temp_path"
          if [ "$temp_path" != UNKNOWN ] && [ -n "$NGINX_CONTAINER" ]; then
            temp_fs="$(safe docker exec "$NGINX_CONTAINER" df -hP -- "$temp_path" | tail -n 1 | sanitize)"
            temp_bytes="$(safe docker exec "$NGINX_CONTAINER" sh -c 'du -sb -- "$1" 2>/dev/null | cut -f1' sh "$temp_path" | tr -cd '0-9')"
            temp_count="$(safe docker exec "$NGINX_CONTAINER" sh -c 'find "$1" -type f -printf . 2>/dev/null | wc -c' sh "$temp_path" | tr -cd '0-9')"
          else
            temp_fs="UNKNOWN"; temp_bytes="UNKNOWN"; temp_count="UNKNOWN"
          fi
          emit NGINX_CLIENT_BODY_TEMP_FS_USAGE "$temp_fs"
          emit NGINX_CLIENT_BODY_TEMP_BYTES "${temp_bytes:-UNKNOWN}"
          emit NGINX_CLIENT_BODY_TEMP_FILE_COUNT "${temp_count:-UNKNOWN}"

          if [ -n "$NGINX_CONTAINER" ]; then
            safe docker exec "$NGINX_CONTAINER" nginx -T 2>/dev/null | awk '$1 ~ /^(worker_processes|worker_connections|client_max_body_size|client_body_buffer_size|client_body_timeout|fastcgi_request_buffering)$/ {gsub(";", "", $2); print $1 "=" $2}' | sanitize
          fi
          app_health="UNKNOWN"
          if [ -n "$APP_CONTAINER" ]; then
            # Output contract: pm, pm.max_children, pm.start_servers,
            # pm.min_spare_servers, pm.max_spare_servers.
            safe docker exec "$APP_CONTAINER" sh -c 'php-fpm -tt 2>&1 || php-fpm8.2 -tt 2>&1 || true' | sed -nE 's/^[[:space:]]*(pm(\.[a-z_]+)?)[[:space:]]*=[[:space:]]*([^ ,;]+).*/\1=\3/p' | sanitize
            app_health="$(safe docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' "$APP_CONTAINER")"
          fi
          php9000="UNKNOWN"
          if [ -n "$NGINX_CONTAINER" ]; then
            if docker exec "$NGINX_CONTAINER" sh -c 'nc -z -w 2 mhcs_core_app 9000' >/dev/null 2>&1; then php9000="true"; else php9000="false"; fi
          fi
          emit PHP_FPM_PORT_9000_ACCEPTING "$php9000"

          log_count() {
            local service="$1" pattern="$2"
            docker service logs --since 5m --tail 200 "$service" 2>/dev/null | grep -Eic "$pattern" || true
          }
          NGINX_NO_SPACE_LEFT_COUNT="$(log_count "$NGINX_SERVICE" 'no space left')"
          APP_NO_SPACE_LEFT_COUNT="$(log_count "$APP_SERVICE" 'no space left')"
          TOO_MANY_OPEN_FILES_COUNT=0
          WORKER_CONNECTION_LIMIT_COUNT=0
          UPSTREAM_TIMEOUT_COUNT=0
          CONNECT_FAILURE_COUNT=0
          CLIENT_TIMEOUT_COUNT=0
          OOM_COUNT=0
          for service in "$NGINX_SERVICE" "$APP_SERVICE"; do
            TOO_MANY_OPEN_FILES_COUNT=$((TOO_MANY_OPEN_FILES_COUNT + $(log_count "$service" 'too many open files')))
            WORKER_CONNECTION_LIMIT_COUNT=$((WORKER_CONNECTION_LIMIT_COUNT + $(log_count "$service" 'worker_connections are not enough')))
            UPSTREAM_TIMEOUT_COUNT=$((UPSTREAM_TIMEOUT_COUNT + $(log_count "$service" 'upstream timed out')))
            CONNECT_FAILURE_COUNT=$((CONNECT_FAILURE_COUNT + $(log_count "$service" 'connect\(\) failed')))
            CLIENT_TIMEOUT_COUNT=$((CLIENT_TIMEOUT_COUNT + $(log_count "$service" 'client timed out|client intended to send too large body|prematurely closed connection')))
            OOM_COUNT=$((OOM_COUNT + $(log_count "$service" 'OOM|out of memory|killed')))
          done
          emit NGINX_NO_SPACE_LEFT_COUNT "$NGINX_NO_SPACE_LEFT_COUNT"
          emit APP_NO_SPACE_LEFT_COUNT "$APP_NO_SPACE_LEFT_COUNT"
          emit TOO_MANY_OPEN_FILES_COUNT "$TOO_MANY_OPEN_FILES_COUNT"
          emit WORKER_CONNECTION_LIMIT_COUNT "$WORKER_CONNECTION_LIMIT_COUNT"
          emit UPSTREAM_TIMEOUT_COUNT "$UPSTREAM_TIMEOUT_COUNT"
          emit CONNECT_FAILURE_COUNT "$CONNECT_FAILURE_COUNT"
          emit CLIENT_TIMEOUT_COUNT "$CLIENT_TIMEOUT_COUNT"
          emit OOM_COUNT "$OOM_COUNT"

          host_resource_pressure=false
          if df -P / 2>/dev/null | awk 'NR==2 {exit ($5+0 >= 95 ? 0 : 1)}' || \
             df -Pi / 2>/dev/null | awk 'NR==2 {exit ($5+0 >= 95 ? 0 : 1)}' || \
             free -m 2>/dev/null | awk '/^Mem:/ {exit (($7+0) < (($2+0)*0.05) ? 0 : 1)}' || \
             awk '{exit (($1+0)/($3+0) >= 0.95 ? 0 : 1)}' /proc/sys/fs/file-nr 2>/dev/null; then
            host_resource_pressure=true
          fi
          temp_storage_pressure=false
          if [ "${temp_fs:-UNKNOWN}" != UNKNOWN ] && echo "$temp_fs" | awk '{exit ($5+0 >= 95 ? 0 : 1)}'; then
            temp_storage_pressure=true
          elif [ "$NGINX_NO_SPACE_LEFT_COUNT" -gt 0 ]; then
            temp_storage_pressure=true
          fi
          network_listener_failure=false
          if printf '%s\n' "$nstat_delta" | awk -F= '$1 ~ /Listen(Overflows|Drops)$/ && ($2+0) > 0 {found=1} END {exit(found ? 0 : 1)}'; then
            network_listener_failure=true
          fi
          if [ "$temp_storage_pressure" = true ]; then
            classification=REQUEST_BODY_TEMP_STORAGE_PRESSURE
          elif [ "$host_resource_pressure" = true ]; then
            classification=HOST_RESOURCE_PRESSURE
          elif [ "$network_listener_failure" = true ]; then
            classification=HOST_NETWORK_FAILURE
          elif [ "$port_8013" = true ] && [[ "$nginx_health" =~ ^(healthy|running)$ ]] && { [ "$php9000" = false ] || [[ "$app_health" =~ ^(unhealthy|exited|dead)$ ]]; }; then
            classification=APP_UPSTREAM_FAILURE
          elif [ "$port_8013" != true ] || [ "$local_ok" = false ]; then
            classification=LOCAL_NGINX_FAILURE
          elif [ "$local_ok" = true ] && [ "$public_ok" = false ]; then
            classification=PUBLIC_PATH_FAILURE
          elif [ "$local_ok" = true ] && [ "$public_ok" = true ]; then
            classification=NO_FAILURE_OBSERVED
          else
            classification=INDETERMINATE
          fi
          emit CLASSIFICATION "$classification"

  external_ingress_probe:
    name: External Internet Vantage Probe
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      - name: Run unauthenticated external network diagnostic
        shell: bash
        run: |
          set -euo pipefail

          emit() { printf '%s=%s\n' "$1" "${2:-UNKNOWN}"; }

          echo "=== 1. External DNS Probes ==="
          mhcs_sys_ip="$(getent ahostsv4 mhcsgo.cloud 2>/dev/null | awk '{print $1; exit}' || true)"
          fams_sys_ip="$(getent ahostsv4 fams.mhcsgo.cloud 2>/dev/null | awk '{print $1; exit}' || true)"

          emit MHCS_SYSTEM_DNS_RESOLVED "$( [ -n "$mhcs_sys_ip" ] && echo true || echo false )"
          emit FAMS_SYSTEM_DNS_RESOLVED "$( [ -n "$fams_sys_ip" ] && echo true || echo false )"

          mhcs_ip_count="$(getent ahostsv4 mhcsgo.cloud 2>/dev/null | awk '{print $1}' | sort -u | grep -c . || true)"
          fams_ip_count="$(getent ahostsv4 fams.mhcsgo.cloud 2>/dev/null | awk '{print $1}' | sort -u | grep -c . || true)"

          emit MHCS_DNS_IP_COUNT "$mhcs_ip_count"
          emit FAMS_DNS_IP_COUNT "$fams_ip_count"

          resolvers_agree="NOT_TESTED"
          if command -v dig >/dev/null 2>&1; then
            c1_mhcs="$(dig +short @1.1.1.1 mhcsgo.cloud A 2>/dev/null | sort || true)"
            g8_mhcs="$(dig +short @8.8.8.8 mhcsgo.cloud A 2>/dev/null | sort || true)"
            c1_fams="$(dig +short @1.1.1.1 fams.mhcsgo.cloud A 2>/dev/null | sort || true)"
            g8_fams="$(dig +short @8.8.8.8 fams.mhcsgo.cloud A 2>/dev/null | sort || true)"
            if [ -n "$c1_mhcs" ] && [ "$c1_mhcs" = "$g8_mhcs" ] && [ -n "$c1_fams" ] && [ "$c1_fams" = "$g8_fams" ]; then
              resolvers_agree="true"
            else
              resolvers_agree="false"
            fi
          fi
          emit DNS_PUBLIC_RESOLVERS_AGREE "$resolvers_agree"

          echo "=== 2. External TCP Probes ==="
          tcp_probe() {
            local host="$1" port="$2"
            local line connect status
            line="$(curl --silent --show-error --connect-timeout 8 --max-time 8 -o /dev/null -w '%{http_code} %{time_connect}' "telnet://${host}:${port}" 2>/dev/null || true)"
            read -r status connect <<<"$line"
            if [ -n "$connect" ] && [ "$connect" != "-1" ] && awk -v c="$connect" 'BEGIN{exit (c > 0 ? 0 : 1)}'; then
              echo "true $connect"
            else
              echo "false -1"
            fi
          }

          read -r m_tcp443 m_tcp443_sec <<<"$(tcp_probe mhcsgo.cloud 443)"
          emit MHCS_TCP443_CONNECT "$m_tcp443"
          emit MHCS_TCP443_SECONDS "$m_tcp443_sec"

          read -r f_tcp443 f_tcp443_sec <<<"$(tcp_probe fams.mhcsgo.cloud 443)"
          emit FAMS_TCP443_CONNECT "$f_tcp443"
          emit FAMS_TCP443_SECONDS "$f_tcp443_sec"

          read -r m_tcp80 _ <<<"$(tcp_probe mhcsgo.cloud 80)"
          emit MHCS_TCP80_CONNECT "$m_tcp80"

          read -r f_tcp80 _ <<<"$(tcp_probe fams.mhcsgo.cloud 80)"
          emit FAMS_TCP80_CONNECT "$f_tcp80"

          echo "=== 3. External HTTPS Probes ==="
          https_probe() {
            local url="$1"
            local line status connect
            line="$(curl --silent --show-error --connect-timeout 5 --max-time 10 --max-redirs 0 -o /dev/null -w '%{http_code} %{time_connect}' "$url" 2>/dev/null || true)"
            read -r status connect <<<"$line"
            echo "${status:-000} ${connect:--1}"
          }

          read -r mhcs_root_status mhcs_root_sec <<<"$(https_probe https://mhcsgo.cloud/)"
          emit MHCS_ROOT_HTTP_STATUS "$mhcs_root_status"
          emit MHCS_ROOT_CONNECT_SECONDS "$mhcs_root_sec"

          read -r fams_up_status fams_up_sec <<<"$(https_probe https://fams.mhcsgo.cloud/up)"
          emit FAMS_UP_HTTP_STATUS "$fams_up_status"
          emit FAMS_UP_CONNECT_SECONDS "$fams_up_sec"

          read -r fams_login_status fams_login_sec <<<"$(https_probe https://fams.mhcsgo.cloud/operator/login)"
          emit FAMS_LOGIN_HTTP_STATUS "$fams_login_status"
          emit FAMS_LOGIN_CONNECT_SECONDS "$fams_login_sec"

          echo "=== 4. Direct-IP + SNI Differentiation ==="
          direct_probe() {
            local host="$1" path="$2" ip="$3"
            local code="000"
            if [ -n "$ip" ]; then
              code="$(curl --silent --show-error --connect-timeout 5 --max-time 10 --resolve "${host}:443:${ip}" -o /dev/null -w '%{http_code}' "https://${host}${path}" 2>/dev/null || true)"
            fi
            if [[ "$code" =~ ^[1-5][0-9][0-9]$ ]]; then
              echo "PASS"
            else
              echo "FAIL"
            fi
          }

          emit FAMS_DIRECT_IP_SNI_RESULT "$(direct_probe fams.mhcsgo.cloud /up "$fams_sys_ip")"
          emit MHCS_DIRECT_IP_SNI_RESULT "$(direct_probe mhcsgo.cloud / "$mhcs_sys_ip")"

          echo "=== 5. TLS Handshake ==="
          tls_handshake() {
            local host="$1" ip="$2"
            if ! command -v openssl >/dev/null 2>&1; then
              echo "NOT_TESTED"
              return 0
            fi
            if [ -z "$ip" ]; then
              echo "false"
              return 0
            fi
            if echo "" | timeout 5 openssl s_client -servername "$host" -connect "${ip}:443" 2>/dev/null | grep -q "CONNECTED"; then
              echo "true"
            else
              echo "false"
            fi
          }

          emit FAMS_TLS_HANDSHAKE "$(tls_handshake fams.mhcsgo.cloud "$fams_sys_ip")"
          emit MHCS_TLS_HANDSHAKE "$(tls_handshake mhcsgo.cloud "$mhcs_sys_ip")"

