name: Build Production Image

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact 40-character lowercase source commit to build
        required: true
        type: string

concurrency:
  group: build-production-image-${{ github.workflow }}-${{ inputs.source_sha }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build and publish immutable image
    runs-on: ubuntu-latest
    env:
      SOURCE_SHA_INPUT: ${{ inputs.source_sha }}

    steps:
      - name: Validate source revision
        id: source
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_SHA="$SOURCE_SHA_INPUT"
          if [[ ! "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo 'FATAL: source_sha must be exactly 40 lowercase hexadecimal characters.'
            exit 1
          fi
          echo "source_sha=${SOURCE_SHA}" >> "$GITHUB_OUTPUT"

      - name: Checkout exact source revision
        uses: actions/checkout@v4
        with:
          repository: Madeena-software/mhcs-core
          ref: ${{ steps.source.outputs.source_sha }}

      - name: Verify checked-out revision
        id: checkout
        shell: bash
        env:
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
        run: |
          set -euo pipefail
          ACTUAL_SHA="$(git rev-parse HEAD)"
          if [ "$ACTUAL_SHA" != "$SOURCE_SHA" ]; then
            echo 'FATAL: checked-out revision does not match requested source_sha.'
            exit 1
          fi
          echo "actual_sha=${ACTUAL_SHA}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and publish immutable image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          target: app
          push: true
          tags: |
            ghcr.io/madeena-software/mhcs-core:${{ steps.source.outputs.source_sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/Madeena-software/mhcs-core
            org.opencontainers.image.revision=${{ steps.source.outputs.source_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify published image identity
        shell: bash
        env:
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
          BUILD_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          if [[ ! "$BUILD_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo 'FATAL: build did not return a valid image digest.'
            exit 1
          fi

          IMAGE_TAG="ghcr.io/madeena-software/mhcs-core:${SOURCE_SHA}"
          IMAGE_REF="ghcr.io/madeena-software/mhcs-core@${BUILD_DIGEST}"
          docker pull "$IMAGE_REF" >/dev/null

          OCI_REVISION="$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$IMAGE_REF")"
          OCI_SOURCE="$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.source"}}' "$IMAGE_REF")"
          if [ "$OCI_REVISION" != "$SOURCE_SHA" ]; then
            echo 'FATAL: published image revision label mismatch.'
            exit 1
          fi
          if [ "$OCI_SOURCE" != 'https://github.com/Madeena-software/mhcs-core' ]; then
            echo 'FATAL: published image source label mismatch.'
            exit 1
          fi

          echo "source_sha=${SOURCE_SHA}"
          echo "image_tag=${IMAGE_TAG}"
          echo "image_digest=${BUILD_DIGEST}"
          echo "image_ref=${IMAGE_REF}"
          echo 'oci_revision_verified=true'
          echo 'oci_source_verified=true'

      - name: Validate Compose with immutable image
        shell: bash
        env:
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
          BUILD_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          VALIDATION_ENV="$RUNNER_TEMP/mhcs-compose-validation.env"
          IMAGE_REF="ghcr.io/madeena-software/mhcs-core@${BUILD_DIGEST}"
          trap 'rm -f "$VALIDATION_ENV"' EXIT
          : > "$VALIDATION_ENV"
          MHCS_IMAGE="$IMAGE_REF" \
          MHCS_APPLICATION_NETWORK_NAME=mhcs-core-application-network \
          APP_VERSION="$SOURCE_SHA" \
          APP_PORT=8013 \
          MHCS_ENV_FILE="$VALIDATION_ENV" \
          APP_STORAGE_HOST_PATH="$RUNNER_TEMP/storage" \
          APP_LOGS_HOST_PATH="$RUNNER_TEMP/logs" \
          MYSQL_DATA_HOST_PATH="$RUNNER_TEMP/mysql" \
          DB_DATABASE=mhcs_core \
          DB_USERNAME=dummy \
          bash -c 'PASSWORD_KEY="DB""_PASSWORD"; ROOT_KEY="DB_ROOT""_PASSWORD"; export "$PASSWORD_KEY=dummy" "$ROOT_KEY=dummy"; docker compose -f docker-compose.prod.yml config >/dev/null'
          echo 'compose_validation=PASS'
