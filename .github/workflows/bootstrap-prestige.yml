name: Production Prestige Bootstrap

on:
  workflow_dispatch:
    inputs:
      csv_b64:
        description: "Base64 encoded CSV data"
        required: true
        type: string
      operator_b64:
        description: "Base64 encoded operator data"
        required: true
        type: string

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  APP_SLUG: mhcs_core

jobs:
  bootstrap:
    name: Execute Prestige Clinic Seeder
    runs-on: self-hosted
    permissions:
      contents: read

    steps:
      - name: Locate Swarm Containers
        id: locate
        run: |
          set -euo pipefail

          APP_CONTAINER="$(docker ps -q --filter "label=com.docker.swarm.service.name=${APP_SLUG}_app" | head -n 1)"
          if [ -z "$APP_CONTAINER" ]; then
            APP_CONTAINER="$(docker ps -q --filter "name=${APP_SLUG}_app" | head -n 1)"
          fi

          DB_CONTAINER="$(docker ps -q --filter "label=com.docker.swarm.service.name=${APP_SLUG}_db" | head -n 1)"
          if [ -z "$DB_CONTAINER" ]; then
            DB_CONTAINER="$(docker ps -q --filter "name=${APP_SLUG}_db" | head -n 1)"
          fi

          if [ -z "$APP_CONTAINER" ] || [ -z "$DB_CONTAINER" ]; then
            echo "FATAL: Required Swarm containers (app or db) are not running."
            docker ps --format 'table {{.Names}}\t{{.Image}}\t{{.Status}}'
            exit 1
          fi

          echo "APP_CONTAINER=$APP_CONTAINER" >> "$GITHUB_ENV"
          echo "DB_CONTAINER=$DB_CONTAINER" >> "$GITHUB_ENV"
          echo "✅ Located app container ($APP_CONTAINER) and db container ($DB_CONTAINER)"

      - name: Phase 3 — Pre-Seed Database Backup
        env:
          DB_DATABASE: ${{ secrets.DB_DATABASE }}
          DB_ROOT_PASSWORD: ${{ secrets.DB_ROOT_PASSWORD }}
        run: |
          set -euo pipefail

          BACKUP_FILE="/tmp/pre-seed-prestige-$(date +%Y%m%d%H%M%S).sql"
          echo "===> Creating pre-seed database snapshot at ${BACKUP_FILE}..."

          docker exec "$DB_CONTAINER" \
            mysqldump -u root -p"${DB_ROOT_PASSWORD}" \
            --single-transaction --routines --triggers --events \
            "${DB_DATABASE}" > "$BACKUP_FILE"

          if [ ! -s "$BACKUP_FILE" ]; then
            echo "FATAL: Pre-seed database backup is missing or empty!"
            rm -f "$BACKUP_FILE"
            exit 1
          fi

          chmod 0600 "$BACKUP_FILE"
          FILE_SIZE="$(stat -c %s "$BACKUP_FILE" 2>/dev/null || stat -f %z "$BACKUP_FILE")"
          echo "✅ Pre-seed backup created successfully:"
          echo "   Path: $BACKUP_FILE"
          echo "   Size: $FILE_SIZE bytes"
          echo "   Timestamp: $(date -u +'%Y-%m-%d %H:%M:%S UTC')"

      - name: Phase 4 & 5 & 6 — Stage Files, Run PrestigeClinicSeeder, Remove Files
        env:
          CSV_B64: ${{ github.event.inputs.csv_b64 }}
          OPERATOR_B64: ${{ github.event.inputs.operator_b64 }}
        run: |
          set -euo pipefail

          echo "===> Phase 4: Securely staging Prestige source files in app container..."
          docker exec "$APP_CONTAINER" mkdir -p /var/www/html/research/prestige

          # Transfer and decode CSV without printing content
          printf '%s' "$CSV_B64" | base64 -d | docker exec -i "$APP_CONTAINER" sh -c 'cat > /var/www/html/research/prestige/data-karyawan-cv-prestige.csv && chmod 0600 /var/www/html/research/prestige/data-karyawan-cv-prestige.csv'

          # Transfer and decode operator file without printing content
          printf '%s' "$OPERATOR_B64" | base64 -d | docker exec -i "$APP_CONTAINER" sh -c 'cat > /var/www/html/research/prestige/operator.txt && chmod 0600 /var/www/html/research/prestige/operator.txt'

          # Verify metadata anonymously
          CSV_LINES="$(docker exec "$APP_CONTAINER" wc -l /var/www/html/research/prestige/data-karyawan-cv-prestige.csv | awk '{print $1}')"
          CSV_RECORDS=$((CSV_LINES > 1 ? CSV_LINES - 1 : 0))

          OP_COUNT="$(docker exec "$APP_CONTAINER" grep -c "@" /var/www/html/research/prestige/operator.txt || echo "0")"
          OP_HAS_PASS="$(docker exec "$APP_CONTAINER" grep -ic "^password:" /var/www/html/research/prestige/operator.txt || echo "0")"

          echo "Prestige CSV records: $CSV_RECORDS"
          echo "Prestige operator accounts: $OP_COUNT"
          if [ "$OP_HAS_PASS" -gt 0 ]; then
            echo "Operator password source: present"
          else
            echo "Operator password source: missing"
          fi

          if [ "$CSV_RECORDS" -ne 37 ] || [ "$OP_COUNT" -ne 5 ] || [ "$OP_HAS_PASS" -eq 0 ]; then
            echo "FATAL: Staged file metadata mismatch! Aborting seed."
            docker exec "$APP_CONTAINER" rm -rf /var/www/html/research/prestige
            exit 1
          fi

          echo "===> Phase 5: Executing Database\Seeders\PrestigeClinicSeeder..."
          SEED_EXIT=0
          docker exec \
            -e MHCS_ALLOW_PRODUCTION_MVP_SEED=true \
            "$APP_CONTAINER" \
            php artisan db:seed \
              --class='Database\Seeders\PrestigeClinicSeeder' \
              --force || SEED_EXIT=$?

          echo "Seeder exit status: $SEED_EXIT"

          echo "===> Phase 6: Immediately removing staged source files from app container..."
          docker exec "$APP_CONTAINER" rm -rf /var/www/html/research/prestige

          # Verify removal
          REMOVED="$(docker exec "$APP_CONTAINER" sh -c 'test -d /var/www/html/research/prestige && echo "EXISTS" || echo "REMOVED"')"
          echo "Staged research files status: $REMOVED"

          if [ "$SEED_EXIT" -ne 0 ]; then
            echo "FATAL: PrestigeClinicSeeder exited with code $SEED_EXIT"
            exit "$SEED_EXIT"
          fi

      - name: Phase 7 — Post-Seed Database Verification
        run: |
          set -euo pipefail

          echo "===> Phase 7: Post-seed database acceptance verification..."
          docker exec "$APP_CONTAINER" php -r '
            require "vendor/autoload.php";
            $app = require "bootstrap/app.php";
            $app->make(Illuminate\Contracts\Console\Kernel::class)->bootstrap();

            use Illuminate\Support\Facades\DB;

            $operatorsCount = DB::table("users")->where("email", "like", "operatorprestige%@madeena-xray.com")->count();
            $profilesCount = DB::table("operator_profiles")->where("employee_code", "like", "OPR-PRES-%")->count();
            $siteAssignments = DB::table("operator_site_assignments")->where("active", true)->count();

            $siteExists = DB::table("operator_sites")->where("operator_site_id", "site-prestige")->exists();
            $schedulesCount = DB::table("shift_schedules")->count();

            $membersCount = DB::table("members")->count();
            $bookingsCount = DB::table("bookings")->where("status", "confirmed")->count();
            $ledgerCount = DB::table("point_ledger_entries")->where("entry_type", "charge")->count();

            $adminUserExists = DB::table("users")->where("email", "mvp-admin@example.test")->exists();

            echo "=== DATABASE ACCEPTANCE RESULTS ===\n";
            echo "Prestige operators: $operatorsCount/5\n";
            echo "Prestige operator profiles: $profilesCount/5\n";
            echo "Prestige operator active site assignments: $siteAssignments\n";
            echo "Prestige site (site-prestige) exists: " . ($siteExists ? "YES" : "NO") . "\n";
            echo "Prestige shift schedules: $schedulesCount/3\n";
            echo "Prestige members: $membersCount/37\n";
            echo "Prestige confirmed bookings: $bookingsCount/37\n";
            echo "Prestige point ledger charges: $ledgerCount/37\n";
            echo "Bootstrap admin user preserved: " . ($adminUserExists ? "YES" : "NO") . "\n";

            if ($operatorsCount !== 5 || $membersCount !== 37 || !$siteExists || !$adminUserExists) {
              echo "FATAL: Invariant check failed!\n";
              exit(1);
            }
            echo "✅ ALL DATABASE ACCEPTANCE CHECKS PASSED!\n";
          '
