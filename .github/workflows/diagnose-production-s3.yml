name: Diagnose production S3 private objects

on:
  workflow_dispatch:

concurrency:
  group: production-deployment-mhcs_core
  cancel-in-progress: false

jobs:
  diagnose:
    name: Read-only production S3 endpoint diagnostic
    runs-on: self-hosted
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Diagnose the running production app S3 boundary
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_REVISION="b6232a158b3f6884fd9823bc875abc432676b781"
          APP_SERVICE="mhcs_core_app"
          APP_CONTAINER=""
          TASK_ID="$(docker service ps "$APP_SERVICE" --filter desired-state=running --no-trunc --format '{{.ID}}' 2>/dev/null | head -n 1 || true)"
          if [ -n "$TASK_ID" ]; then
            while IFS= read -r candidate; do
              [ -n "$candidate" ] || continue
              candidate_task="$(docker inspect "$candidate" --format '{{index .Config.Labels "com.docker.swarm.task.id"}}' 2>/dev/null || true)"
              if [ "$candidate_task" = "$TASK_ID" ] || [[ "$candidate_task" == "$TASK_ID"* ]] || [[ "$TASK_ID" == "$candidate_task"* ]]; then APP_CONTAINER="$candidate"; break; fi
            done < <(docker ps -q --filter "label=com.docker.swarm.service.name=${APP_SERVICE}" --filter status=running 2>/dev/null)
          fi
          SERVICE_IMAGE=""; CONTAINER_IMAGE=""; VERSION_CURRENT=""
          if [ -n "$APP_CONTAINER" ]; then
            SERVICE_IMAGE="$(docker service inspect "$APP_SERVICE" --format '{{.Spec.TaskTemplate.ContainerSpec.Image}}' 2>/dev/null || true)"
            CONTAINER_IMAGE="$(docker inspect "$APP_CONTAINER" --format '{{.Config.Image}}' 2>/dev/null || true)"
            VERSION_CURRENT="$(docker exec "$APP_CONTAINER" cat /var/www/html/VERSION-CURRENT 2>/dev/null || true)"
          fi
          image_revision() { local image="$1"; local revision="${image##*:}"; revision="${revision%%@*}"; if [[ "$revision" =~ ^[0-9a-f]{40}$ ]]; then printf '%s' "$revision"; fi; }
          SERVICE_REVISION="$(image_revision "$SERVICE_IMAGE")"
          CONTAINER_REVISION="$(image_revision "$CONTAINER_IMAGE")"
          revision_match=false
          if [ -n "$APP_CONTAINER" ] && [[ "$VERSION_CURRENT" =~ ^[0-9a-f]{40}$ ]] && [ "$VERSION_CURRENT" = "$EXPECTED_REVISION" ] && [ -n "$SERVICE_REVISION" ] && [ "$SERVICE_REVISION" = "$EXPECTED_REVISION" ] && [ -n "$CONTAINER_REVISION" ] && [ "$CONTAINER_REVISION" = "$EXPECTED_REVISION" ]; then revision_match=true; fi
          if [ "$revision_match" != "true" ]; then echo "revision_match=false"; exit 1; fi
          echo "revision_match=true"
          host_port_9000_listener_present=false
          host_port_9000_bind_class=unknown
          host_loopback_minio_health_http_status=none
          host_loopback_minio_health=FAIL
          host_port_9000_owner_class=unknown
          docker_port_9000_published=false
          host_listener_inspection=FAIL
          host_local_minio_confirmed=false
          container_host_gateway_failure_explained=false
          host_listener_root_boundary=minio_runtime_topology
          host_listener_root_class=unknown
          host_listener_root_confirmed=false
          host_port_9000_has_loopback_ipv4=false
          host_port_9000_has_loopback_ipv6=false
          host_port_9000_has_all_ipv4=false
          host_port_9000_has_all_ipv6=false
          host_port_9000_has_nonloopback_specific=false
          host_port_9000_loopback_only=false
          host_port_9000_has_nonloopback_bind=false
          host_gateway_port_9000_tcp=none
          host_gateway_port_9000_tcp_checked=false
          host_gateway_address_resolved=false
          host_gateway_address_family=none
          minio_listener_matches_host_gateway=unknown
          minio_listener_host_gateway_match_basis=unknown
          host_to_host_gateway_9000_tcp_checked=false
          host_to_host_gateway_9000_tcp=none
          host_gateway_minio_health_checked=false
          host_gateway_minio_health_http_status=none
          host_gateway_minio_health=none
          container_host_gateway_route_checked=false
          container_host_gateway_route=unavailable
          packet_path_container_tcp_probe_triggered=false
          packet_path_container_tcp_probe_result=none
          packet_path_observation_available=false
          packet_path_observation_tool=unavailable
          packet_path_observation_started_before_probe=false
          container_syn_reaches_host=unknown
          host_synack_observed=unknown
          host_rst_observed=unknown
          container_ack_after_synack_observed=unknown
          packet_observation_completed=false
          packet_observer_covered_probe=false
          packet_classifier_completed=false
          packet_classification_valid=false
          packet_observer_start_class=unknown
          packet_observer_exited_before_ready=false
          host_tcp9000_drop_reject_candidate=unknown
          host_tcp9000_accept_candidate=unknown
          host_firewall_inspection=SKIPPED
          docker_gateway_9000_explicit_reject_detected=unknown
          docker_gateway_9000_explicit_accept_detected=unknown
          host_gateway_connectivity_root_boundary=docker_host_gateway_connectivity
          host_gateway_connectivity_root_class=unknown
          host_gateway_connectivity_root_confirmed=false
          host_gateway_address=""
          listener_match_ambiguous=false
          listener_addresses=()
          listener_process_lines=()

          gateway_resolution="$(docker exec "$APP_CONTAINER" getent ahosts host.docker.internal 2>/dev/null || true)"
          host_gateway_address="$(printf '%s\n' "$gateway_resolution" | awk 'NF && $1 !~ /:/ {print $1; exit}')"
          if [ -n "$host_gateway_address" ]; then
            host_gateway_address_resolved=true
            host_gateway_address_family=ipv4
          else
            host_gateway_address="$(printf '%s\n' "$gateway_resolution" | awk 'NF && $1 ~ /:/ {print $1; exit}')"
            if [ -n "$host_gateway_address" ]; then
              host_gateway_address_resolved=true
              host_gateway_address_family=ipv6
            fi
          fi

          if command -v ss >/dev/null 2>&1; then
            if listener_table="$(ss -ltnH 2>/dev/null)"; then
              host_listener_inspection=PASS
              mapfile -t listener_addresses < <(printf '%s\n' "$listener_table" | awk '$4 ~ /:9000$/ {print $4}')
              if [ "${#listener_addresses[@]}" -gt 0 ]; then
                host_port_9000_listener_present=true
                bind_classes=()
                for listener_address in "${listener_addresses[@]}"; do
                  case "$listener_address" in
                    127.*:*) bind_classes+=(loopback_ipv4); host_port_9000_has_loopback_ipv4=true ;;
                    '[::1]:'*|::1:*) bind_classes+=(loopback_ipv6); host_port_9000_has_loopback_ipv6=true ;;
                    0.0.0.0:*|'*:') bind_classes+=(all_ipv4); host_port_9000_has_all_ipv4=true ;;
                    '[::]:'*|::*:*) bind_classes+=(all_ipv6); host_port_9000_has_all_ipv6=true ;;
                    '*:9000') bind_classes+=(ambiguous_listener) ;;
                    *) bind_classes+=(nonloopback_specific); host_port_9000_has_nonloopback_specific=true ;;
                  esac
                done
                if [ "$host_port_9000_has_loopback_ipv4" = true ] || [ "$host_port_9000_has_loopback_ipv6" = true ]; then
                  if [ "$host_port_9000_has_all_ipv4" = false ] && [ "$host_port_9000_has_all_ipv6" = false ] && [ "$host_port_9000_has_nonloopback_specific" = false ]; then
                    host_port_9000_loopback_only=true
                  fi
                fi
                if [ "$host_port_9000_has_all_ipv4" = true ] || [ "$host_port_9000_has_all_ipv6" = true ] || [ "$host_port_9000_has_nonloopback_specific" = true ]; then
                  host_port_9000_has_nonloopback_bind=true
                fi
                unique_bind_classes="$(printf '%s\n' "${bind_classes[@]}" | sort -u | tr '\n' ' ' | xargs)"
                bind_class_count="$(printf '%s\n' "$unique_bind_classes" | awk '{print NF}')"
                if [ "${#listener_addresses[@]}" -gt 1 ] || [ "$bind_class_count" -gt 1 ]; then
                  host_port_9000_bind_class=multiple
                else
                  host_port_9000_bind_class="$unique_bind_classes"
                fi

                if [ "$host_gateway_address_resolved" = true ]; then
                  normalize_listener_address() {
                    local address="$1"
                    if [[ "$address" == \[*\]:* ]]; then
                      printf '%s' "${address#\[}" | sed 's/\]:[0-9][0-9]*$//'
                    elif [[ "$address" == *:* ]]; then
                      printf '%s' "${address%:[0-9][0-9]*}"
                    else
                      printf '%s' "$address"
                    fi
                  }
                  for listener_address in "${listener_addresses[@]}"; do
                    normalized_listener="$(normalize_listener_address "$listener_address")"
                    if [ "$normalized_listener" = '*' ]; then
                      listener_match_ambiguous=true
                    elif [ "$normalized_listener" = "$host_gateway_address" ]; then
                      minio_listener_matches_host_gateway=true
                      minio_listener_host_gateway_match_basis=exact_specific
                    elif { [ "$host_gateway_address_family" = ipv4 ] && [ "$normalized_listener" = 0.0.0.0 ]; } || { [ "$host_gateway_address_family" = ipv6 ] && [ "$normalized_listener" = :: ]; }; then
                      minio_listener_matches_host_gateway=true
                      minio_listener_host_gateway_match_basis=wildcard
                    fi
                  done
                  if [ "$listener_match_ambiguous" = true ]; then
                    minio_listener_matches_host_gateway=unknown
                    minio_listener_host_gateway_match_basis=unknown
                  elif [ "$minio_listener_matches_host_gateway" = unknown ]; then
                    minio_listener_matches_host_gateway=false
                    minio_listener_host_gateway_match_basis=none
                  fi
                fi

                if docker ps --filter publish=9000 --format '{{.Ports}}' 2>/dev/null | grep -q .; then
                  docker_port_9000_published=true
                  host_port_9000_owner_class=docker_published
                elif process_table="$(ss -ltnpH 2>/dev/null)"; then
                  mapfile -t listener_process_lines < <(printf '%s\n' "$process_table" | awk '$4 ~ /:9000$/')
                  if [ "${#listener_process_lines[@]}" -gt 0 ] && printf '%s\n' "${listener_process_lines[@]}" | grep -Fq 'users:('; then
                    if printf '%s\n' "${listener_process_lines[@]}" | grep -Eiq 'minio'; then
                      host_port_9000_owner_class=minio_host_process
                    else
                      host_port_9000_owner_class=other
                    fi
                  fi
                fi

                if command -v curl >/dev/null 2>&1; then
                  host_loopback_minio_health_http_status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --connect-timeout 3 --max-time 3 --max-redirs 0 --request GET http://127.0.0.1:9000/minio/health/live 2>/dev/null || true)"
                  if [ "$host_loopback_minio_health_http_status" = 200 ]; then host_loopback_minio_health=PASS; fi
                fi
              else
                host_port_9000_bind_class=none
              fi
            fi
          fi

          if [ "$host_gateway_address_resolved" = true ]; then
            host_to_host_gateway_9000_tcp_checked=true
            if timeout 3 bash -c 'exec 3<>/dev/tcp/"$1"/9000' bash "$host_gateway_address" 2>/dev/null; then
              host_to_host_gateway_9000_tcp=PASS
            else
              host_to_host_gateway_9000_tcp=FAIL
            fi

            if command -v curl >/dev/null 2>&1; then
              host_gateway_minio_health_checked=true
              gateway_health_host="$host_gateway_address"
              if [ "$host_gateway_address_family" = ipv6 ]; then gateway_health_host="[$host_gateway_address]"; fi
              gateway_health_status="$(curl --silent --output /dev/null --write-out '%{http_code}' --connect-timeout 3 --max-time 3 --max-redirs 0 --request GET "http://${gateway_health_host}:9000/minio/health/live" 2>/dev/null || true)"
              case "$gateway_health_status" in
                200) host_gateway_minio_health_http_status=200; host_gateway_minio_health=PASS ;;
                2[0-9][0-9]) host_gateway_minio_health_http_status=other_2xx; host_gateway_minio_health=FAIL ;;
                3[0-9][0-9]) host_gateway_minio_health_http_status=3xx; host_gateway_minio_health=FAIL ;;
                4[0-9][0-9]) host_gateway_minio_health_http_status=4xx; host_gateway_minio_health=FAIL ;;
                5[0-9][0-9]) host_gateway_minio_health_http_status=5xx; host_gateway_minio_health=FAIL ;;
                *) host_gateway_minio_health_http_status=none; host_gateway_minio_health=FAIL ;;
              esac
            fi

            container_route_output="$(docker exec "$APP_CONTAINER" sh -c 'if ! command -v ip >/dev/null 2>&1; then printf "%s" __IP_UNAVAILABLE__; else route_output="$(ip route get "$1" 2>/dev/null || true)"; if [ -n "$route_output" ]; then printf "%s" "$route_output"; else printf "%s" __IP_LOOKUP_FAILED__; fi; fi' sh "$host_gateway_address" 2>/dev/null || true)"
            if [ "$container_route_output" = __IP_UNAVAILABLE__ ]; then
              container_host_gateway_route_checked=false
              container_host_gateway_route=unavailable
            else
              container_host_gateway_route_checked=true
              case "$container_route_output" in
                *unreachable*|*prohibit*|*blackhole*) container_host_gateway_route=unreachable ;;
                *__IP_LOOKUP_FAILED__*) container_host_gateway_route=unknown ;;
                *" via "*" dev "*) container_host_gateway_route=reachable_via_gateway ;;
                *" dev "*) container_host_gateway_route=reachable_direct ;;
                *) container_host_gateway_route=unknown ;;
              esac
            fi
          fi

          packet_temp_dir=""
          packet_fifo=""
          packet_classification_file=""
          packet_status_file=""
          tcpdump_pid=""
          packet_classifier_pid=""
          packet_observer_ready=false
          packet_observer_alive_before_probe=false
          packet_observer_alive_after_probe=false
          classify_packet_observer_status() {
            local status_file="$1"
            if grep -Eiq 'permission denied|operation not permitted|insufficient privileges|permission.*(capture|interface|device)|cap_(net_raw|net_admin)' "$status_file" 2>/dev/null; then
              printf '%s' permission_denied
            elif grep -Eiq 'no such device|device .*not found|interface .*does not exist|cannot open .*((capture )?interface|device)' "$status_file" 2>/dev/null; then
              printf '%s' interface_unavailable
            elif grep -Eiq 'syntax error|cannot (parse|compile)|can.t (parse|compile)|invalid filter|filter expression' "$status_file" 2>/dev/null; then
              printf '%s' filter_error
            else
              printf '%s' early_exit
            fi
          }
          if [ "$host_gateway_address_resolved" = true ] && command -v tcpdump >/dev/null 2>&1 && tcpdump -D >/dev/null 2>&1; then
            packet_path_observation_tool=tcpdump
            packet_temp_dir="$(mktemp -d)"
            packet_fifo="$packet_temp_dir/stream"
            packet_classification_file="$packet_temp_dir/classification"
            packet_status_file="$packet_temp_dir/status"
            mkfifo "$packet_fifo"
            (timeout 15 tcpdump -i any -nn -l -s 96 "tcp port 9000 and host $host_gateway_address" >"$packet_fifo" 2>"$packet_status_file") &
            tcpdump_pid=$!
            (awk '
              BEGIN { syn=0; synack=0; rst=0; ack=0 }
              {
                arrow = index($0, " > ")
                to_port = arrow > 0 && index($0, ".9000:") > arrow
                from_port = index($0, ".9000 >") > 0 || index($0, ":9000 >") > 0
                if (to_port && index($0, "Flags [S]") > 0) syn=1
                if (syn && from_port && index($0, "Flags [S.]") > 0) synack=1
                if (syn && from_port && index($0, "Flags [R") > 0) rst=1
                if (syn && synack && to_port && (index($0, "Flags [.]" ) > 0 || index($0, "Flags [P.]" ) > 0 || index($0, "Flags [F.]" ) > 0)) ack=1
              }
              END { printf "syn=%s\nsynack=%s\nrst=%s\nack=%s\n", syn, synack, rst, ack }
            ' <"$packet_fifo" >"$packet_classification_file") &
            packet_classifier_pid=$!
            readiness_attempt=0
            while [ "$readiness_attempt" -lt 25 ]; do
              if grep -Fq 'listening on' "$packet_status_file" 2>/dev/null && kill -0 "$tcpdump_pid" 2>/dev/null; then
                packet_observer_ready=true
                break
              fi
              if ! kill -0 "$tcpdump_pid" 2>/dev/null; then break; fi
              readiness_attempt=$((readiness_attempt + 1))
              sleep 0.2
            done
            if [ "$packet_observer_ready" = true ]; then
              packet_observer_start_class=ready
              packet_path_observation_available=true
              packet_path_observation_started_before_probe=true
            elif ! kill -0 "$tcpdump_pid" 2>/dev/null; then
              packet_observer_exited_before_ready=true
              packet_observer_start_class="$(classify_packet_observer_status "$packet_status_file")"
            else
              packet_observer_start_class=readiness_timeout
            fi
          fi

          packet_probe_output=""
          if [ "$packet_path_observation_started_before_probe" = true ] && kill -0 "$tcpdump_pid" 2>/dev/null; then
            packet_observer_alive_before_probe=true
          fi
          if packet_probe_output="$(docker exec "$APP_CONTAINER" php -r '$socket=@fsockopen("host.docker.internal",9000,$errno,$errorMessage,3); if (is_resource($socket)) { fclose($socket); echo "PASS"; } else { echo "FAIL"; }' 2>/dev/null)"; then
            packet_path_container_tcp_probe_triggered=true
            case "$packet_probe_output" in
              PASS) packet_path_container_tcp_probe_result=PASS ;;
              FAIL) packet_path_container_tcp_probe_result=FAIL ;;
              *) packet_path_container_tcp_probe_result=none ;;
            esac
          fi
          if [ "$packet_path_container_tcp_probe_triggered" = true ] && [ "$packet_observer_alive_before_probe" = true ] && kill -0 "$tcpdump_pid" 2>/dev/null; then
            packet_observer_alive_after_probe=true
          fi

          if [ -n "$tcpdump_pid" ]; then
            sleep 1
            kill "$tcpdump_pid" 2>/dev/null || true
            wait "$tcpdump_pid" 2>/dev/null || true
            packet_observation_completed=true
          fi
          if [ -n "$packet_classifier_pid" ]; then
            if wait "$packet_classifier_pid" 2>/dev/null; then
              packet_classifier_completed=true
            fi
          fi
          if [ "$packet_observer_alive_before_probe" = true ] && [ "$packet_observer_alive_after_probe" = true ] && [ "$packet_observation_completed" = true ] && [ "$packet_classifier_completed" = true ]; then
            packet_observer_covered_probe=true
          fi
          if [ "$packet_classifier_completed" = true ] && [ -r "$packet_classification_file" ]; then
            classification_validity="$(awk -F= '
              BEGIN { valid=1; line_count=0 }
              {
                line_count++
                if (NF != 2 || $1 !~ /^(syn|synack|rst|ack)$/ || $2 !~ /^[01]$/) valid=0
                else if (++seen[$1] > 1) valid=0
              }
              END {
                if (line_count != 4) valid=0
                if (seen["syn"] != 1 || seen["synack"] != 1 || seen["rst"] != 1 || seen["ack"] != 1) valid=0
                print valid
              }
            ' "$packet_classification_file" 2>/dev/null || true)"
            if [ "$classification_validity" = 1 ]; then packet_classification_valid=true; fi
          fi
          if [ "$packet_path_observation_available" = true ] && [ "$packet_observation_completed" = true ] && [ "$packet_classifier_completed" = true ] && [ "$packet_classification_valid" = true ] && [ "$packet_path_container_tcp_probe_triggered" = true ]; then
            packet_syn="$(awk -F= '$1 == "syn" {print $2; exit}' "$packet_classification_file" 2>/dev/null || true)"
            packet_synack="$(awk -F= '$1 == "synack" {print $2; exit}' "$packet_classification_file" 2>/dev/null || true)"
            packet_rst="$(awk -F= '$1 == "rst" {print $2; exit}' "$packet_classification_file" 2>/dev/null || true)"
            packet_ack="$(awk -F= '$1 == "ack" {print $2; exit}' "$packet_classification_file" 2>/dev/null || true)"
            if [ "$packet_syn" = 1 ]; then
              container_syn_reaches_host=true
              host_synack_observed=false
              host_rst_observed=false
              container_ack_after_synack_observed=false
              [ "$packet_synack" = 1 ] && host_synack_observed=true
              [ "$packet_rst" = 1 ] && host_rst_observed=true
              [ "$packet_ack" = 1 ] && container_ack_after_synack_observed=true
            elif [ "$packet_syn" = 0 ]; then
              container_syn_reaches_host=false
            fi
          fi
          if [ -n "$packet_temp_dir" ]; then
            rm -f "$packet_fifo" "$packet_classification_file" "$packet_status_file"
            rmdir "$packet_temp_dir" 2>/dev/null || true
          fi

          if [ "$host_listener_inspection" != PASS ]; then
            host_port_9000_bind_class=unknown
            host_local_minio_confirmed=false
            container_host_gateway_failure_explained=false
            host_listener_root_boundary=minio_runtime_topology
            host_listener_root_class=host_listener_inspection_unavailable
          elif [ "$host_port_9000_listener_present" = false ]; then
            host_local_minio_confirmed=false
            container_host_gateway_failure_explained=false
            host_listener_root_boundary=minio_runtime_topology
            host_listener_root_class=no_host_port_9000_listener
            host_listener_root_confirmed=true
          elif [ "$host_loopback_minio_health" != PASS ]; then
            host_local_minio_confirmed=false
            container_host_gateway_failure_explained=false
            host_listener_root_boundary=minio_runtime_topology
            host_listener_root_class=port_9000_not_confirmed_as_minio
          elif [ "$host_loopback_minio_health" = PASS ]; then
            host_local_minio_confirmed=true
          fi

          diagnostic_exit=0
          diagnostic_output=""
          if diagnostic_output="$(docker exec -i "$APP_CONTAINER" php 2>/dev/null <<'PHP'
          <?php
          declare(strict_types=1);
          use Aws\Exception\AwsException;
          use Illuminate\Contracts\Console\Kernel;
          use Illuminate\Filesystem\AwsS3V3Adapter;
          use Illuminate\Support\Facades\Storage;

          /** @return array{family:string,code:string,status:string} */
          function safeErrorDetails(Throwable $error): array
          {
              while ($error->getPrevious() !== null && ! $error instanceof AwsException) $error = $error->getPrevious();
              $code = $error instanceof AwsException ? (string) $error->getAwsErrorCode() : '';
              $allowed = ['AccessDenied','InvalidAccessKeyId','SignatureDoesNotMatch','NoSuchBucket','NoSuchKey','RequestTimeout','RequestTimeTooSkewed','NetworkingError','EndpointConnectionError','NotImplemented','MethodNotAllowed','PermanentRedirect'];
              $code = in_array($code, $allowed, true) ? $code : 'unknown';
              $family = match ($code) {
                  'AccessDenied','InvalidAccessKeyId','SignatureDoesNotMatch' => 'authorization',
                  'NetworkingError','EndpointConnectionError','RequestTimeout' => 'transport',
                  'NoSuchBucket','NoSuchKey' => 'not_found',
                  'NotImplemented','MethodNotAllowed' => 'unsupported',
                  default => 'unknown',
              };
              $status = $error instanceof AwsException && is_int($error->getStatusCode()) ? (string) $error->getStatusCode() : 'none';
              return ['family'=>$family,'code'=>$code,'status'=>$status];
          }

          /** @return array{host_class:string,port_is_9000:bool} */
          function classifyEndpoint(?string $endpoint): array
          {
              if (! is_string($endpoint) || trim($endpoint) === '') return ['host_class'=>'other','port_is_9000'=>false];
              $parsed = parse_url(trim($endpoint));
              if (! is_array($parsed) || ! isset($parsed['host'])) $parsed = parse_url('//'.trim($endpoint));
              $host = is_array($parsed) ? strtolower(trim((string) ($parsed['host'] ?? ''), '[]')) : '';
              $hostClass = match (true) {
                  $host === 'localhost' => 'localhost',
                  $host === '::1' || (filter_var($host, FILTER_VALIDATE_IP, FILTER_FLAG_IPV4) !== false && str_starts_with($host, '127.')) => 'loopback_ip',
                  $host === 'host.docker.internal' => 'host_docker_internal',
                  $host !== '' && ! str_contains($host, '.') && preg_match('/\A[a-z0-9][a-z0-9_-]*\z/i', $host) === 1 => 'docker_service_name',
                  default => 'other',
              };
              return ['host_class'=>$hostClass,'port_is_9000'=>is_array($parsed) && ($parsed['port'] ?? null) === 9000];
          }

          /** @return array{status:string,result:string} */
          function minioHealth(): array
          {
              $context = stream_context_create(['http'=>['method'=>'GET','timeout'=>3,'follow_location'=>0,'ignore_errors'=>true]]);
              $stream = @fopen('http://host.docker.internal:9000/minio/health/live','rb',false,$context);
