name: Diagnose production S3 private objects

on:
  workflow_dispatch:

concurrency:
  group: production-deployment-mhcs_core
  cancel-in-progress: false

jobs:
  diagnose:
    name: Read-only production S3 endpoint diagnostic
    runs-on: self-hosted
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Diagnose the running production app S3 boundary
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_REVISION="b6232a158b3f6884fd9823bc875abc432676b781"
          APP_SERVICE="mhcs_core_app"
          APP_CONTAINER=""
          TASK_ID="$(docker service ps "$APP_SERVICE" --filter desired-state=running --no-trunc --format '{{.ID}}' 2>/dev/null | head -n 1 || true)"
          if [ -n "$TASK_ID" ]; then
            while IFS= read -r candidate; do
              [ -n "$candidate" ] || continue
              candidate_task="$(docker inspect "$candidate" --format '{{index .Config.Labels "com.docker.swarm.task.id"}}' 2>/dev/null || true)"
              if [ "$candidate_task" = "$TASK_ID" ] || [[ "$candidate_task" == "$TASK_ID"* ]] || [[ "$TASK_ID" == "$candidate_task"* ]]; then APP_CONTAINER="$candidate"; break; fi
            done < <(docker ps -q --filter "label=com.docker.swarm.service.name=${APP_SERVICE}" --filter status=running 2>/dev/null)
          fi
          SERVICE_IMAGE=""; CONTAINER_IMAGE=""; VERSION_CURRENT=""
          if [ -n "$APP_CONTAINER" ]; then
            SERVICE_IMAGE="$(docker service inspect "$APP_SERVICE" --format '{{.Spec.TaskTemplate.ContainerSpec.Image}}' 2>/dev/null || true)"
            CONTAINER_IMAGE="$(docker inspect "$APP_CONTAINER" --format '{{.Config.Image}}' 2>/dev/null || true)"
            VERSION_CURRENT="$(docker exec "$APP_CONTAINER" cat /var/www/html/VERSION-CURRENT 2>/dev/null || true)"
          fi
          image_revision() { local image="$1"; local revision="${image##*:}"; revision="${revision%%@*}"; if [[ "$revision" =~ ^[0-9a-f]{40}$ ]]; then printf '%s' "$revision"; fi; }
          SERVICE_REVISION="$(image_revision "$SERVICE_IMAGE")"
          CONTAINER_REVISION="$(image_revision "$CONTAINER_IMAGE")"
          revision_match=false
          if [ -n "$APP_CONTAINER" ] && [[ "$VERSION_CURRENT" =~ ^[0-9a-f]{40}$ ]] && [ "$VERSION_CURRENT" = "$EXPECTED_REVISION" ] && [ -n "$SERVICE_REVISION" ] && [ "$SERVICE_REVISION" = "$EXPECTED_REVISION" ] && [ -n "$CONTAINER_REVISION" ] && [ "$CONTAINER_REVISION" = "$EXPECTED_REVISION" ]; then revision_match=true; fi
          if [ "$revision_match" != "true" ]; then echo "revision_match=false"; exit 1; fi
          echo "revision_match=true"
          host_port_9000_listener_present=false
          host_port_9000_bind_class=unknown
          host_loopback_minio_health_http_status=none
          host_loopback_minio_health=FAIL
          host_port_9000_owner_class=unknown
          docker_port_9000_published=false
          host_listener_inspection=FAIL
          host_local_minio_confirmed=false
          container_host_gateway_failure_explained=false
          host_listener_root_boundary=minio_runtime_topology
          host_listener_root_class=unknown
          host_listener_root_confirmed=false
          host_port_9000_has_loopback_ipv4=false
          host_port_9000_has_loopback_ipv6=false
          host_port_9000_has_all_ipv4=false
          host_port_9000_has_all_ipv6=false
          host_port_9000_has_nonloopback_specific=false
          host_port_9000_loopback_only=false
          host_port_9000_has_nonloopback_bind=false
          host_gateway_port_9000_tcp=FAIL
          listener_addresses=()
          listener_process_lines=()

          if command -v ss >/dev/null 2>&1; then
            if listener_table="$(ss -ltnH 2>/dev/null)"; then
              host_listener_inspection=PASS
              mapfile -t listener_addresses < <(printf '%s\n' "$listener_table" | awk '$4 ~ /:9000$/ {print $4}')
              if [ "${#listener_addresses[@]}" -gt 0 ]; then
                host_port_9000_listener_present=true
                bind_classes=()
                for listener_address in "${listener_addresses[@]}"; do
                  case "$listener_address" in
                    127.*:*) bind_classes+=(loopback_ipv4); host_port_9000_has_loopback_ipv4=true ;;
                    '[::1]:'*|::1:*) bind_classes+=(loopback_ipv6); host_port_9000_has_loopback_ipv6=true ;;
                    0.0.0.0:*|'*:') bind_classes+=(all_ipv4); host_port_9000_has_all_ipv4=true ;;
                    '[::]:'*|::*:*) bind_classes+=(all_ipv6); host_port_9000_has_all_ipv6=true ;;
                    *) bind_classes+=(nonloopback_specific); host_port_9000_has_nonloopback_specific=true ;;
                  esac
                done
                if [ "$host_port_9000_has_loopback_ipv4" = true ] || [ "$host_port_9000_has_loopback_ipv6" = true ]; then
                  if [ "$host_port_9000_has_all_ipv4" = false ] && [ "$host_port_9000_has_all_ipv6" = false ] && [ "$host_port_9000_has_nonloopback_specific" = false ]; then
                    host_port_9000_loopback_only=true
                  fi
                fi
                if [ "$host_port_9000_has_all_ipv4" = true ] || [ "$host_port_9000_has_all_ipv6" = true ] || [ "$host_port_9000_has_nonloopback_specific" = true ]; then
                  host_port_9000_has_nonloopback_bind=true
                fi
                unique_bind_classes="$(printf '%s\n' "${bind_classes[@]}" | sort -u | tr '\n' ' ' | xargs)"
                bind_class_count="$(printf '%s\n' "$unique_bind_classes" | awk '{print NF}')"
                if [ "${#listener_addresses[@]}" -gt 1 ] || [ "$bind_class_count" -gt 1 ]; then
                  host_port_9000_bind_class=multiple
                else
                  host_port_9000_bind_class="$unique_bind_classes"
                fi

                if docker ps --filter publish=9000 --format '{{.Ports}}' 2>/dev/null | grep -q .; then
                  docker_port_9000_published=true
                  host_port_9000_owner_class=docker_published
                elif process_table="$(ss -ltnpH 2>/dev/null)"; then
                  mapfile -t listener_process_lines < <(printf '%s\n' "$process_table" | awk '$4 ~ /:9000$/')
                  if [ "${#listener_process_lines[@]}" -gt 0 ] && printf '%s\n' "${listener_process_lines[@]}" | grep -Fq 'users:('; then
                    if printf '%s\n' "${listener_process_lines[@]}" | grep -Eiq 'minio'; then
                      host_port_9000_owner_class=minio_host_process
                    else
                      host_port_9000_owner_class=other
                    fi
                  fi
                fi

                if command -v curl >/dev/null 2>&1; then
                  host_loopback_minio_health_http_status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --connect-timeout 3 --max-time 3 --max-redirs 0 --request GET http://127.0.0.1:9000/minio/health/live 2>/dev/null || true)"
                  if [ "$host_loopback_minio_health_http_status" = 200 ]; then host_loopback_minio_health=PASS; fi
                fi
              else
                host_port_9000_bind_class=none
              fi
            fi
          fi

          if [ "$host_listener_inspection" != PASS ]; then
            host_port_9000_bind_class=unknown
            host_local_minio_confirmed=false
            container_host_gateway_failure_explained=false
            host_listener_root_boundary=minio_runtime_topology
            host_listener_root_class=host_listener_inspection_unavailable
          elif [ "$host_port_9000_listener_present" = false ]; then
            host_local_minio_confirmed=false
            container_host_gateway_failure_explained=false
            host_listener_root_boundary=minio_runtime_topology
            host_listener_root_class=no_host_port_9000_listener
            host_listener_root_confirmed=true
          elif [ "$host_loopback_minio_health" != PASS ]; then
            host_local_minio_confirmed=false
            container_host_gateway_failure_explained=false
            host_listener_root_boundary=minio_runtime_topology
            host_listener_root_class=port_9000_not_confirmed_as_minio
          elif [ "$host_loopback_minio_health" = PASS ]; then
            host_local_minio_confirmed=true
          fi

          diagnostic_exit=0
          diagnostic_output=""
          if diagnostic_output="$(docker exec -i "$APP_CONTAINER" php 2>/dev/null <<'PHP'
          <?php
          declare(strict_types=1);
          use Aws\Exception\AwsException;
          use Illuminate\Contracts\Console\Kernel;
          use Illuminate\Filesystem\AwsS3V3Adapter;
          use Illuminate\Support\Facades\Storage;

          /** @return array{family:string,code:string,status:string} */
          function safeErrorDetails(Throwable $error): array
          {
              while ($error->getPrevious() !== null && ! $error instanceof AwsException) $error = $error->getPrevious();
              $code = $error instanceof AwsException ? (string) $error->getAwsErrorCode() : '';
              $allowed = ['AccessDenied','InvalidAccessKeyId','SignatureDoesNotMatch','NoSuchBucket','NoSuchKey','RequestTimeout','RequestTimeTooSkewed','NetworkingError','EndpointConnectionError','NotImplemented','MethodNotAllowed','PermanentRedirect'];
              $code = in_array($code, $allowed, true) ? $code : 'unknown';
              $family = match ($code) {
                  'AccessDenied','InvalidAccessKeyId','SignatureDoesNotMatch' => 'authorization',
                  'NetworkingError','EndpointConnectionError','RequestTimeout' => 'transport',
                  'NoSuchBucket','NoSuchKey' => 'not_found',
                  'NotImplemented','MethodNotAllowed' => 'unsupported',
                  default => 'unknown',
              };
              $status = $error instanceof AwsException && is_int($error->getStatusCode()) ? (string) $error->getStatusCode() : 'none';
              return ['family'=>$family,'code'=>$code,'status'=>$status];
          }

          /** @return array{host_class:string,port_is_9000:bool} */
          function classifyEndpoint(?string $endpoint): array
          {
              if (! is_string($endpoint) || trim($endpoint) === '') return ['host_class'=>'other','port_is_9000'=>false];
              $parsed = parse_url(trim($endpoint));
              if (! is_array($parsed) || ! isset($parsed['host'])) $parsed = parse_url('//'.trim($endpoint));
              $host = is_array($parsed) ? strtolower(trim((string) ($parsed['host'] ?? ''), '[]')) : '';
              $hostClass = match (true) {
                  $host === 'localhost' => 'localhost',
                  $host === '::1' || (filter_var($host, FILTER_VALIDATE_IP, FILTER_FLAG_IPV4) !== false && str_starts_with($host, '127.')) => 'loopback_ip',
                  $host === 'host.docker.internal' => 'host_docker_internal',
                  $host !== '' && ! str_contains($host, '.') && preg_match('/\A[a-z0-9][a-z0-9_-]*\z/i', $host) === 1 => 'docker_service_name',
                  default => 'other',
              };
              return ['host_class'=>$hostClass,'port_is_9000'=>is_array($parsed) && ($parsed['port'] ?? null) === 9000];
          }

          /** @return array{status:string,result:string} */
          function minioHealth(): array
          {
              $context = stream_context_create(['http'=>['method'=>'GET','timeout'=>3,'follow_location'=>0,'ignore_errors'=>true]]);
              $stream = @fopen('http://host.docker.internal:9000/minio/health/live','rb',false,$context);
              $status = 'none';
              if (is_resource($stream)) {
                  $meta = stream_get_meta_data($stream); fclose($stream);
                  $headers = is_array($meta['wrapper_data'] ?? null) ? $meta['wrapper_data'] : [];
                  foreach ($headers as $header) if (is_string($header) && preg_match('/\AHTTP\/\S+\s+(\d{3})\b/',$header,$m) === 1) { $status=$m[1]; break; }
              }
              return ['status'=>$status,'result'=>$status === '200' ? 'PASS' : 'FAIL'];
          }

          $bootstrapOk=false; $diskIsS3=false; $credentialsPresent=false; $bucketPresent=false; $endpointPresent=false; $regionPresent=false; $pathStyleEnabled=false;
          $currentEndpointHostClass='other'; $currentEndpointPortIs9000=false; $currentEndpointHeadBucket='FAIL'; $currentEndpointHeadBucketErrorFamily='none'; $currentEndpointHeadBucketErrorCode='none'; $currentEndpointHeadBucketHttpStatus='none';
          $containerLoopbackEndpointConflict=false;
          $hostGatewayResolves=false; $hostGatewayPort9000Tcp='FAIL'; $hostGatewayMinioHealth='FAIL'; $hostGatewayMinioHealthHttpStatus='none'; $hostGatewayHeadBucket='FAIL'; $hostGatewayHeadBucketErrorFamily='none'; $hostGatewayHeadBucketErrorCode='none'; $hostGatewayHeadBucketHttpStatus='none';
          $intendedLocalEndpointViable=false; $configuredEndpointMatchesIntendedTopology=false; $rootBoundary='s3_endpoint_topology'; $rootClass='unknown'; $rootConfirmed=false; $failure=false;

          try {
              require 'vendor/autoload.php';
              $app = require 'bootstrap/app.php';
              $app->make(Kernel::class)->bootstrap();
              $bootstrapOk=true;
              $diskName=config('mhcs.private_object_disk'); $diskIsS3=$diskName === 's3'; $s3Config=config('filesystems.disks.s3');
              $credentialsPresent=is_array($s3Config) && is_string($s3Config['key'] ?? null) && trim($s3Config['key']) !== '' && is_string($s3Config['secret'] ?? null) && trim($s3Config['secret']) !== '';
              $bucketPresent=is_array($s3Config) && is_string($s3Config['bucket'] ?? null) && trim($s3Config['bucket']) !== ''; $endpointPresent=is_array($s3Config) && is_string($s3Config['endpoint'] ?? null) && trim($s3Config['endpoint']) !== ''; $regionPresent=is_array($s3Config) && is_string($s3Config['region'] ?? null) && trim($s3Config['region']) !== ''; $pathStyleEnabled=is_array($s3Config) && ($s3Config['use_path_style_endpoint'] ?? false) === true;
              $current=classifyEndpoint(is_array($s3Config) ? ($s3Config['endpoint'] ?? null) : null); $currentEndpointHostClass=$current['host_class']; $currentEndpointPortIs9000=$current['port_is_9000'];
              $containerLoopbackEndpointConflict = in_array(
                  $currentEndpointHostClass,
                  ['localhost', 'loopback_ip'],
                  true,
              );
              $configuredEndpointMatchesIntendedTopology=$currentEndpointHostClass === 'host_docker_internal' && $currentEndpointPortIs9000;
              if (! $diskIsS3 || ! is_array($s3Config) || ! $credentialsPresent || ! $bucketPresent || ! $regionPresent) throw new RuntimeException('incomplete S3 configuration');
              $disk=Storage::disk($diskName); if (! $disk instanceof AwsS3V3Adapter) throw new RuntimeException('configured disk is not S3');
              $currentClient=$disk->getClient(); $bucket=$disk->getConfig()['bucket'] ?? $s3Config['bucket'];
              try { $currentClient->headBucket(['Bucket'=>$bucket]); $currentEndpointHeadBucket='PASS'; } catch (Throwable $error) { $d=safeErrorDetails($error); $currentEndpointHeadBucketErrorFamily=$d['family']; $currentEndpointHeadBucketErrorCode=$d['code']; $currentEndpointHeadBucketHttpStatus=$d['status']; }
              $hostGatewayResolves=gethostbyname('host.docker.internal') !== 'host.docker.internal';
              if ($hostGatewayResolves) { $socket=@fsockopen('host.docker.internal',9000,$errno,$errorMessage,3); if (is_resource($socket)) { fclose($socket); $hostGatewayPort9000Tcp='PASS'; } }
              if ($hostGatewayPort9000Tcp === 'PASS') { $health=minioHealth(); $hostGatewayMinioHealth=$health['result']; $hostGatewayMinioHealthHttpStatus=$health['status']; }
              if ($hostGatewayMinioHealth === 'PASS') {
                  $localClient=new \Aws\S3\S3Client(['version'=>'latest','region'=>$s3Config['region'],'credentials'=>['key'=>$s3Config['key'],'secret'=>$s3Config['secret']],'endpoint'=>'http://host.docker.internal:9000','use_path_style_endpoint'=>$pathStyleEnabled]);
                  try { $localClient->headBucket(['Bucket'=>$bucket]); $hostGatewayHeadBucket='PASS'; } catch (Throwable $error) { $d=safeErrorDetails($error); $hostGatewayHeadBucketErrorFamily=$d['family']; $hostGatewayHeadBucketErrorCode=$d['code']; $hostGatewayHeadBucketHttpStatus=$d['status']; }
              }
              $intendedLocalEndpointViable=$hostGatewayPort9000Tcp === 'PASS' && $hostGatewayMinioHealth === 'PASS' && $hostGatewayHeadBucket === 'PASS';
              if ($intendedLocalEndpointViable && ! $configuredEndpointMatchesIntendedTopology) { $rootClass='configured_endpoint_not_intended_local_minio'; $rootConfirmed=true; } elseif ($intendedLocalEndpointViable) $rootClass='configured_endpoint_matches_intended_local_minio'; else $rootClass='intended_local_endpoint_unavailable';
          } catch (Throwable) { $failure=true; $rootClass='configuration_or_bootstrap'; }
          $failure=$failure || ! $bootstrapOk || ! $intendedLocalEndpointViable;

          echo 'laravel_bootstrap='.($bootstrapOk?'PASS':'FAIL').PHP_EOL; echo 'private_object_disk_is_s3='.($diskIsS3?'true':'false').PHP_EOL; echo 'credentials_present='.($credentialsPresent?'true':'false').PHP_EOL; echo 'bucket_present='.($bucketPresent?'true':'false').PHP_EOL; echo 'endpoint_present='.($endpointPresent?'true':'false').PHP_EOL; echo 'region_present='.($regionPresent?'true':'false').PHP_EOL; echo 'path_style_enabled='.($pathStyleEnabled?'true':'false').PHP_EOL;
          echo 'current_endpoint_host_class='.$currentEndpointHostClass.PHP_EOL; echo 'current_endpoint_port_is_9000='.($currentEndpointPortIs9000?'true':'false').PHP_EOL; echo 'current_endpoint_head_bucket='.$currentEndpointHeadBucket.PHP_EOL; echo 'current_endpoint_head_bucket_error_family='.$currentEndpointHeadBucketErrorFamily.PHP_EOL; echo 'current_endpoint_head_bucket_error_code='.$currentEndpointHeadBucketErrorCode.PHP_EOL; echo 'current_endpoint_head_bucket_http_status='.$currentEndpointHeadBucketHttpStatus.PHP_EOL;
          echo 'container_loopback_endpoint_conflict='.($containerLoopbackEndpointConflict?'true':'false').PHP_EOL;
          echo 'host_gateway_resolves='.($hostGatewayResolves?'true':'false').PHP_EOL; echo 'host_gateway_port_9000_tcp='.$hostGatewayPort9000Tcp.PHP_EOL; echo 'host_gateway_minio_health_http_status='.$hostGatewayMinioHealthHttpStatus.PHP_EOL; echo 'host_gateway_minio_health='.$hostGatewayMinioHealth.PHP_EOL; echo 'host_gateway_head_bucket='.$hostGatewayHeadBucket.PHP_EOL; echo 'host_gateway_head_bucket_error_family='.$hostGatewayHeadBucketErrorFamily.PHP_EOL; echo 'host_gateway_head_bucket_error_code='.$hostGatewayHeadBucketErrorCode.PHP_EOL; echo 'host_gateway_head_bucket_http_status='.$hostGatewayHeadBucketHttpStatus.PHP_EOL;
          echo 'intended_local_endpoint_viable='.($intendedLocalEndpointViable?'true':'false').PHP_EOL; echo 'configured_endpoint_matches_intended_topology='.($configuredEndpointMatchesIntendedTopology?'true':'false').PHP_EOL; echo 'configured_endpoint_root_cause_boundary='.$rootBoundary.PHP_EOL; echo 'configured_endpoint_root_cause_class='.$rootClass.PHP_EOL; echo 'configured_endpoint_root_cause_confirmed='.($rootConfirmed?'true':'false').PHP_EOL; echo 's3_probe_executed=false'.PHP_EOL; echo 'PRODUCTION_S3_DIAGNOSTIC_STATUS='.($failure?'FAIL':'PASS').PHP_EOL;
          exit($failure?1:0);
          PHP
          )"; then :; else diagnostic_exit=$?; fi
          printf '%s\n' "$diagnostic_output"
          host_gateway_port_9000_tcp="$(printf '%s\n' "$diagnostic_output" | awk -F= '$1 == "host_gateway_port_9000_tcp" {print $2; exit}')"
          [ -n "$host_gateway_port_9000_tcp" ] || host_gateway_port_9000_tcp=FAIL
          if [ "$host_local_minio_confirmed" = true ] && [ "$host_port_9000_loopback_only" = true ] && [ "$host_gateway_port_9000_tcp" = FAIL ]; then
            container_host_gateway_failure_explained=true
            host_listener_root_boundary=minio_host_binding
            host_listener_root_class=minio_bound_to_host_loopback_only
            host_listener_root_confirmed=true
          elif [ "$host_local_minio_confirmed" = true ] && [ "$host_port_9000_has_nonloopback_bind" = true ] && [ "$host_gateway_port_9000_tcp" = FAIL ]; then
            container_host_gateway_failure_explained=false
            host_listener_root_boundary=docker_host_gateway_connectivity
            host_listener_root_class=nonloopback_minio_listener_but_container_tcp_failed
            host_listener_root_confirmed=false
          fi
          echo "host_port_9000_listener_present=$host_port_9000_listener_present"
          echo "host_port_9000_bind_class=$host_port_9000_bind_class"
          echo "host_port_9000_has_loopback_ipv4=$host_port_9000_has_loopback_ipv4"
          echo "host_port_9000_has_loopback_ipv6=$host_port_9000_has_loopback_ipv6"
          echo "host_port_9000_has_all_ipv4=$host_port_9000_has_all_ipv4"
          echo "host_port_9000_has_all_ipv6=$host_port_9000_has_all_ipv6"
          echo "host_port_9000_has_nonloopback_specific=$host_port_9000_has_nonloopback_specific"
          echo "host_port_9000_loopback_only=$host_port_9000_loopback_only"
          echo "host_port_9000_has_nonloopback_bind=$host_port_9000_has_nonloopback_bind"
          echo "host_loopback_minio_health_http_status=$host_loopback_minio_health_http_status"
          echo "host_loopback_minio_health=$host_loopback_minio_health"
          echo "host_port_9000_owner_class=$host_port_9000_owner_class"
          echo "docker_port_9000_published=$docker_port_9000_published"
          echo "host_listener_inspection=$host_listener_inspection"
          echo "host_local_minio_confirmed=$host_local_minio_confirmed"
          echo "container_host_gateway_failure_explained=$container_host_gateway_failure_explained"
          echo "root_cause_boundary=$host_listener_root_boundary"
          echo "root_cause_class=$host_listener_root_class"
          echo "root_cause_confirmed=$host_listener_root_confirmed"
          exit "$diagnostic_exit"
