name: Classify AWS endpoint secret

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  classify:
    runs-on: ubuntu-latest
    env:
      AWS_ENDPOINT_VALUE: ${{ secrets.AWS_ENDPOINT }}
    steps:
      - name: Classify secret locally
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import ipaddress
          import os
          import re
          from urllib.parse import urlsplit

          raw = os.environ.get("AWS_ENDPOINT_VALUE", "")
          present = bool(raw.strip())
          scheme_class = "missing"
          host_class = "missing"
          host_is_s3 = False
          uses_port_9000 = False
          parsed = None
          host = ""

          if present:
              candidate = raw.strip()
              scheme_match = re.match(r"\A([A-Za-z][A-Za-z0-9+.-]*)://", candidate)
              scheme = scheme_match.group(1).lower() if scheme_match else ""
              scheme_class = scheme if scheme in {"http", "https"} else ("other" if scheme else "missing")
              try:
                  parsed = urlsplit(candidate if scheme else "//" + candidate)
                  host = (parsed.hostname or "").lower()
                  try:
                      uses_port_9000 = parsed.port == 9000
                  except ValueError:
                      uses_port_9000 = False
              except ValueError:
                  parsed = None

              host_is_s3 = host == "s3.mhcsgo.cloud"
              if not host:
                  host_class = "other"
              elif host_is_s3:
                  host_class = "s3_mhcsgo_cloud"
              elif host == "host.docker.internal":
                  host_class = "host_gateway"
              else:
                  try:
                      address = ipaddress.ip_address(host)
                  except ValueError:
                      host_class = "domain"
                  else:
                      if (address.version == 4 and address in ipaddress.ip_network("127.0.0.0/8")) or host == "::1":
                          host_class = "loopback"
                      elif address.version == 4 and (
                          address in ipaddress.ip_network("10.0.0.0/8")
                          or address in ipaddress.ip_network("172.16.0.0/12")
                          or address in ipaddress.ip_network("192.168.0.0/16")
                      ):
                          host_class = "private_ip"
                      else:
                          host_class = "other"

          endpoint_class = "missing" if not present else (
              "s3_mhcsgo_cloud" if host_is_s3 else (
                  "explicit_port_9000" if uses_port_9000 else "other"
              )
          )
          print(f"aws_endpoint_present={'true' if present else 'false'}")
          print(f"aws_endpoint_host_is_s3_mhcsgo_cloud={'true' if host_is_s3 else 'false'}")
          print(f"aws_endpoint_uses_explicit_port_9000={'true' if uses_port_9000 else 'false'}")
          print(f"aws_endpoint_scheme_class={scheme_class}")
          print(f"aws_endpoint_host_class={host_class}")
          print(f"aws_endpoint_class={endpoint_class}")
          PY
